 in Macau, China. Contact | Disclaimer | Statement of Faith | Mission | Copyrights"]]}, {"ref": "1 ነገሥት 2:13-25", "key": 6, "v": [[13, "የአጊት ልጅ አዶንያስም ወደ ሰሎሞን እናት ወደ ቤርሳቤህ መጣ፤ እርስዋም። ወደ እኔ መምጣትህ በሰላም ነውን? አለች፤"], [14, "እርሱም። በሰላም ነው አለ። ደግሞም። ከአንቺ ጋር ጉዳይ አለኝ አለ፤ እርስዋም። ተናገር አለች።"], [15, "እርሱም። መንግሥቱ ለእኔ እንደ ነበረ፥ እስራኤልም ሁሉ ንጉሥ እሆን ዘንድ ፊታቸውን ወደ እኔ አድርገው እንደ ነበረ አንቺ ታውቂያለሽ፤ ነገር ግን ከእግዚአብሔር ዘንድ ሆኖለታልና መንግሥቱ ከእኔ አልፎ ለወንድሜ ሆኖአል።"], [16, "አሁንም አንዲት ልመና እለምንሻለሁ፤ አታሳፍሪኝ አለ። እርስዋም። ተናገር አለችው።"], [17, "እርሱም። አያሳፍርሽምና ሱነማይቱን አቢሳን ይድርልኝ ዘንድ ለንጉሡ ለሰሎሞን እንድትነግሪው እለምንሻለሁ አለ።"], [18, "ቤርሳቤህም። መልካም ነው፥ ስለ አንተ ለንጉሡ እነግረዋለሁ አለች።"], [19, "ቤርሳቤህም የአዶንያስን ነገር ትነግረው ዘንድ ወደ ንጉሡ ወደ ሰሎሞን ገባች፤ ንጉሡም ሊቀበላት ተነሣ ሳማትም፥ በዙፋኑም ተቀመጠ፤ ለንጉሡም እናት ወንበር አስመጣላት፥ በቀኙም ተቀመጠች።"], [20, "እርስዋም። አንዲት ታናሽ ልመና እለምንሃለሁ፤ አታሳፍረኝ አለች። ንጉሡም። እናቴ ሆይ፥ አላሳፍርሽምና ለምኝ አላት።"], [21, "እርስዋም። ሱነማይቱ አቢሳ ለወንድምህ ለአዶንያስ ትዳርለት አለች።"], [22, "ንጉሡም ሰሎሞን ለእናቱ መልሶ። ሱነማይቱን አቢሳን ለአዶንያስ ለምን ትለምኝለታለሽ? ታላቅ ወንድሜ ነውና መንግሥትን ደግሞ ለምኚለት፤ ካህኑም አብያታርና የጽሩያ ልጅ ኢዮአብ ደግሞ ከእርሱ ጋር ናቸው አላት።"], [23, "ንጉሡም ሰሎሞን። አዶንያስ ይህን ቃል በሕይወቱ ላይ አለመናገሩ እንደ ሆነ እግዚአብሔር ይህን ያድርግብኝ፥ ይህንም ይጨምርብኝ።"], [24, "አሁንም ያጸናኝ፥ በአባቴም በዳዊት ዙፋን ላይ ያስቀመጠኝ፥ እንደ ተናገረውም ቤትን የሠራልኝ ሕያው እግዚአብሔርን! ዛሬ አዶንያስ ፈጽሞ ይገደላል ብሎ በእግዚአብሔር ማለ።"], [25, "ንጉሡም ሰሎሞን የዮዳሄን ልጅ በናያስን ላከ፤ እርሱም ወደቀበት፥ ሞተም።"]]}, {"ref": "ዘፀአት 2:1-10", "key": -1, "v": [[1, "ከሌዊ ወገንም አንድ ሰው ሄዶ የሌዊን ልጅ አገባ።"], [2, "ሴቲቱም ፀነሰች፥ ወንድ ልጅም ወለደች፤ መልካምም እንደሆነ ባየች ጊዜ ሦስት ወር ሸሸገችው።"], [3, "ደግሞም ልትሸሽገው ባልቻለች ጊዜ፥ የደንገል ሣጥን ለእርሱ ወስዳ ዝፍትና ቅጥራን ለቀለቀችው፤ ሕፃኑንም አኖረችበት፥ በወንዝም ዳር ባለ በቄጠማ ውስጥ አስቀመጠችው።"], [4, "እኅቱም የሚደረግበትን ታውቅ ዘንድ በሩቅ ቆማ ትጎበኘው ነበር።"], [5, "የፈርዖንም ልጅ ልትታጠብ ወደ ወንዝ ወረደች፤ ደንገጥሮችዋም በወንዝ ዳር ይሄዱ ነበር፤ ሣጥኑንም በቄጠማ ውስጥ አየች፥ ደንገጥርዋንም ልካ አስመጣችው።"], [6, "በከፈተችውም ጊዜ ሕፃኑን አየች፥ እነሆም ሕፃኑ ያለቅስ ነበር፤ አዘነችለትም። ይህ ከዕብራውያን ልጆች አንድ ነው አለች።"], [7, "እኅቱም ለፈርዖን ልጅ። ሕፃኑን ታጠባልሽ ዘንድ ሄጄ የምታጠባ ሴት ከዕብራውያን ሴቶች ልጥራልሽን? አለቻት።"], [8, "የፈርዖንም ልጅ። ሂጂ አለቻት፤ ብላቴናይቱም ሄዳ የሕፃኑን እናት ጠራች።"], [9, "የፈርዖንም ልጅ። ይህን ሕፃን ወስደሽ አጥቢልኝ፥ ዋጋሽንም እሰጥሻለሁ አለቻት። ሴቲቱም ሕፃኑን ወስዳ አጠባችው።"], [10, "ሕፃኑም አደገ፥ ወደ ፈርዖንም ልጅ ዘንድ አመጣችው፥ ለእርስዋም ልጅ ሆነላት። እኔ ከውኃ አውጥቼዋለሁና ስትልም ስሙን ሙሴ ብላ ጠራችው።"]]}, {"ref": "ዘፀአት 2:15-22", "key": 6, "v": [[15, "ፈርዖንም ይህን ነገር በሰማ ጊዜ ሙሴን ሊገድለው ፈለገ። ሙሴ ግን ከፈርዖን ፊት ኰበለለ፥ በምድያምም ምድር ተቀመጠ፤ በውኃም ጕድጓድ አጠገብ ዐረፈ።"], [16, "ለምድያምም ካህን ሰባት ሴቶች ልጆች ነበሩት፤ እነርሱም መጥተው ውኃ ቀዱ፥ የአባታቸውንም በጎች ሊያጠጡ የውኃውን ገንዳ ሞሉ።"], [17, "እረኞችም መጥተው ገፉአቸው፤ ሙሴ ግን ተነሥቶ ረዳቸው፥ በጎቻቸውንም አጠጣላቸው።"], [18, "ወደ አባታቸው ወደ ራጉኤልም በመጡ ጊዜ። ስለ ምን ዛሬ ፈጥናችሁ መጣችሁ? አላቸው።"], [19, "እነርሱም። አንድ የግብፅ ሰው ከእረኞች እጅ አዳነን፥ ደግሞም ቀዳልን፥ በጎቻችንንም አጠጣ አሉ።"], [20, "ልጆቹንም። እርሱ ወዴት ነው? ለምንስ ያንን ሰው ተዋችሁት? ጥሩት እንጀራም ይብላ አላቸው።"], [21, "ሙሴም ከዚያ ሰው ጋር ሊቀመጥ ወደደ፤ ልጁንም ሲፓራን ለሙሴ ሚስት ትሆነው ዘንድ ሰጠው።"], [22, "ወንድ ልጅም ወለደች። በሌላ ምድር መጻተኛ ነኝ ሲል ስሙን ጌርሳም ብሎ ጠራው።"]]}, {"ref": "2 ጢሞቴዎስ 1:3-7", "key": 2, "v": [[3, "ሌትና ቀን በልመናዬ ሳላቋርጥ ስለማስብህ እንደ አባቶቼ አድርጌ በንጹሕ ሕሊና የማመልከውን እግዚአብሔርን አመሰግናለሁ፤"], [4, "እንባህን እያሰብሁ በደስታ እሞላ ዘንድ ላይህ እናፍቃለሁ።"], [5, "በአንተ ያለውን ግብዝነት የሌለበትን እምነትህን አስባለሁ፤ ይህም እምነት ቀድሞ በአያትህ በሎይድ በእናትህም በኤውንቄ ነበረባቸው፥ በአንተም ደግሞ እንዳለ ተረድቼአለሁ።"], [6, "ስለዚህ ምክንያት፥ እሳት እንደሚያቀጣጥል ሰው፥ እጆቼን በመጫኔ በአንተ ያለውን የእግዚአብሔርን ስጦታ እንድታነሣሣ አሳስብሃለሁ።"], [7, "እግዚአብሔር የኃይልና የፍቅር ራስንም የመግዛት መንፈስ እንጂ የፍርሃት መንፈስ አልሰጠንምና።"]]}, {"ref": "ሐዋርያት ሥራ 9:36-42", "key": 0, "v": [[36, "በኢዮጴም ጣቢታ የሚሉአት አንዲት ደቀ መዝሙር ነበረች፥ ትርጓሜውም ዶርቃ ማለት ነው፤ እርስዋም መልካም ነገር የሞላባት ምጽዋትም የምታደርግ ነበረች።"], [37, "በዚያም ወራት ታመመችና ሞተች፤ አጥበውም በሰገነት አኖሩአት።"], [38, "ልዳም ለኢዮጴ ቅርብ ናትና ደቀ መዛሙርት ጴጥሮስ በዚያ እንዳለ ሰምተው፥ ወደ እነርሱ ከመምጣት እንዳይዘገይ እየለመኑ ሁለት ሰዎች ወደ እርሱ ላኩ።"], [39, "ጴጥሮስም ተነሥቶ ከእነርሱ ጋር መጣ፤ በደረሰም ጊዜ በሰገነት አወጡት መበለቶችም ሁሉ እያለቀሱ ዶርቃ ከእነርሱ ጋር ሳለች ያደረገቻቸውን ቀሚሶችንና ልብሶችን ሁሉ እያሳዩት በፊቱ ቆሙ።"], [40, "ጴጥሮስም ሁሉን ወደ ውጭ አስወጥቶ ተንበርክኮም ጸለየ፥ ወደ ሬሳውም ዘወር ብሎ። ጣቢታ ሆይ፥ ተነሺ አላት። እርስዋም ዓይኖችዋን ከፈተች ጴጥሮስንም ባየች ጊዜ ተቀመጠች።"], [41, "እጁንም ለእርስዋ ሰጥቶ አስነሣት፤ ቅዱሳንንና መበለቶችንም ጠራ ሕያውም ሆና በፊታቸው አቆማት።"], [42, "ይህም በኢዮጴ ሁሉ የታወቀ ሆነ፥ ብዙ ሰዎችም በጌታ አመኑ።"]]}, {"ref": "መሳፍንት 4:17-22", "key": 4, "v": [[17, "ሲሣራ ግን በእግሩ ወደ ኬናዊው ወደ ኬቤር ሚስት ወደ ኢያዔል ድንኳን ሸሸ፤ በሐጾር ንጉሥ በያቢንና በኬናዊው በኬቤር ቤት መካከል ሰላም ነበረና።"], [18, "ኢያዔልም ሲሣራን ለመገናኘት ወጣችና። ወደ እኔ ግባ፥ ጌታዬ ሆይ፥ ወደ እኔ ግባ፥ አትፍራ አለችው። እርሱም ወደ ድንኳኑ ወደ እርሷ ገባ፥ እርሷም በብርድ ልብስ ሸፈነችው።"], [19, "እርሱም። ጥቂት ውኃ አጠጪኝ፥ ተጠምቻለሁና አላት። እርስዋም የወተት እንስራ ከፍታ አጠጣችው፥ እንደገናም ሸፈነችው።"], [20, "እርሱም። በድንኳኑ በር ቁሚ፥ ሰውም መጥቶ። ሰው እዚህ አለን? ብሎ ቢጠይቅሽ። የለም በዩ አላት።"], [21, "የኬቤር ሚስት ኢያዔልም የድንኳኑን ችካል ወስዳ መዶሻንም በእጇ ይዛ በዝግታ ወደ እርሱ መጣች፥ እርሱም ተኝቶ ደክሞ ነበርና ችካሉን በጭንቅላቱ መትታ ወደ መሬት አሳለፈችው፤ እርሱም በእግሮቿ መካከል ወድቆ ሞተ።"], [22, "እነሆም ባርቅ ሲሣራን ሲያሳድድ መጣ፤ ኢያዔልም ሊገናኘው ወጣችና። ኑ፥ የምትፈልገውን ሰው አሳይሻለሁ አለችው። እርሱም ወደ እርሷ ገባ፥ እነሆም ሲሣራ ወድቆ ሞቷል፥ ችካሉም በጭንቅላቱ ውስጥ ነበረ።"]]}, {"ref": "2 ነገሥት 22:14-20", "key": 2, "v": [[14, "ካህኑ ኂልቅያም አቂቃምም አክቦርም ሳፋንም አሣያም ወደ ነቢይቱ ወደ ሕልዳና ሄዱ፥ እርስዋም የልብስ ጠባቂ የቲቅዋ ልጅ የሐርሐስ ልጅ የሳሎም ሚስት ነበረች፥ በኢየሩሳሌምም በሁለተኛው ክፍል ትኖር ነበር፤ እነርሱም ነገሩአት።"], [15, "እርስዋም። ለላካችሁ ሰው እንዲህ በሉት አላቸው። እንዲህ ይላል የእስራኤል አምላክ እግዚአብሔር፤ ለላከኻችሁ ሰው እንዲህ በሉት፤"], [16, "እንዲህ ይላል እግዚአብሔር። እነሆ፥ በዚህ ስፍራና በእርሱም ላይ በሚኖሩት ላይ ክፉ ነገርን አመጣለሁ፥ የይሁዳ ንጉሥ ያነበበውን የመጽሐፉን ቃል ሁሉ እፈጽማለሁ።"], [17, "እኔን ትተው ለሌሎች አማልክት ዕጣን ስለ አጠኑ፥ በእጆቻቸውም ሥራ ሁሉ ስለ አስቆጡኝ ቍጣዬ በዚህ ስፍራ ላይ ይነዳል፥ አይጠፋም።"], [18, "ወደ እኔም እንድትጠይቁ ላካችሁ ለይሁዳ ንጉሥ ግን እንዲህ በሉት። እንዲህ ይላል የእስራኤል አምላክ እግዚአብሔር። የሰማኸውን ቃል ስለዚህ፤"], [19, "ልብህ ረክሷልና፥ ስለዚህ ስፍራና በእርሱ ላይ ስለሚኖሩት ርግማንና ውድመት ይሆናል ብዬ የተናገርሁትን በሰማህ ጊዜ በእግዚአብሔር ፊት ራስህን አዋርደሃልና፥ ልብስህንም ቀድደሃልና፥ በፊቴም አለቅሰሃልና፥ እኔም ሰምቼአለሁ፥ ይላል እግዚአብሔር።"], [20, "ስለዚህ እነሆ፥ ወደ አባቶችህ እሰበስብሃለሁ፥ ወደ መቃብርህም በሰላም ትሰበሰባለህ፥ እኔም በዚህ ስፍራ ላይ የማመጣውን ክፉ ነገር ሁሉ ዓይኖችህ አያዩም። እነርሱም ለንጉሡ መልስ አመጡለት።"]]}, {"ref": "መሳፍንት 1:12-15", "key": 3, "v": [[12, "ካሌብም። ቂርያት-ሴፌርን የሚመታትና የሚይዛት ሰው ሴት ልጄን ዓክሳን ለሚስት እሰጠዋለሁ አለ።"], [13, "የካሌብም ታናሽ ወንድም የቄናዝ ልጅ ኦትኒኤል ያዛት፤ እርሱም ሴት ልጁን ዓክሳን ለሚስት ሰጠው።"], [14, "እርስዋም ስትመጣ ከአባቷ እርሻ እንድትጠይቅ አባበለቻት፤ እርስዋም ከአህያይቱ ወረደች፤ ካሌብም። ምን ይሻልሽ? አላት።"], [15, "እርስዋም። በረከት ስጠኝ፤ ወደ ደቡብ ምድር ሰጥተኸኛልና የውኃ ምንጮችንም ስጠኝ አለችው። ካሌብም የላይኞቹን ምንጮችና የታችኞቹን ምንጮች ሰጣት።"]]}, {"ref": "ዘፍጥረት 41:45-52", "key": 5, "v": [[45, "ፈርዖንም ዮሴፍን ጻፍናት-ጳኔሐ ብሎ ጠራው፤ የአን ካህን የፖቲ-ፈራንም ሴት ልጅ አስናትን ለሚስት ሰጠው፤ ዮሴፍም በግብፅ ምድር ሁሉ ላይ ወጣ።"], [46, "ዮሴፍም በግብፅ ንጉሥ በፈርዖን ፊት በቆመ ጊዜ ዕድሜው ሠላሳ ዓመት ነበረ፤ ዮሴፍም ከፈርዖን ፊት ወጥቶ በግብፅ ምድር ሁሉ አለፈ።"], [47, "በሰባቱም የመልካም ዓመታት ምድሪቱ እፍኝ እፍኝን አስገኘች።"], [48, "በግብፅ ምድርም በነበሩት በሰባቱ ዓመታት የነበረውን እህል ሁሉ ሰበሰበ፥ እህሉንም በከተሞች ውስጥ አኖረ፤ በዙሪያዋም ያለውን የእርሻ እህል በየከተማይቱ ውስጥ አኖረ።"], [49, "ዮሴፍም እንደ ባሕር አሸዋ እጅግ ብዙ እህል ሰበሰበ፥ እስኪተው ድረስ ቍጥሩ እጅግ ብዙ ነበረና አልተቈጠረም።"], [50, "የራብ ዓመታትም ሳይመጡ ለዮሴፍ ሁለት ልጆች ተወለዱ፥ የአን ካህን የፖቲፈራ ሴት ልጅ አስናት ወለደችለት።"], [51, "ዮሴፍም ለትልቁ ልጁ ምናሴ ብሎ ጠራው፤ እግዚአብሔር መከራዬን ሁሉ የአባቴንም ቤት ሁሉ አስረስቶኛልና አለ።"], [52, "ለትናሹም። እግዚአብሔር በችግሬ ምድር አፍርቶኛልና ብሎ ኤፍሬም ብሎ ጠራው።"]]}, {"ref": "አስቴር 1:9-19", "key": 3, "v": [[9, "ንግሥቲቱ አስጢንም በንጉሥ አርታኽስስቴስ ቤት ለሴቶች ግብዣ አደረገች።"], [10, "በሰባተኛውም ቀን የንጉሥ ልብ በወይኑ በደስታ በተመሰጠ ጊዜ ንግሥቲቱን አስጢንን በንጉሥ ፊት ውበቷን ለሕዝቡና ለአለቆች ያሳይ ዘንድ በንግሥ ዘውድ እንድትመጣ ሜሁማንን ቢዝታን ሐርቦናን ቢግታን አባግታን ዜታርን ካርካስንም ሰባቱን ጃንደረቦች አዘዛቸው።"], [11, "ንግሥቲቱም በመልክዋ ውብ ነበረችና ውበቷን ለሕዝቡና ለአለቆች ያሳይ ዘንድ በንግሥ ዘውድ እንድትመጣ ነገራቸው።"], [12, "ንግሥቲቱ አስጢንም ንጉሡ በጃንደረቦቹ እጅ የላከውን ቃል እምቢ ብላ አልመጣችም፤ ንጉሡም እጅግ ተቆጣ፥ ቍጣውም በእርሱ ውስጥ ነደደ።"], [13, "ንጉሡም ከሕግ አዋቂዎችና ከዘመን አዋቂዎች ጋር ተጠይቆ ነበርና፤ የንጉሥም ልማድ እንዲህ ነበረ።"], [14, "በአጠገቡም የነበሩት የፋርስና የማርዶስ አለቆች ሰባቱ ካርሺና ሼታር አድማታ ታርሲስ ሜሬስ ማርሴና ሙሙካን ነበሩ፥ እነርሱም የንጉሡን ፊት ያዩና በመንግሥቱም በፊተኛው ስፍራ የሚቀመጡ ነበሩ።"], [15, "ንጉሡም። ንግሥቲቱ አስጢን ንጉሥ አርታኽስስቴስ በጃንደረቦቹ እጅ የላከውን ቃል ስላልፈጸመች በሕግ ምን ይደረግባታል? አላቸው።"], [16, "ሙሙካንም በንጉሡና በአለቆቹ ፊት እንዲህ አለ። ንግሥቲቱ አስጢን ንጉሡን ብቻ ሳይሆን በአርታኽስስቴስ ንጉሥ አገሮች ሁሉ ውስጥ ያሉትን አለቆችና ሕዝብ ሁሉ በድላለች።"], [17, "የንግሥቲቱም ሥራ ለሴቶች ሁሉ ይወጣል፥ ባሎቻቸውንም እንዲንቁ ያደርጋቸዋል፤ ንጉሥ አርታኽስስቴስ ንግሥቲቱ አስጢን ወደ እርሱ እንድትመጣ አዞአል፥ እርስዋም አልመጣችም ይላሉ።"], [18, "የፋርስና የማርዶስ አለቆች ሚስቶችም የንግሥቲቱን ቃል የሰሙ ዛሬ ለንጉሡ አለቆች ሁሉ እንደዚሁ ይላሉ፤ እጅግ ብዙ ንቀትና ቍጣ ይሆናል።"], [19, "ለንጉሡም መልካም ሆኖ ቢታይ የንግሥ ትእዛዝ ከእርሱ ይውጣ፥ በፋርስና በማርዶስ ሕጋጋትም ውስጥ አስጢን ከእንግዲህ ወዲህ ወደ ንጉሥ አርታኽስስቴስ ፊት እንዳትመጣ ይጻፍ፤ ንግሥታዊ ክብሯንም ንጉሡ ከእርሷ ይልቅ ለመልካም ለሌላይቱ ይስጠው።"]]}, {"ref": "ሩት 1:1-14", "key": 13, "v": [[1, "በዳኞችም በሚፈርዱበት ዘመን ራብ በአገር ሆነ፤ አንድ ሰውም ከይሁዳ ቤተልሔም ሚስቱንና ሁለት ልጆቹን ይዞ በሞዓብ አገር ሊቀመጥ ሄደ።"], [2, "የሰውየውም ስም አሊሜሌክ፥ የሚስቱም ስም ኑኃሚን፥ የሁለቱም ልጆቹ ስም ማሕሎንና ክልዮን ነበረ፥ እነርሱም ከይሁዳ ቤተልሔም ኤፍራታውያን ነበሩ፤ ወደ ሞዓብ አገርም መጥተው በዚያ ኖሩ።"], [3, "የኑኃሚንም ባል አሊሜሌክ ሞተ፥ እርስዋም ከሁለቱ ልጆቿ ጋር ቀረች።"], [4, "እነርሱም ከሞዓብ ሴቶች ሚስት አገቡ፤ የአንዲቱ ስም ዖርፋ፥ የሌላይቱም ስም ሩት ነበረ፤ በዚያም አሥር ዓመት ያህል ኖሩ።"], [5, "ሁለቱም ማሕሎንና ክልዮን ሞቱ፤ ሴቲቱም ከሁለቱ ልጆቿና ከባሏ ቀረች።"], [6, "እርስዋም ከምራቶቿ ጋር ከሞዓብ አገር ለመመለስ ተነሣች፤ እግዚአብሔር ሕዝቡን ጎብኝቶ እህል እንደ ሰጣቸው በሞዓብ አገር ሰምታ ነበርና።"], [7, "በነበረችበትም ስፍራ ወጣች፥ ሁለቱም ምራቶቿም ከእርስዋ ጋር ነበሩ፤ ወደ ይሁዳ አገርም ለመመለስ በመንገድ ሄዱ።"], [8, "ኑኃሚንም ሁለቱን ምራቶቿን። ሂዱ፥ እያንዳንዳችሁም ወደ እናታችሁ ቤት ተመለሱ፤ እናንተም ከሙታኑ ጋር ከእኔም ጋር እንዳደረጋችሁት ምሕረት እግዚአብሔር ከእናንተ ጋር ያድርግ አላቸው።"], [9, "እግዚአብሔርም እያንዳንዳችሁ በባሏችሁ ቤት ዕረፍት እንድታገኙ ይስጣችሁ አለች፤ ሳመቻቸውም፤ እነርሱም ድምፃቸውን አንሥተው አለቀሱ።"], [10, "እነርሱም። አይሆንም፥ ከአንቺ ጋር ወደ ሕዝብሽ እንመለሳለን አሉአት።"], [11, "ኑኃሚንም። ሴቶች ልጆቼ ሆይ፥ ተመለሱ፤ ለምን ከእኔ ጋር ትሄዳላችሁ? ለእናንተ ባል ይሆኑ ዘንድ እኔ በማኅፀኔ ውስጥ ገና ወንዶች ልጆች አሉኝን? አለች።"], [12, "ሴቶች ልጆቼ ሆይ፥ ተመለሱ፥ ሂዱ፤ እኔ ሽምግልና ነኝና ባል አላገኝም፤ ተስፋ አለኝ ብዬም ዛሬ ሌሊት ባል ብላገኝ ወንዶች ልጆችንም ብወልድ፥"], [13, "እነርሱ እስኪያድጉ ድረስ ትጠብቃላችሁን? ስለ እነርሱ ባል እንዳታገቡ ትቆያላችሁን? ሴቶች ልጆቼ ሆይ፥ አይሆንም፤ የእግዚአብሔርም እጅ በእኔ ላይ ስለ ወጣች ስለ እናንተ እጅግ አዝናለሁ አለች።"], [14, "ድምፃቸውንም አነሡና አለቀሱ፤ ዖርፋም አማቷን ሳመች፥ ሩት ግን ከእርስዋ ጋር ተጣበቀች።"]]}, {"ref": "1 ሳሙኤል 19:11-17", "key": 1, "v": [[11, "ሳኦልም ዳዊትን ጠብቀው በነጋውም ይገድሉት ዘንድ ወደ ዳዊት ቤት መልእክተኞችን ላከ፤ የዳዊት ሚስት ሜልኮልም። ጠላትህን እንድትሸሽ ዛሬ ሌሊት ራስህን ባታድን ነገ ትሞታለህ ብላ ነገረችው።"], [12, "ሜልኮልም ዳዊትን በመስኮቱ አወረደችው፤ እርሱም ሄደ፥ ሸሸ፥ ዳነም።"], [13, "ሜልኮልም ሐውልቱን ወስዳ በአልጋው ላይ አኖረችው፥ የፍየል ጠጕር በእራሱም ላይ አኖረች፥ በልብስም ሸፈነችው።"], [14, "ሳኦልም ዳዊትን ይይዙ ዘንድ መልእክተኞችን በላከ ጊዜ እርስዋ። ታሞአል አለች።"], [15, "ሳኦልም ዳዊትን እንዲያዩት መልእክተኞችን ላከ። በአልጋው ወደ እኔ አምጡት፥ እገድለው ዘንድ አለ።"], [16, "መልእክተኞቹም በገቡ ጊዜ እነሆ፥ ሐውልቱ በአልጋው ላይ የፍየልም ጠጕር በእራሱ ላይ ነበረ።"], [17, "ሳኦልም ሜልኮልን። ለምን እንዲህ አታለልሽኝ፥ ጠላቴንም ሸሽቶ እንዲድን ለምን ላክሽው? አላት፤ ሜልኮልም ሳኦልን። እርሱ። ንገሪኝ፥ እንዲሸሽ ልቀቀው፥ አለዚያ እገድልሻለሁ አለኝ አለችው።"]]}, {"ref": "2 ነገሥት 11:1-3", "key": 1, "v": [[1, "አኃዝያስም በሞተ ጊዜ እናቱ አታሊያ የንጉሡን ዘር ሁሉ አጠፋች።"], [2, "የንጉሥ ዮራም ሴት ልጅ የአኃዝያስ እኅት ዮሳቤት ግን ከሚገደሉት ከንገሥታት ልጆች መካከል የንጉሡን ልጅ ዮአሽን ሰርቃ ወሰደችው፥ ሞግዚቱንም ከእርሱ ጋር በመኝታ ቤት ውስጥ ደበቀቻቸው።"], [3, "እርሱም ከእርስዋ ጋር በእግዚአብሔር ቤት ውስጥ ስድስት ዓመታት ተሰውሮ ኖረ፤ አታሊያም በአገሪቱ ላይ ነገሠች።"]]}, {"ref": "2 ሳሙኤል 21:10-14", "key": 0, "v": [[10, "የአያ ሴት ልጅ ሪጽፋም ማቅ ወስዳ በአለት ላይ ለራሷ አነጠፈች፥ ከምርት መጀመሪያ ጀምራ እስከ ሰማይ ውኃ እስኪዘንብባቸው ድረስ፤ በቀንም የሰማይ ወፎች፥ በሌሊትም የምድር አራዊት በእነርሱ ላይ እንዳያርፉ አልፈቀደችም።"], [11, "የአያ ልጅ የሳኦል ክብር ሪጽፋ ያደረገችውን ለዳዊት ነገሩት።"], [12, "ዳዊትም ሄዶ የሳኦልን አጽም የልጁንም የዮናታንን አጽም ከያቤስ ገለዓድ ሰዎች ወሰደ፤ እነርሱም ፍልስጥኤማውያን ሳኦልን በጌልቦዓ በገደሉት ቀን ከቤት-ሳን አደባባይ ሰርቀውት ነበር።"], [13, "የሳኦልንም አጽም የልጁም የዮናታንን አጽም ከዚያ አወጣ፥ የተሰቀሉትንም አጽም ሰበሰቡ።"], [14, "የሳኦልንም የልጁም የዮናታንን አጽም በብንያም አገር በጼላ በአባቱ በቂስ መቃብር ቀበሩአቸው፥ ንጉሡም ያዘዘውን ሁሉ ፈጸሙ፤ ከዚህም በኋላ እግዚአብሔር ስለ አገሪቱ ጸሎትን ተቀበለ።"]]}, {"ref": "ዘፀአት 1:15-21", "key": 2, "v": [[15, "የግብፅ ንጉሥም ለዕብራውያን አዋላጆች፥ አንዲቱ ሲፓራ ሁለተኛይቱም ፉሐ ተብላለችና፥ እንዲህ አላቸው።"], [16, "ዕብራውያኑን ሴቶች ስታወልዱአቸው በወሊድ መቀመጫ ላይ እዩአቸው፤ ወንድ ልጅ ቢሆን ግደሉት፥ ሴት ልጅ ብትሆንም በሕይወት ትኑር።"], [17, "አዋላጆቹ ግን እግዚአብሔርን ፈርተው የግብፅ ንጉሥ እንዳዘዛቸው አልፈጸሙም፥ ወንድ ሕፃናቱንም በሕይወት አኖሩአቸው።"], [18, "የግብፅ ንጉሥም አዋላጆቹን ጠርቶ። ይህን ነገር ለምን አደረጋችሁ? ወንድ ሕፃናቱንም ለምን በሕይወት አኖራችኋቸው? አላቸው።"], [19, "አዋላጆቹም ፈርዖንን። ዕብራውያኑ ሴቶች እንደ ግብፃውያን ሴቶች አይደሉምና፤ እነርሱ ሕያዋን ናቸው፥ አዋላጆቹም ሳይመጡባቸው ይወልዳሉ አሉት።"], [20, "እግዚአብሔርም ለአዋላጆቹ መልካም አደረገላቸው፤ ሕዝቡም በዛ፥ እጅግም በረቱ።"], [21, "አዋላጆቹም እግዚአብሔርን ስለ ፈሩ ቤት ሰጣቸው።"]]}, {"ref": "1 ነገሥት 17:8-16", "key": 6, "v": [[8, "የእግዚአብሔርም ቃል ወደ እርሱ መጥቶ እንዲህ አለው።"], [9, "ተነሥተህ በሲዶን ወገን ወደምትሆን ወደ ሰራፕታ ሂድ በዚያም ቀመጥ፤ እነሆ፥ አንዲት መበለት ሴት እንድትመግብህ አዝዣትአለሁ።"], [10, "ተነሥቶም ወደ ሰራፕታ ሄደ፤ ወደ ከተማይቱም በር በመጣ ጊዜ እነሆ፥ አንዲት መበለት ሴት ቅጠል ትሰበስብ ነበር፤ ጠርቶም። በሽክርክሪት ጥቂት ውኃ አምጪልኝ፥ እጠጣለሁ አላት።"], [11, "እርስዋም ልታመጣ ስትሄድ ጠርቶ። በአንቺ እጅ አንድ ቁራሽ እንጀራ አምጪልኝ አላት።"], [12, "እርስዋም። በእውነት አምላክህ እግዚአብሔር ሕያው ነው፤ እንጀራ የለኝም፥ በቀፎ ውስጥ አንድ እፍኝ ዱቄት በብልቃጥም ውስጥ ጥቂት ዘይት ብቻ አለኝ፤ እነሆም ሁለት ቅጠሎችን ሰብስቤ ለእኔና ለልጄ አበስላለሁ፥ እንበላዋለን፥ እንሞታለንም አለችው።"], [13, "ኤልያስም። አትፍሪ፤ ሂጂ፥ እንዳልሽም አድርጊ፤ ነገር ግን አስቀድመሽ ከእርሱ ትንሽ እንጀራ አድርጊልኝ አምጪልኝ፥ በኋላም ለራስሽና ለልጅሽ አድርጊ አላት።"], [14, "የእስራኤል አምላክ እግዚአብሔር እንዲህ ይላልና፤ እግዚአብሔር በምድር ላይ ዝናብ እስኪሰጥበት ቀን ድረስ የዱቄቱ ቀፎ አይጎድልም፥ የዘይቱም ብልቃጥ አይያንስም።"], [15, "እርስዋም ሄዳ እንደ ኤልያስ ቃል አደረገች፤ እርሱም እርስዋም የቤቷም ሰዎች ብዙ ቀናት በሉ።"], [16, "እንደ እግዚአብሔር በኤልያስ እጅ የተናገረው ቃል የዱቄቱ ቀፎ አልጎደለም፥ የዘይቱም ብልቃጥ አላነሰም።"]]}, {"ref": "2 ነገሥት 4:8-17", "key": 8, "v": [[8, "አንድ ቀንም ኤልሳዕ ወደ ሹኔም አለፈ፤ በዚያም አንዲት ታላቅ ሴት ነበረች፥ እርስዋም እንጀራ ይብላ ዘንድ አስገደደችው፤ እርሱም በሚያልፍበት ጊዜ ሁሉ እንጀራ ይብላ ዘንድ ወደዚያ ይገባ ነበር።"], [9, "እርስዋም ባሏን። እነሆ፥ በእኛ ላይ ሁልጊዜ የሚያልፈው ይህ የእግዚአብሔር ሰው ቅዱስ እንደ ሆነ አውቃለሁ።"], [10, "ትንሽ ክፍል በጣራ ላይ እንሥራለት፥ በዚያም ምንጣፍን ጠረጴዛን ወንበርን መብራትንም እናኑርለት፤ ወደ እኛም በመጣ ጊዜ ወደዚያ ይግባ አለች።"], [11, "አንድ ቀንም ወደዚያ መጥቶ ወደ ክፍሉ ገብቶ በዚያ ተኛ።"], [12, "ለብላቴናውም ለጌሐዚ። ይህችን የሹኔም ሴት ጥራላት አለ፤ እርሱም ጠርቶአት በፊቱ ቆመች።"], [13, "እርሱም። እነሆ፥ ይህን ሁሉ እንክብካቤ ስለ እኛ ተጨንቀሻልና ለአንቺ ምን ይደረግልሽ? ከንጉሡ ወይም ከሠራዊት አለቃ ጋር ስለ አንቺ ይነገርልሽን? በላት አለ፤ እርስዋም። እኔ በሕዝቤ መካከል እኖራለሁ አለች።"], [14, "እርሱም። እንግዲህ ለእርሷ ምን ይደረግላታል? አለ፤ ጌሐዚም። በእውነት ልጅ የላትም፥ ባሏም ሽማግሌ ነው ብሎ መለሰ።"], [15, "እርሱም። ጥራት አለ፤ እርሱም ጠርቶአት በበሩ ቆመች።"], [16, "እርሱም። በሚመጣው ዓመት እንደዚህ ወራት ልጅ ታቅፋለሽ አለ፤ እርስዋም። አይሆንም፥ ጌታዬ ሆይ፥ የእግዚአብሔር ሰው ሆይ፥ ባሪያህን አትዋሽብኝ አለች።"], [17, "ሴቲቱም ፀንሳለች፥ በሚመጣውም ዓመት እንደዚያ ጊዜ ኤልሳዕ እንደ ነገራት ወንድ ልጅ ወለደች።"]]}, {"ref": "2 ሳሙኤል 20:16-22", "key": 3, "v": [[16, "አንዲትም ጥበበኛ ሴት ከከተማይቱ ጮኸች። ስሙ፥ ስሙ፤ ዮአብ ወደዚህ ይቅረብ፥ እነግረዋለሁ በሉት አለች።"], [17, "እርሱም ወደ እርሷ ቀረበ፤ ሴቲቱም። አንተ ዮአብ ነህን? አለችው፤ እርሱም። እኔ ነኝ ብሎ መለሰ፤ እርስዋም። የባሪያህን ቃል ስማ አለችው፤ እርሱም። እሰማለሁ አለ።"], [18, "እርስዋም እንዲህ ብላ ተናገረች። በቀድሞ ዘመን እንዲህ ይላሉ ነበር፤ በአቤል ውስጥ ይጠይቃሉ፥ እንዲሁም ይፈጽሙ ነበር።"], [19, "እኔ በእስራኤል ውስጥ ከሰላም ወዳጆችና ከታማኝ ሰዎች አንዲቱ ነኝ፤ አንተም በእስራኤል ውስጥ ከተማይቱንና እናትን ለማጥፋት ትፈልጋለህ፤ የእግዚአብሔርን ርስት ለምን ትውጣለህ?"], [20, "የሠራዊት አለቃ ዮአብም መልሶ። አይሆንም፥ አይሆንም፤ አልውጥም አላጠፋምም አለ።"], [21, "ነገሩ እንዲህ አይደለም፤ ነገር ግን ከኤፍሬም ተራራ የሆነ ሼባ የሚባል የቢክሪ ልጅ ሰው በንጉሡ በዳዊት ላይ እጁን አንሥቶአልና እርሱን ብቻ ስጡኝ፥ ከከተማይቱም እራቃለሁ አለ፤ ሴቲቱም ዮአብን። እነሆ፥ ራሱ በቅጥሩ ላይ ወደ አንተ ይጣልልሃል አለችው።"], [22, "ሴቲቱም በጥበቧ ወደ ሕዝቡ ሁሉ መጣች፤ እነርሱም የቢክሪን ልጅ የሼባን ራስ ቆርጠው ወደ ዮአብ ጣሉት፤ እርሱም ቀንዴ መለከትን ነፋ፥ ከከተማይቱም ተበተኑ፥ እያንዳንዱም ወደ ድንኳኑ ሄደ፤ ዮአብም ወደ ኢየሩሳሌም ወደ ንጉሡ ተመለሰ።"]]}, {"ref": "ዘኍልቍ 27:1-8", "key": 6, "v": [[1, "የምናሴ ልጅ የማኪር ልጅ የገለዓድ ልጅ የሔፌር ልጅ የሰሎፍሐድ ሴት ልጆች ቀረቡ፤ የሴት ልጆቹም ስሞች እነዚህ ናቸው፤ ማሕላ፥ ኖዓ፥ ኃግላ፥ ሚልካ፥ ትርሳ።"], [2, "በመገናኛ ድንኳን በርም በሙሴ ፊት በካህኑም በአልዓዛር ፊት በአለቆቹም በጉባኤውም ሁሉ ፊት ቆመው እንዲህ አሉ።"], [3, "አባታችን በምድረ በዳ ሞተ፥ እርሱም በእግዚአብሔር ላይ ካሰባሰቡት ከቆሬ ጉባኤ ጋር አልነበረም፤ ነገር ግን በኃጢአቱ ምክንያት ሞተ፥ ወንድ ልጆችም አልነበሩትም።"], [4, "ወንድ ልጅ ስለሌለው የአባታችን ስም ከነገዱ መካከል ለምን ይጠፋል? ከአባታችን ወንድሞች መካከል ርስት ስጡን።"], [5, "ሙሴም ነገራቸውን ወደ እግዚአብሔር አቀረበ።"], [6, "እግዚአብሔርም ሙሴን እንዲህ ብሎ ተናገረው።"], [7, "የሰሎፍሐድ ሴት ልጆች በትክክል ተናግረዋል፤ ከአባታቸው ወንድሞች መካከል ርስት ትሰጣቸዋለህ፥ የአባታቸውንም ርስት ለእነርሱ ታሻግረዋለህ።"], [8, "ለእስራኤል ልጆችም እንዲህ ብለህ ተናገራቸው፤ አንድ ሰው ቢሞት ወንድ ልጅም ባይኖረው ርስቱን ለሴት ልጁ ታሻግራላችሁ።"]]}, {"ref": "መኃልየ መኃልይ 8:5-7", "key": 2, "v": [[5, "በወዳጇ ላይ ተደግፋ ከምድረ በዳ የምትወጣ ይህች ማን ናት? ከአፕል ዛፍ ሥር አስነሣሁሽ፤ በዚያ እናትሽ አረገዘችሽ፥ በዚያም የወለደችሽ አረገዘች።"], [6, "እንደ ማኅተም በልብህ ላይ፥ እንደ ማኅተምም በክንድህ ላይ አድርገኝ፤ ፍቅር እንደ ሞት ኃያል ነውና፥ ቅንዓትም እንደ ሲኦል ጨካኝ ነው፤ ፍንጮቹም የእሳት ፍንጮች የእግዚአብሔርም ነበልባል ናቸው።"], [7, "ብዙ ውኃ ፍቅርን ሊያጠፋው አይችልም፥ ጐርፎችም ሊያሰጥሙት አይችሉም፤ አንድ ሰው ስለ ፍቅር የቤቱን ሀብት ሁሉ ቢሰጥ ፈጽሞ ይነቀፍል ነበር።"]]}, {"ref": "ዮሐንስ 12:1-8", "key": 2, "v": [[1, "ከፋሲካም ስድስት ቀን ቀድሞ ኢየሱስ ከሙታን ያስነሣው አልዓዛር ወደ ነበረበት ወደ ቤተንያ መጣ።"], [2, "በዚያም እራት አደረጉለት፤ ማርታም ታገለግል ነበር፥ አልዓዛርም ከእርሱ ጋር ከተቀመጡት አንዱ ነበረ።"], [3, "ማርያምም የእጅግ ውድ የሆነ የንጹሕ ናርዶስ ሽቱ አንድ ሩጫ ወስዳ የኢየሱስን እግሮች ቀብታ በጠጕሯም አበሰቻቸው፤ ቤቱም ከሽቱ መዓዛ ተሞላ።"], [4, "ከደቀ መዛሙርቱ አንዱ ሊያድርገው የነበረው አስቆሮቱ ይሁዳም እንዲህ አለ።"], [5, "ይህ ሽቱ በሦስት መቶ ዲናር ተሽጦ ለድሆች ለምን አልተሰጠም?"], [6, "ይህንም ስለ ድሆች ስለሚያስብ ሳይሆን ሌባ ስለ ነበረ የገንዘብ ሳጥኑም በእርሱ ስለ ነበረ የተቀመጠውንም ይሰርቅ ነበርና አለ።"], [7, "ኢየሱስም። ተዊአት፤ ለቀብሬ ቀን ጠብቃታለች አለ።"], [8, "ድሆች ሁልጊዜ ከእናንተ ጋር ይኖራሉ፥ እኔ ግን ሁልጊዜ ከእናንተ ጋር አልኖርምና አለ።"]]}, {"ref": "ሉቃስ 24:1-11", "key": 9, "v": [[1, "በሳምንቱም መጀመሪያ ቀን እጅግ በማለዳ ያዘጋጁትን ሽቱ ይዘው ወደ መቃብሩ መጡ።"], [2, "ድንጋዩንም ከመቃብሩ ተገልብጦ አገኙት።"], [3, "ገብተውም የጌታን የኢየሱስን ሥጋ አላገኙም።"], [4, "እነርሱም በዚህ ሲጨነቁ እነሆ፥ ሁለት ሰዎች በሚያበራ ልብስ በለበሱት በአጠገባቸው ቆሙ።"], [5, "እነርሱም ፈርተው ፊታቸውን ወደ ምድር አዘንብለው ሳሉ እነርሱን። ሕያውን ከሙታን መካከል ለምን ትፈልጋላችሁ?"], [6, "እዚህ የለም፥ ተነሥቶአልና፤ በገሊላም ሳለ ለእናንተ እንደ ተናገራችሁ አስቡ፤"], [7, "የሰው ልጅ በኃጢአተኞች ሰዎች እጅ አልፎ መሰቀል አለበት፥ በሦስተኛውም ቀን ይነሣል ብሎአል አሉአቸው።"], [8, "ቃሉንም አስታወሱ።"], [9, "ከመቃብሩም ተመልሰው ይህን ሁሉ ለአሥራ አንዶቹና ለቀሪዎቹ ሁሉ ነገሩ።"], [10, "እነርሱም መግደላዊት ማርያም፥ ዮሐና፥ የያዕቆብ እናት ማርያም፥ ከእነርሱ ጋር የነበሩት ሌሎቹም ሴቶች ነበሩ፤ እነዚህንም ለሐዋርያት ነገሩ።"], [11, "እነዚህም ቃሎች በእነርሱ ዘንድ እንደ ወሬ ሆነው ታዩ፥ አላመኑአቸውም።"]]}, {"ref": "ሉቃስ 8:1-3", "key": 2, "v": [[1, "ከዚህም በኋላ እርሱ በከተሞችና በመንደሮች ይዞር ነበር፥ የእግዚአብሔርንም መንግሥት ይሰብክና የምሥራች ይነግር ነበር፥ አሥራ ሁለቱም ከእርሱ ጋር ነበሩ፥"], [2, "ከክፉ መናፍስትና ከደዌም የተፈወሱ አንዳንድ ሴቶች፥ ሰባት አጋንንት የወጡላት መግደላዊት ተብላ የምትጠራ ማርያም፥"], [3, "የሄሮድስም የቤት አስተዳዳሪ የኩዛ ሚስት ዮሐና፥ ሶስናም፥ ሌሎችም ብዙዎች፥ እነርሱም ካላቸው ንብረት ያገለግሉት ነበር።"]]}, {"ref": "ማርቆስ 15:40-47", "key": 0, "v": [[40, "ከሩቅም የሚያዩ ሴቶች ነበሩ፥ ከእነርሱም መግደላዊት ማርያም፥ የትናንሹ ያዕቆብና የዮሳ እናት ማርያም፥ ሰሎሜም ነበሩ።"], [41, "እነርሱም በገሊላ ሳለ ይከተሉትና ያገለግሉት ነበር፤ ከእርሱም ጋር ወደ ኢየሩሳሌም የወጡት ሌሎች ብዙ ሴቶች ነበሩ።"], [42, "ምሽትም በመጣ ጊዜ፥ አርብ ስለ ነበረ፥ እርሱም ከሰንበት በፊት ያለው ቀን ነውና፥"], [43, "ከአርማትያስ የሆነ የተከበረ መካሪ ዮሴፍ መጣ፥ እርሱም የእግዚአብሔርን መንግሥት ይጠብቅ ነበር፤ ደፍሮም ወደ ጲላጦስ ገብቶ የኢየሱስን ሥጋ ለመነው።"], [44, "ጲላጦስም አሁንስ ሞቶአልን? ብሎ ተደነቀ፤ የመቶ አለቃውንም ጠርቶ ከቶ ጀምሮ ሞቶአልን? ብሎ ጠየቀው።"], [45, "ከመቶ አለቃውም ባወቀ ጊዜ ሥጋውን ለዮሴፍ ሰጠው።"], [46, "እርሱም ቀጭን ልብስ ገዝቶ አውርዶ በልብሱ ጠቀለለው፥ ዓለት ውስጥም በተወቀረ መቃብር ውስጥ አኖረው፥ በመቃብሩም በር ላይ ድንጋይን አንከባሎበታል።"], [47, "መግደላዊት ማርያም የዮሳም እናት ማርያም የተቀበረበትን ስፍራ ይመለከቱ ነበር።"]]}, {"ref": "ማርቆስ 16:1-8", "key": 0, "v": [[1, "ሰንበትም ካለፈ በኋላ መግደላዊት ማርያም የያዕቆብ እናት ማርያም ሰሎሜም ሊቀቡት ሽቱ ገዙ።"], [2, "በሳምንቱም መጀመሪያ ቀን እጅግ በማለዳ ፀሐዩም ሲወጣ ወደ መቃብሩ መጡ።"], [3, "በመካከላቸውም። ድንጋዩን ከመቃብሩ በር ማን ያንከባልልልናል? ይባባሉ ነበር፤ ድንጋዩም እጅግ ታላቅ ነበረና።"], [4, "አሻቅበውም ባዩ ጊዜ ድንጋዩ ተገልብጦ እንደ ነበረ አገኙ፥ እጅግ ታላቅ ነበረና።"], [5, "ወደ መቃብሩም ገብተው ነጭ ልብስ ለብሶ በቀኝ በኩል የተቀመጠ ወጣት አዩ፥ እጅግም ደነገጡ።"], [6, "እርሱም። አትደንግጡ፤ የተሰቀለውን የናዝሬቱን ኢየሱስን ትፈልጋላችሁ፤ ተነሥቶአል፥ እዚህ የለም፤ እነሆ ያኖሩበት ስፍራ።"], [7, "ነገር ግን ሂዱ፥ ለደቀ መዛሙርቱና ለጴጥሮስም። ወደ ገሊላ ይቀድማችኋል፤ እንደ ነገራችሁ በዚያ ታዩታላችሁ ንገሩአቸው አለ።"], [8, "ወጥተውም ከመቃብሩ ሸሹ፥ መንቀጥቀጥና መደነቅም ያዛቸው ነበርና፤ ፈርተውም ነበርና ለአንድም ምንም አልነገሩም።"]]}, {"ref": "ማቴዎስ 15:21-28", "key": 7, "v": [[21, "ኢየሱስም ከዚያ ወጥቶ ወደ ጢሮስና ወደ ሲዶና አገር ሄደ።"], [22, "እነሆም አንዲት የከነዓን ሴት ከዚያ ዳርቻ ወጥታ ጮኸች። ጌታ ሆይ፥ የዳዊት ልጅ ሆይ፥ እዘንልኝ፤ ሴት ልጄ በአጋንንት እጅግ ትሰቃያለች አለችው።"], [23, "እርሱ ግን አንዲት ቃልም አልመለሰላትም፤ ደቀ መዛሙርቱም ቀርበው። ትጮኻለችና አስወጥታት ብለው ለመኑት።"], [24, "እርሱም መልሶ። እኔ ከእስራኤል ቤት ለጠፉት በጎች በቀር ለሌላ አልተላክሁም አለ።"], [25, "እርስዋ ግን መጥታ ሰገደችለት። ጌታ ሆይ፥ እርዳኝ አለችው።"], [26, "እርሱም መልሶ። የልጆችን እንጀራ ወስዶ ለውሾች መጣል መልካም አይደለም አለ።"], [27, "እርስዋም። አዎን ጌታ ሆይ፤ ውሾችም እንኳ ከጌቶቻቸው ጠረጴዛ ከሚወድቀው ፍርፋሪ ይበላሉ አለች።"], [28, "በዚያን ጊዜ ኢየሱስ መልሶ። አንቺ ሴት ሆይ፥ እምነትሽ ታላቅ ነው፤ እንደ ወደድሽ ይሁንልሽ አላት፤ ሴት ልጇም ከዚያች ሰዓት ጀምራ ዳነች።"]]}, {"ref": "ማርቆስ 5:25-34", "key": 9, "v": [[25, "አሥራ ሁለት ዓመትም ደም የሚፈሳት አንዲት ሴት ነበረች፥"], [26, "በብዙ ባለሞያዎችም እጅ ብዙ ተሰቃይታለች፥ ያላትንም ሁሉ አውጥታለች፥ ምንም አልጠቀማትም እንጂ ይልቁንም ክፉ ሆነባት።"], [27, "ስለ ኢየሱስም ሰምታ በሕዝቡ መካከል ከኋላ መጥታ ልብሱን ዳሰሰች።"], [28, "ልብሱን ብቻ ብነካ እድናለሁ ብላለችና።"], [29, "ወዲያውኑም የደምዋ ምንጭ ደረቀ፥ በሥጋዋም ከሥቃዩ እንደ ፈወሰች አወቀች።"], [30, "ኢየሱስም ኃይል ከእርሱ እንደ ወጣ ወዲያውኑ በራሱ አውቆ በሕዝቡ መካከል ዞር ብሎ። ልብሴን ማን ዳሰሰ? አለ።"], [31, "ደቀ መዛሙርቱም። ሕዝቡ ሲያስጨንቅህ ታያለህ፥ ማን ዳሰሰኝ ትላለህን? አሉት።"], [32, "ያደረገችውንም ያይ ዘንድ በዙሪያው ተመለከተ።"], [33, "ሴቲቱም የተደረገላትን አውቃ ፈርታና ተንቀጠቅጣ መጥታ በፊቱ ተደፋች፥ እውነቱንም ሁሉ ነገረችው።"], [34, "እርሱም። ልጄ ሆይ፥ እምነትሽ አዳነሽ፤ በሰላም ሂጂ፥ ከሥቃይሽም ተፈውሺ አላት።"]]}, {"ref": "ሉቃስ 7:11-17", "key": 2, "v": [[11, "በነገውም ናይን ወደምትባል ከተማ ሄደ፤ ብዙዎችም ከደቀ መዛሙርቱና ብዙ ሕዝብ ከእርሱ ጋር ሄዱ።"], [12, "ወደ ከተማይቱም በር በቀረበ ጊዜ እነሆ፥ አንድ ብቸኛ ለእናቱ የሆነ የሞተ ሰው ይወጣ ነበር፥ እርስዋም መበለት ነበረች፤ አያሌ የከተማይቱም ሕዝብ ከእርስዋ ጋር ነበሩ።"], [13, "ጌታም ባያት ጊዜ አዘነላት። አታልቅሺም አላት።"], [14, "ቀርቦም ሳንዱቁን ዳሰሰ፥ ተሸካሚዎቹም ቆሙ፤ እርሱም። አንተ ወጣት ሆይ፥ ተነሥ እልሃለሁ አለ።"], [15, "ሙታኑም ተነሥቶ ተቀመጠ፥ መናገርም ጀመረ፤ ለእናቱም ሰጠው።"], [16, "ፍርሃትም ሁሉንም ያዛቸው፥ እግዚአብሔርንም አከበሩ። ታላቅ ነቢይ በመካከላችን ተነሥቶአል፥ እግዚአብሔርም ሕዝቡን ጎብኝቶአል እያሉ ነበር።"], [17, "ይህም ወሬ ስለ እርሱ በይሁዳ ሁሉ በዙሪያውም ባለ አገር ሁሉ ወጣ።"]]}, {"ref": "ሉቃስ 13:10-17", "key": 2, "v": [[10, "በሰንበትም በአንድ ምኩራብ ያስተምር ነበር።"], [11, "እነሆም አሥራ ስምንት ዓመት የድካም መንፈስ ያለባት አንዲት ሴት ነበረች፥ ታግባለችም፥ ፈጽማ ቀጥ ማለት አትችልም ነበር።"], [12, "ኢየሱስም ባያት ጊዜ ጠርቶ። ሴት ሆይ፥ ከድካምሽ ተፈታሻለሽ አላት።"], [13, "እጆቹንም ጫነባት፤ ወዲያውኑም ቀጥ አለች፥ እግዚአብሔርንም አከበረች።"], [14, "የምኩራቡም አለቃ ኢየሱስ በሰንበት ስለ ፈወሰ ተቈጥቶ ሕዝቡን። ሥራ የሚሠራባቸው ስድስት ቀናት አሉ፥ እንግዲህ በእነዚያ መጥታችሁ ተፈወሱ እንጂ በሰንበት ቀን አይደለም አላቸው።"], [15, "ጌታም መልሶ። እናንተ ግብዞች ሆይ፥ እያንዳንዳችሁ በሰንበት በሬውን ወይም አህያውን ከግርግሙ ፈትቶ ውኃ ሊያጠጣው አይወስደውምን?"], [16, "ይህችም የአብርሃም ሴት ልጅ ሳለች ሰይጣን እነሆ አሥራ ስምንት ዓመት ያስራት በሰንበት ቀን ከዚህ እስራት ልትፈታ አይገባምን? አላቸው።"], [17, "ይህንም ሲል ተቃዋሚዎቹ ሁሉ አፈሩ፥ ሕዝቡም ሁሉ በእርሱ ስለ ተደረጉት ክብር ነገሮች ሁሉ ደስ አላቸው።"]]}, {"ref": "ሐዋርያት ሥራ 16:1-5", "key": 0, "v": [[1, "ወደ ደርቤና ወደ ልስጥራም መጣ፤ እነሆም በዚያ ጢሞቴዎስ የሚባል አንድ ደቀ መዝሙር ነበረ፥ እርሱም ያመነች የአይሁድ ሴት ልጅ ነበረ፥ አባቱ ግን ግሪካዊ ነበረ።"], [2, "እርሱም በልስጥራና በኢቆንያም ካሉ ወንድሞች የተመሰከረለት ነበረ።"], [3, "ጳውሎስም ይህ ከእርሱ ጋር ይወጣ ዘንድ ወደደ፤ በአገሩም ስፍራ ባሉት በአይሁድ ምክንያት ወስዶ ገረዘው፥ ሁሉም አባቱ ግሪካዊ እንደ ነበረ ያውቁ ነበርና።"], [4, "በከተሞቹም ሲያልፉ በኢየሩሳሌም ያሉት ሐዋርያትና ሽማግሌዎች የወሰኑትን ሥርዓት እንዲጠብቁ ያስተላልፉላቸው ነበር።"], [5, "አብያተ ክርስቲያናትም በእምነት ጸንተው በቍጥርም በየቀኑ ይበዙ ነበር።"]]}, {"ref": "ሐዋርያት ሥራ 12:11-17", "key": 3, "v": [[11, "ጴጥሮስም ወደ ራሱ በተመለሰ ጊዜ። ጌታ መልአኩን ልኮ ከሄሮድስ እጅ ከአይሁድም ሕዝብ ከሚጠብቁት ሁሉ እንዳዳነኝ አሁን በእውነት አውቃለሁ አለ።"], [12, "አስተውሎም ማርቆስ ለተባለው ለዮሐንስ እናት ወደ ማርያም ቤት መጣ፥ በዚያም ብዙዎች ተሰብስበው ይጸልዩ ነበር።"], [13, "እርሱም የደጅ በር ባንኳኳ ጊዜ ሮዴ የምትባል አንዲት አገልጋይ ልትሰማ ወጣች።"], [14, "የጴጥሮስንም ድምፅ ባወቀች ጊዜ ከደስታ የተነሣ በሩን ሳትከፍት ወደ ውስጥ ሮጣ ጴጥሮስ በበሩ ፊት ቆሞአል ብላ አወራች።"], [15, "እነርሱም። እብድ ነሽ አሉአት፤ እርስዋ ግን እንዲሁ እንደ ሆነ አጸናች፤ እነርሱም። መልአኩ ነው አሉ።"], [16, "ጴጥሮስም ማንኳኳቱን ቀጠለ፤ ከፍተውም ባዩት ጊዜ ተደነቁ።"], [17, "እርሱም ዝም ይበሉ ዘንድ በእጁ ጋሻቸው፥ ጌታ ከእስር ቤት እንዳወጣው ነገራቸው፤ ለያዕቆብና ለወንድሞቹም ይህን ንገሩአቸው ብሎ ወደ ሌላ ስፍራ ሄደ።"]]}, {"ref": "ሐዋርያት ሥራ 8:26-35", "key": 1, "v": [[26, "የእግዚአብሔርም መልአክ ፊልጶስን። ተነሥተህ ወደ ደቡብ በኩል ከኢየሩሳሌም ወደ ጋዛ ወደሚወርደው ምድረ በዳ ወደ ሆነ መንገድ ሂድ ብሎ ነገረው።"], [27, "ተነሥቶም ሄደ፤ እነሆም የኢትዮጵያ ንግሥት የቀንዳቄ ጃንደረባ የነበረ በሀብቷም ሁሉ ላይ የነበረ አንድ የኢትዮጵያ ሰው ሊሳለል ወደ ኢየሩሳሌም መጥቶ ነበር።"], [28, "እርሱም ሲመለስ በሠረገላው ላይ ተቀምጦ የነቢዩን የኢሳይያስን መጽሐፍ ያነብ ነበር።"], [29, "መንፈስም ፊልጶስን። ቀርበህ ከዚህ ሠረገላ ጋር ተጣበቅ አለው።"], [30, "ፊልጶስም ሮጦ የነቢዩን የኢሳይያስን መጽሐፍ ሲያነብ ሰምቶ። ታነበውስ ታስተውለዋለህን? አለ።"], [31, "እርሱም። የሚመራኝ ባይኖር እንዴት እችላለሁ? አለ፤ ፊልጶስንም ወጥቶ ከእርሱ ጋር ይቀመጥ ዘንድ ለመነው።"], [32, "ያነብብም የነበረው የመጽሐፉ ክፍል ይህ ነበረ፤ እንደ በግ ወደ እርድ ተወሰደ፥ ጠቦትም በሸላቾቹ ፊት ዝም እንደሚል እንዲሁ አፉን አልከፈተም።"], [33, "በትሕትናውም ፍርዱ ተወሰደ፤ ትውልዱንም ማን ይነግራል? ሕይወቱ ከምድር ተወስዳለችና።"], [34, "ጃንደረባውም ለፊልጶስ መልሶ። እባክህ ነቢዩ ይህን ስለ ማን ይናገራል? ስለ ራሱን? ወይም ስለ ሌላ ሰውን? ብዬ እለምንሃለሁ አለው።"], [35, "ፊልጶስም አፉን ከፍቶ ከዚህ መጽሐፍ ጀምሮ የኢየሱስን ወንጌል ሰበከለት።"]]}, {"ref": "ዮሐንስ 19:23-27", "key": 2, "v": [[23, "ወታደሮቹም ኢየሱስን ከሰቀሉት በኋላ ልብሱን ወስደው እያንዳንዱ ወታደር ድርሻ እንዲደርሰው አራት ክፍል አደረጉ፥ ቀሚሱንም ወሰዱ፤ ቀሚሱም ያለ ስፌት ከላይ ጀምሮ በሙሉ የተሠራ ነበረ።"], [24, "ስለዚህ እርስ በርሳቸው። አንቅደው፥ የማን እንደሚሆን ዕጣ እንጣልበት አሉ፤ መጽሐፉም። ልብሴን ለራሳቸው ተካፈሉ፥ በቀሚሴም ላይ ዕጣ ተጣጣሉ የሚለው ይፈጸም ዘንድ ነበረ። ወታደሮቹም ይህን አደረጉ።"], [25, "በኢየሱስም መስቀል አጠገብ እናቱ የእናቱም እኅት የቅሎፋ ሚስት ማርያም መግደላዊትም ማርያም ቆመው ነበር።"], [26, "ኢየሱስም እናቱንና እርስዋም የምትወደውን ደቀ መዝሙር በአጠገቡ ቆሞ ባየ ጊዜ እናቱን። ሴት ሆይ፥ እነሆ ልጅሽ አላት።"], [27, "ከዚያም ደቀ መዝሙሩን። እነሆ እናትህ አለው፤ ከዚያችም ሰዓት ጀምሮ ደቀ መዝሙሩ ወደ ቤቱ ወሰዳት።"]]}, {"ref": "ማቴዎስ 27:19-24", "key": 0, "v": [[19, "እርሱም በፍርድ ወንበሩ ላይ ተቀምጦ ሳለ ሚስቱ ወደ እርሱ ልካ። ከዚያ ከጻድቁ ሰው ጋር ምንም አትገናኝ፤ ዛሬ በሕልም ስለ እርሱ ብዙ ተሰቃይቻለሁና አለች።"], [20, "የካህናት አለቆችና ሽማግሌዎች ግን በርባንን እንዲለምኑ ኢየሱስንም እንዲገድሉ ሕዝቡን አባበሉአቸው።"], [21, "ገዢውም መልሶ። ከሁለቱስ የትኛውን ልፈታልችሁ ትወዳላችሁ? አላቸው፤ እነርሱም። በርባንን አሉ።"], [22, "ጲላጦስም። እንግዲህ ክርስቶስ የሚባለውን ኢየሱስን ምን ላድርገው? አላቸው፤ ሁሉም። ይሰቀል አሉት።"], [23, "ገዢውም። ምን ክፉ ሥራ ሠርቶአል? አለ፤ እነርሱ ግን ይልቁንም ጮኹ። ይሰቀል እያሉ ነበር።"], [24, "ጲላጦስም ምንም እንዳልጠቀመ ግርግር እንደሚበዛ ባየ ጊዜ ውኃ ወስዶ በሕዝቡ ፊት እጆቹን ታጠበ። እኔ ከዚህ ጻድቅ ሰው ደም ንጹሕ ነኝ፤ እናንተው ተመልከቱ አለ።"]]}, {"ref": "ማርቆስ 1:29-34", "key": 2, "v": [[29, "ወዲያውኑም ከምኩራቡ ወጥተው ከያዕቆብና ከዮሐንስ ጋር ወደ ስምዖንና ወደ እንድርያስ ቤት መጡ።"], [30, "የስምዖንም አማት በንዳድ ታማ ተኝታ ነበር፤ ወዲያውኑም ስለ እርስዋ ነገሩት።"], [31, "ቀርቦም እጇን ይዞ አስነሣት፤ ንዳዱም ወዲያውኑ ተወላት፥ እርስዋም ታገለግላቸው ነበር።"], [32, "ምሽትም በመጣ ፀሐዩም በገባ ጊዜ የታመሙትን ሁሉ አጋንንትም ያለባቸውን ወደ እርሱ አመጡ።"], [33, "ከተማይቱም ሁሉ በበሩ ላይ ተሰብስባ ነበር።"], [34, "በልዩ ልዩ ደዌም የታመሙትን ብዙዎችን ፈወሰ፥ ብዙዎችንም አጋንንት አወጣ፤ አጋንንቱም እርሱን ያውቁት ነበርና ይናገሩ ዘንድ አልፈቀደላቸውም።"]]},{"ref": "ዘፍጥረት 4:19-24", "key": 0, "v": [[19, "ላሜሕም ለራሱ ሁለት ሚስቶችን አገባ፤ የአንዲቱ ስም ዓዳ፥ የሁለተኛይቱ ስም ሴላ ነበረ።"], [20, "ዓዳም ያባልን ወለደች፤ እርሱም በድንኳን የሚቀመጡት የዘላኖች አባት ነበረ።"], [21, "የወንድሙም ስም ዩባል ነበረ፤ እርሱም በገናንና መለከትን ለሚይዙ አባት ነበረ።"], [22, "ሴላም ደግሞ ከናስና ከብረት የሚቀጠቀጥ ዕቃን የሚሠራውን ቱባልቃይንን ወለደች። የቱባልቃይንም እኅት ናዕማ ነበረች።"], [23, "ላሜሕም ለሚስቶቹ ለዓዳና ለሴላ አላቸው። እናንት የላሜሕ ሚስቶች ቃሌን ስሙ፥ ነገሬንም አድምጡ፤ እኔ ጕልማሳውን ለቍስሌ፥ ብላቴናውንም ለመወጋቴ ገድዬዋለሁና፤"], [24, "ቃየንን ሰባት እጥፍ ይበቀሉታል፤ ላሜሕን ግን ሰባ ሰባት እጥፍ። ይበቀሉታል"]]},{"ref": "ዘፍጥረት 4:19-24", "key": 0, "v": [[19, "ላሜሕም ለራሱ ሁለት ሚስቶችን አገባ፤ የአንዲቱ ስም ዓዳ፥ የሁለተኛይቱ ስም ሴላ ነበረ።"], [20, "ዓዳም ያባልን ወለደች፤ እርሱም በድንኳን የሚቀመጡት የዘላኖች አባት ነበረ።"], [21, "የወንድሙም ስም ዩባል ነበረ፤ እርሱም በገናንና መለከትን ለሚይዙ አባት ነበረ።"], [22, "ሴላም ደግሞ ከናስና ከብረት የሚቀጠቀጥ ዕቃን የሚሠራውን ቱባልቃይንን ወለደች። የቱባልቃይንም እኅት ናዕማ ነበረች።"], [23, "ላሜሕም ለሚስቶቹ ለዓዳና ለሴላ አላቸው። እናንት የላሜሕ ሚስቶች ቃሌን ስሙ፥ ነገሬንም አድምጡ፤ እኔ ጕልማሳውን ለቍስሌ፥ ብላቴናውንም ለመወጋቴ ገድዬዋለሁና፤"], [24, "ቃየንን ሰባት እጥፍ ይበቀሉታል፤ ላሜሕን ግን ሰባ ሰባት እጥፍ። ይበቀሉታል"]]},{"ref": "ዘፍጥረት 29:29-30:8", "key": 0, "v": [[29, "ላባም ለልጁ ለራሔል ባርያይቱን ባላን ባርያ ትሆናት ዘንድ ሰጣት።"], [1, "ራሔልም ለያዕቆብ ልጆችን እንዳልወለደች ባየች ጊዜ በእኅትዋ ቀናችባት፤ ያቆብንም። ልጅ ስጠኝ፤ ይህስ ካልሆነ እሞታለሁ አለችው።"], [2, "ያዕቆብም ራሔልን ተቆጥቶ። በውኑ እኔ የሆድን ፍሬ በነሣሽ በእግዚአብሔር ቦታ ነኝን? አላት።"], [3, "እርስዋም ባሪያዬ ባላ እነሆ አለች፤ ድረስባት፤ በእኔም ጭን ላይ ትውለድ፥ የእርስዋም ልጆች ለእኔ ደግሞ ይሁኑልኝ አለች።"], [4, "ባሪያዋን ባላንም ሚስት ትሆነው ዘንድ ለእርሱ ሰጠችው፤ ያዕቆብም ደረሰባት።"], [5, "ባላም ፀነሰች፥ ወንድ ልጅንም ለያዕቆብ ወለደችለት።"], [6, "ራሔልም። እግዚአብሔር ፈረደልኝ፥ ቃሌንም ደግሞ ሰማ፥ ወንድ ልጅንም ሰጠኝ አለች፤ ስለዚህ ስሙን ዳን ብላ ጠራችው።"], [7, "የራሔልም ባሪያ ባላ ደግማ ፀነሰች፥ ለያዕቆብም ሁለተኛ ወንድ ልጅን ወለደች።"], [8, "ራሔልም። ብርቱ ትግልን ከእኅቴ ጋር ታገልሁ፥ አሸነፍሁም አለች፤ ስሙንም ንፍታሌም ብላ ጠራችው።"]], "chap": {"1": "ምዕራፍ 30"}},{"ref": "ዘፍጥረት 25:1-6", "key": 0, "v": [[1, "አብርሃምም ደግሞ ስምዋ ኬጡራ የተባላች ሚስት አገባ።"], [2, "እርስዋም ዘምራንን፥ ዮቅሳንን፥ ሜዳንን፥ ምድያምን፥ የስቦቅን፥ ስዌሕን ወለደችለት።"], [3, "ዮቅሳንም ሳባንና ድዳንን ወለደ። የድዳንም ልጆች አሦርያውያን፥ ለጡሳውያን፥ ለኡማውያን ናቸው።"], [4, "የምድያምም ልጆች ጌፌር፥ ዔፌር፥ ሄኖኅ፥ አቢዳዕ፥ ኤልዳዓ ናቸው። እነዚህ ሁሉ የኬጡራ ልጆች ናቸው።"], [5, "አብርሃምም የነበረውን ሁሉ ለይስሐቅ ሰጠው፤"], [6, "የአብርሃምም ለነበሩ ለቁባቶቹ ልጆች አብርሃም ስጦታን ሰጣቸው፤ እርሱም ገና በሕይወቱ ሳለ ከልጁ ከይስሐቅ ለይቶ ወደ ፀሐይ መውጫ ወደ ምሥራቅ አገር ሰደዳቸው።"]]},{"ref": "ዘፍጥረት 30:21፥ 34:1-31", "key": 0, "v": [[21, "ከዚያም በኋላ ሴት ልጅን ወለደች፥ ስምዋንም ዲና አለቻት።"], [1, "ለያዕቆብ የወለደችለት የልያ ልጅ ዲናም የዚያን አገር ሴቶች ልጆችን ለማየት ወጣች።"], [2, "የአገሩ አለቃ የኤዊያዊ ሰው የኤሞር ልጅ ሴኬም አያት፤ ወሰዳትም ከእርስዋም ጋር ተኛ፥ አስነወራትም።"], [3, "ልቡናውም በያዕቆብ ልጅ በዲና ፍቅር ተነደፈ፥ ብላቴናይቱንም ወደዳት፥ ልብዋንም ደስ በሚያሰኛት ነገር ተናገራት።"], [4, "ሴኬምም አባቱን ኤሞርን። ይህችን ብላቴና አጋባኝ ብሎ ነገረው።"], [5, "ያዕቆብም ልጁን ዲናን እንዳስነወራት ሰማ፤ ልጆቹም ከከብቶቻቸው ጋር በምድረ በዳ ነበሩ፤ ያዕቆብም እስኪመጡ ድረስ ዝም አለ።"], [6, "የሴኬም አባት ኤሞርም ይነግረው ዘንድ ወደ ያዕቆብ ወጣ።"], [7, "የያዕቆብም ልጆች ይህንን በሰሙ ጊዜ ከምድረ በዳ መጡ፤ የያዕቆብን ልጅ በመተኛቱ በእስራኤል ላይ ስንፍናን ስላደረገ አዘኑ፥ እጅግም ተቈጡ፤ እንዲህ አይደረግምና።"], [8, "ኤሞርም እንዲህ ብሎ ነገራቸው። ልጄ ሴኬም በልጃችሁ ፍቅር ልቡ ተነድፎአልና ሚስት እንድትሆነው እባካችሁ እርስዋን ስጡት።"], [9, "ጋብቾችም ሁኑን፤ ሴቶች ልጆቻችሁን ስጡን፥ እናንተም የእኛን ሴቶች ልጆች ውሰዱ።"], [10, "ከእኛም ጋር ተቀመጡ፥ ምድሪቱም በፊታችሁ ናት፤ ኑሩባት፥ ነግዱም፥ ግዙአትም።"], [11, "ሴኬምም አባትዋንና ወንድሞችዋን እንዲህ አለ። በፊታችሁ ሞገስን ባገኝ የምትሉኝን እሰጣለሁ።"], [12, "ብዙ ማጫና እጅ መንሻ አምጣ በሉኝ፥ በነገራችሁኝም መጠን እሰጣለሁ፤ ይህችን ብላቴና ግን አጋቡኝ።"], [13, "የያዕቆብም ልጆች ለሴኬምና ለአባቱ ለኤሞር በተንኰል መለሱ፥ እኅታቸውን ዲናን አርክሶአታልና፤"], [14, "እንዲህም አሉአቸው። እኅታችንን ላልተገረዘ ሰው ለመስጠት ይህንን ነገር እናደርግ ዘንድ አይቻለንም፤ ይህ ነውር ይሆንብናልና።"], [15, "እንደ እኛ ሆናችሁ ወንዶቻችሁን ሁሉ ብትገርዙ በዚህ ብቻ እሺ እንላችኋለን፤"], [16, "ሴቶች ልጆቻችንን እንሰጣችኋለን፥ የእናንተንም ሴቶች ልጆች እንወስዳለን፤ አንድ ሕዝብም ሆነን ከእናንተ ጋር እንኖራለን።"], [17, "ትገረዙ ዘንድ እኛን ባትሰሙ ግን ልጃችንን ይዘን እንሄዳለን።"], [18, "ነገራቸውም በኤሞር ልጅ በሴኬምና በኤሞር ዘንድ የተወደደ ሆነ።"], [19, "ብላቴናውም ያሉትን ያደርግ ዘንድ አልዘገየም፥ የያዕቆብን ልጅ ወድዶአልና፤ እርሱም በአባቱ ቤት ካሉት ሁሉ የከበረ ነበረ።"], [20, "ኤሞርና ሴኬም ልጁም ወደ ከተማቸው አደባባይ ገቡ፥ ለከተማቸውም ሰዎች እንዲህ ብለው ነገሩ።"], [21, "እነዚህ ሰዎች በእኛ ዘንድ የሰላም ሰዎች ናቸው፤ በምድራችን ይቀመጡ፥ ይነግዱባትም፥ እነሆም ምድሪቱ ሰፊ ናት፤ ሴቶች ልጆቻቸውን እንውሰድ፥ ለእነርሱም ሴቶች ልጆቻችንን እንስጥ።"], [22, "ነገር ግን አንድ ሕዝብ ሆነን ከእኛ ጋር ይቀመጡ ዘንድ በዚህ ነገር ብቻ እሺ ይሉናል፤ እነርሱ እንደ ተገረዙ ወንዶቻችንን ሁሉ ብንገርዝ።"], [23, "ከብቶቻቸውም ያላቸውም ሁሉ እንስሶቻቸውም ሁሉ ለእኛ አይደሉምን? በዚህ ነገር ብቻ እሺ ያልናቸው እንደ ሆነ ከእኛ ጋር ይቀመጣሉ።"], [24, "ከከተማይቱም አደባባይ የሚወጡ ሁሉ ኤሞርንና ልጁን ሴኬምን እሺ አሉ፤ ከከተማይቱ አደባባይ የሚወጡት ወንዶች ሁሉ ተገረዙ።"], [25, "ሦስተኛም ቀን በሆነ ጊዜ እጅግ ቆስለው ሳሉ፥ የዲና ወንድሞች የያዕቆብ ልጆች ስምዖንና ሌዊ እየራሳቸው ሰይፋቸውን ይዘው ሳይፈሩ ወደ ከተማ ገቡ፥ ወንዱንም ሁሉ ገደሉ፤"], [26, "ኤሞርንና ልጁን ሴኬምንም በሰይፍ ገደሉ፥ እኅታቸውን ዲናንም ከሴኬም ቤት ይዘው ወጡ።"], [27, "የያዕቆብም ልጆች እኅታቸውን ዲናን ሰለ አረከሱአት ወደ ሞቱት ገብተው ከተማይቱን ዘረፉ፤"], [28, "በጎቻቸውንም ላሞቻቸውንም አህዮቻቸውንም በውጭም በከተማም ያለውን ወሰዱ።"], [29, "ሀብታቸውን ሁሉ ሕፃናቶቻቸውንና ሴቶቻቸውንም ሁሉ ማረኩ፥ በቤት ያለውንም ሁሉ ዘረፉ።"], [30, "ያዕቆብም ሌዊንና ስሞዖንን እንዲህ አለ። በዚች አገር በሚኖሩ በከነዓናውያንና በፌርዛውያን ሰዎች የተጠላሁ ታደርጉኝ ዘንድ እኔን አስጨነቃችሁኝ፤ እኔ በቍጥር ጥቂት ነኝ፤ እነርሱ በእኔ ላይ ይሰበሰቡና ይመቱኛል፤ እኔም ከወገኔ ጋር እጠፋለሁ።"], [31, "እነርሱም። በጋለሞታ እንደሚደረግ በእኅታችን ያደርግባትን? አሉ። a"]], "chap": {"1": "ምዕራፍ 34"}},{"ref": "2 ሳሙኤል 13:1-22", "key": 0, "v": [[1, "ከዚህም በኋላ እንዲህ ሆነ፤ ለዳዊት ልጅ ለአቤሴሎም አንዲት የተዋበች እኅት ነበረችው፥ ስምዋም ትዕማር ነበረ፤ የዳዊትም ልጅ አምኖን ወደዳት።"], [2, "አምኖንም ከእኅቱ ከትዕማር የተነሣ እጅግ ስለ ተከዘ ታመመ፤ ድንግልም ነበረችና አንዳች ያደርጋት ዘንድ በዓይኑ ፊት ጭንቅ ሆኖበት ነበር።"], [3, "ለአምኖንም የዳዊት ወንድም የሳምዓ ልጅ ኢዮናዳብ የሚባል ወዳጅ ነበረው፤ ኢዮናዳብም እጅግ ብልህ ሰው ነበረ።"], [4, "እርሱም። የንጉሥ ልጅ ሆይ፥ ስለ ምን ቀን በቀን እንዲህ ከሳህ? አትነግረኝምን? አለው። አምኖንም። የወንድሜን የአቤሴሎምን እኅት ትዕማርን እወድዳታለሁ አለው።"], [5, "ኢዮናዳብም። ታምሜአለሁ ብለህ በአልጋህ ላይ ተኛ፤ አባትህም ሊያይህ በመጣ ጊዜ። እኅቴ ትዕማር እንድትመጣና እኔ የምበላውን እንጀራ እንድትሰጠኝ፥ መብሉንም እኔ እያየሁ እንድታዘጋጅልኝ፥ ከእጅዋም እንድበላው እለምንሃለሁ በል አለው።"], [6, "እንዲሁም አምኖን። ታምሜአለሁ ብሎ ተኛ፤ ንጉሡም ሊያየው በመጣ ጊዜ አምኖን ንጉሡን። እኅቴ ትዕማር እንድትመጣና እኔ እያየሁ ሁለት እንጎቻ እንድታደርግልኝ፥ ከእጅዋም እንድበላ እለምንሃለሁ አለው።"], [7, "ዳዊትም። መብልን ታዘጋጂለት ዘንድ ወደ ወንድምሽ ወደ አምኖን ቤት ሂጂ ብሎ መልእክተኞችን ወደ ትዕማር ቤት ላከ።"], [8, "ትዕማርም ወደ ወንድምዋ ወደ አምኖን ቤት ሄደች፥ ተኝቶም ነበር፤ ዱቄትም ወስዳ ለወሰች፥ እያየም እንጎቻ አደረገች፥ ጋገረችም።"], [9, "ምጣዱንም ወስዳ በፊቱ ገለበጠች እርሱ ግን ይበላ ዘንድ እንቢ አለ። አምኖንም። ሰውን ሁሉ ከእኔ ዘንድ አስወጡ አለ፤ ሰውም ሁሉ ከእርሱ ዘንድ ወጣ።"], [10, "አምኖንም ትዕማርን። ከእጅሽ እበላ ዘንድ መብሉን ወደ እልፍኙ አግቢው አላት፤ ትዕማርም የሠራችውን እንጎቻ ወስዳ ወንድምዋ አምኖን ወዳለበት እልፍኝ አገባችው።"], [11, "መብሉንም ባቀረበች ጊዜ ያዛትና። እኅቴ ሆይ፥ ነዪ ከእኔም ጋር ተኚ አላት።"], [12, "እርስዋ መልሳ። ወንድሜ ሆይ፥ አይሆንም፤ እንዲህ ያለ ነገር በእስራኤል ዘንድ አይገባምና አታሳፍረኝ፤ ይህንም ነውረኛ ሥራ አታድርግ።"], [13, "እኔም ነውሬን ወዴት ልሸከም? አንተም በእስራኤል ዘንድ ከምናምንቴዎች እንደ አንዱ ትሆናለህ፤ እንግዲህስ ለንጉሡ ንገረው፥ እኔንም አይነሣህም አለችው።"], [14, "ቃልዋን ግን አልሰማም፤ ከእርስዋም ይልቅ ብርቱ ነበረና በግድ አስነወራት፥ ከእርስዋም ጋር ተኛ።"], [15, "ከዚያም በኋላ አምኖን ፈጽሞ ጠላት፤ አስቀድሞም ከወደዳት ውድ ይልቅ በኋላ የጠላት ጥል በለጠ። አምኖንም። ተነሥተሽ ሂጂ አላት።"], [16, "እርስዋም። አይሆንም፤ ቀድሞ ከሠራኸው ክፋት ይልቅ አኔን በማውጣትህ የበለጠ ክፋት ትሠራለህ አለችው፤ እርሱ ግን አልሰማትም።"], [17, "የሚያገለግለውንም ብላቴና ጠርቶ። ይህችን ሴት ከፊቴ አስወጥተህ በሩን ዝጋባት አለው።"], [18, "ብዙ ኅብር ያለውንም ልብስ ለብሳ ነበር፥ እንዲህ ያለውን ልብስ የንጉሡ ልጆች ደናግሉ ይለብሱ ነበርና፤ አገልጋዩም አስወጥቶ በሩን ዘጋባት።"], [19, "ትዕማርም በራስዋ ላይ አመድ ነስንሳ፥ ብዙ ኅብርም ያለውን ልብስዋን ተርትራ፥ እጅዋንም በራስዋ ላይ ጭና እየጮኸች ሄደች።"], [20, "ወንድምዋም አቤሴሎም። ወንድምሽ አምኖን ከአንቺ ጋር ነበረን? እኅቴ ሆይ፥ አሁን ግን ዝም በዪ፤ ወንድምሽ ነው፤ ይህን ነገር በልብሽ አትያዢው አላት። ትዕማርም በወንድምዋ በአቤሴሎም ቤት ብቻዋን ተቀመጠች።"], [21, "ንጉሡም ዳዊት ይህን ነገር ሁሉ በሰማ ጊዜ እጅግ ተቈጣ፤ ነገር ግን የበኵር ልጁ ነበረና ስለ ወደደው የልጁን የአምኖን ነፍስ አላሳዘነም።"], [22, "አቤሴሎምም እኅቱን ትዕማርን ስላሳፈራት አምኖንን ጠልቶታልና አቤሴሎም አምኖንን ክፉም ሆነ መልካምም አልተናገረውም።"]]},{"ref": "2 ሳሙኤል 3:2-5", "key": 1, "v": [[2, "ለዳዊትም ወንድ ልጆች በኬብሮን ተወለዱለት፤ በኵሩም ከኢይዝራኤላዊቱ ከአኪናሆም የተወለደው አምኖን ነበረ።"], [3, "ሁለተኛውም የቀርሜሎሳዊው የናባል ሚስት ከነበረች ከአቢግያ የተወለደው ዶሎሕያ ነበረ። ሦስተኛውም ከጌሹር ንጉሥ ከተልማይ ልጅ ከመዓካ የተወለደው አቤሴሎም ነበረ።"], [4, "አራተኛውም የአጊት ልጅ አዶንያስ፥ አምስተኛውም የአቢጣል ልጅ ሰፋጥያስ ነበረ።"], [5, "ስድስተኛውም የዳዊት ልጅ ሚስት የዔግላ ልጅ ይትረኃም ነበረ። እነዚህም ለዳዊት በኬብሮን ተወለዱለት።"]]},{"ref": "2 ነገሥት 11:1-21", "key": 0, "v": [[1, "የአካዝያስም እናት ጎቶልያ ልጅዋ እንደ ሞተ ባየች ጊዜ ተነሥታ የመንግሥትን ዘር ሁሉ አጠፋች።"], [2, "የንጉሡ የኢዮራም ልጅ የአካዝያስ እኅት ዮሳቤት የአካዝያስን ልጅ ኢዮአስን ወስዳ ከተገደሉት ከንጉሥ ልጆች መካከል ሰረቀችው፤ እርሱንና ሞግዚቱንም ወደ እልፍኝ ወሰደች፥ እንዳይገደልም ከጎቶልያ ሸሸጉት።"], [3, "በእርስዋም ዘንድ ተሸሸጎ በእግዚአብሔር ቤት ስድስት ዓመት ያህል ተቀመጠ። ጎቶልያም በምድር ላይ ነገሠች።"], [4, "በሰባተኛውም ዓመት ዮዳሄ ልኮ በካራውያንና በዘበኞች ላይ ያሉትን የመቶ አለቆች ወሰደ፥ ወደ እግዚአብሔርም ቤት አገባቸው፤ ከእነርሱም ጋር ቃል ኪዳን አደረገ፥ በእግዚአብሔርም ቤት አማላቸው፥ የንጉሡንም ልጅ አሳያቸው።"], [5, "እንዲህም ብሎ አዘዛቸው። እንዲህ አድርጉ፤ በሰንበት ቀን ከምትገቡት ከእናንተ ከሦስት አንዱ እጅ የንጉሡን ቤት ዘብ ጠብቁ፤"], [6, "ከእናንተ ከሦስት አንዱ እጅ በሱር በር ሁኑ፤ አንዱም እጅ ከዘበኞች ቤት በኋላ ባለው በር ሁኑ፤ ቤቱንም ጠብቁ፥ ከልክሉም፤"], [7, "ከእናንተም በሰንበት ቀን የምትወጡት ሁለቱ እጅ በንጉሥ ዙሪያ ሆናችሁ የእግዚአብሔርን ቤት ጠብቁ።"], [8, "ንጉሡንም በዙሪያው ክበቡት፥ የጦር ዕቃችሁም በእጃችሁ ይሁን፤ በሰልፋችሁ መካከል የሚገባ ይገደል፤ ንጉሡም በወጣና በገባ ጊዜ ከእርሱ ጋር ሁኑ።"], [9, "መቶ አለቆችም ካህኑ ዮዳሄ ያዘዘውን ሁሉ አደረጉ፤ ከእነርሱም እያንዳንዱ በሰንበት ይገቡ የነበሩትን፥ በሰንበቱም ይወጡ የነበሩትን ሰዎች ይዘው ወደ ካህኑ ወደ ዮዳሄ መጡ።"], [10, "ካህኑም በእግዚአብሔር ቤት የነበረውን የንጉሡን የዳዊትን ጋሻና ጦር ሁሉ ለመቶ አለቆች ሰጣቸው።"], [11, "ዘበኞቹም ሁሉ እያንዳንዳቸው የጦር ዕቃቸውን በእጃቸው ይዘው በንጉሡ ዙሪያ ከቤቱ ቀኝ እስከ ቤቱ ግራ ድረስ በመሠዊያውና በቤቱ አጠገብ ቆሙ።"], [12, "የንጉሡንም ልጅ አውጥቶ ዘውዱን ጫነበት፥ ምስክሩንም ሰጠው፤ ቀብተውም ንጉሥ አደረጉትና። ንጉሡ ሺህ ዓመት ይንገሥ እያሉ እጃቸውን አጨበጨቡ።"], [13, "ጎቶልያም የሠራዊቱንና የሕዝቡን ድምፅ በሰማች ጊዜ ወደ ሕዝቡ ወደ እግዚአብሔር ቤት መጣች።"], [14, "እነሆም፥ ንጉሡ እንደ ተለመደው በዓምዱ አጠገብ ቆሞ፥ ከንጉሡም ጋር አለቆችና መለከተኞች ቆመው አየች፤ የአገሩም ሕዝብ ሁል ደስ ብሎአቸው ቀንደ መለከት ይነፉ ነበር። ጎቶልያም ልብስዋን ቀድዳ። ዓመፅ ነው፥ ዓመፅ ነው ብላ ጮኸች።"], [15, "ካህኑም ዮዳሄ በጭፍራው ላይ የተሾሙትን የመቶ አለቆች። ወደ ሰልፉ መካከል አውጡአት፤ የሚከተላትንም በሰይፍ ግደሉት ብሎ አዘዛቸው፤ ካህኑ። በእግዚአብሔር ቤት አትገደል ብሎአልና።"], [16, "እጃቸውንም በእርስዋ ላይ ጫኑ፥ በፈረሱም መግቢያ መንገድ ወደ ንጉሥ ቤት ወሰዱአት፥ በዚያም ገደሉአት።"], [17, "ዮዳሄም የእግዚአብሔር ሕዝብ ይሆኑ ዘንድ በእግዚአብሔርና በንጉሡ በሕዝቡም መካከል ቃል ኪዳን አደረገ፤ ደግሞም በንጉሡና በሕዝቡ መካከል ቃል ኪዳን አደረገ።"], [18, "የአገሩም ሕዝብ ሁሉ ወደ በኣል ቤት ሄደው አፈረሱት፤ መሠዊያዎቹንና ምስሎቹን አደቀቁ፥ የበኣልንም ካህን ማታንን በመሠዊያው ፊት ገደሉት። ካህኑም ለእግዚአብሔር ቤት አስተዳዳሪዎችን ሾመ።"], [19, "መቶ አለቆቹንና ካራውያንንም፥ ዘበኞችንና የአገሩንም ሕዝብ ሁሉ ወሰደ፤ ንጉሡንም ከእግዚአብሔር ቤት አወረዱት፥ በዘበኞችም በር መንገድ ወደ ንጉሡ ቤት አመጡት፤ በነገሥታቱም ዙፋን ተቀመጠ።"], [20, "የአገሩም ሕዝብ ሁሉ ደስ አላቸው፥ ከተማይቱም ጸጥ አለች። ጎቶልያንም በንጉሡ ቤት አጠገብ በሰይፍ ገደሉአት።"], [21, ""]]},{"ref": "1 ነገሥት 16:29-33፥ 2 ነገሥት 9:30-37", "key": 2, "v": [[29, "በይሁዳም ንጉሥ በአሳ በሠላሳ ስምንተኛው ዓመት የዘንበሪ ልጅ አክዓብ በእስራኤል ላይ ነገሠ፤ የዘንበሪም ልጅ አክዓብ በእስራኤል ላይ በሰማሪያ ሀያ ሁለት ዓመት ነገሠ።"], [30, "የዘንበሪም ልጅ አክዓብ ከእርሱ በፊት ከነበሩት ሁሉ ይልቅ በእግዚአብሔር ፊት ክፉ አደረገ።"], [31, "በናባጥም ልጅ በኢዮርብዓም ኃጢአት መሄድ ታናሽ ነገር መሰለው፥ የሲዶናውያንንም ንጉሥ የኤትበኣልን ልጅ ኤልዛቤልን አገባ፥ ሄዶም በኣልን አመለከ ሰገደለትም።"], [32, "በሰማርያም በሠራው በበኣል ቤት ውስጥ ለበኣል መሠዊያ አቆመ።"], [33, "አክዓብም የማምለኪያ ዐፀድ ተከለ፤ አክዓብም ከእርሱ በፊት ከነበሩት ሁሉ ይልቅ የእስራኤልን አምላክ እግዚአብሔርን የሚያስቈጣውን ነገር አበዛ።"], [30, "ኢዩም ወደ ኢይዝራኤል መጣ፤ ኤልዛቤልም በሰማች ጊዜ ዓይንዋን ተኳለች፥ ራስዋንም አስጌጠች፥ በመስኮትም ዘልቃ ትመለከት ነበር።"], [31, "ኢዩም በበሩ ሲገባ። ጌታውን የገደለ ዘምሪ ሆይ፥ ሰላም ነውን? አለችው።"], [32, "ፊቱንም ወደ መስኮቱ አንሥቶ። ከእኔ ጋር ማን ነው? አለ። ሁለት ሦስትም ጃንደረቦች ወደ እርሱ ተመለከቱ።"], [33, "እርሱም። ወደ ታች ወርውሩአት አለ፤ ወረወሩአትም፥ ደምዋም በግንቡና በፈረሶቹ ላይ ተረጨ፥ ረገጡአትም።"], [34, "በገባም ጊዜ በላ ጠጣም፤ ከዚያም በኋላ። ይህችን የተረገመች እዩ፤ የንጉሥ ልጅ ናትና ቅበሩአት አለ።"], [35, "ሊቀብሩአትም በሄዱ ጊዜ ከአናትዋና ከእግርዋ ከመዳፍም በቀር ምንም አላገኙም።"], [36, "ተመልሰውም ነገሩት፤ እርሱም። በባሪያው በቴስብያዊ ኤልያስ። በኢይዝራኤል እርሻ የኤልዛቤልን ሥጋ ውሾች ይበላሉ፤"], [37, "የኤልዛቤልም ሬሳ በኢይዝራኤል እርሻ መሬት ላይ እንደ ፍግ ይሆናልና ማንም። ይህች ኤልዛቤል ናት ይል ዘንድ አይችልም ብሎ የተናገረው የእግዚአብሔር ቃል ይህ ነው አለ።"]], "chap": {"5": "2 ነገሥት ምዕራፍ 9"}},{"ref": "መሳፍንት 16:4-22", "key": 0, "v": [[4, "ከዚህም በኋላ በሶሬቅ ሸለቆ የነበረች ደሊላ የተባለች አንዲት ሴትን ወደደ።"], [5, "የፍልስጥኤማውያንም መኳንንት ወደ እርስዋ ወጥተው። እርሱን ሸንግለሽ በእርሱ ያለ ታላቅ ኃይል በምን እንደ ሆነ፥ እኛስ እርሱን ለማዋረድ እናስረው ዘንድ የምናሸንፈው በምን እንደ ሆነ እወቂ፤ እኛም እያንዳንዳችን ሺህ አንድ መቶ ብር ሺህ አንድ መቶ ብር እንሰጥሻለን አሉአት።"], [6, "ደሊላም ሶምሶንን። ታላቅ ኃይልህ በምን እንደ ሆነ፥ እንድትዋረድስ የምትታሰርበት ምን እንደ ሆነ፥ እባክህ፥ ንገረኝ አለችው።"], [7, "ሶምሶንም። በሰባት ባልደረቀ በእርጥብ ጠፍር ቢያስሩኝ፥ እደክማለሁ እንደ ሌላም ሰው እሆናለሁ አላት።"], [8, "የፍልስጥኤማውያንም መኳንንት ሰባት ያልደረቀ እርጥብ ጠፍር አመጡላት፥ በእርሱም አሰረችው።"], [9, "በጓዳዋም ውስጥ ሰዎች ተደብቀው ነበር። እርስዋም። ሶምሶን ሆይ፥ ፍልስጥኤማውያን መጡብህ አለችው። እርሱም የተልባ እግር ፈትል እሳት በሸተተው ጊዜ እንዲበጠስ ጠፍሩን በጣጠሰው፤ ኃይሉም በምን እንደ ሆነ አልታወቀም።"], [10, "ደሊላም ሶምሶንን። እነሆ፥ አታለልኸኝ፥ የነገርኸኝም ሀሰት ነው፤ አሁንም የምትታሰርበት ምን እንደ ሆነ፥ እባክህ፥ ንገረኝ አለችው።"], [11, "እርሱም። ሥራ ባልተሠራበት በአዲስ ገመድ ቢያስሩኝ፥ እደክማለሁ፥ እንደ ሌላም ሰው እሆናለሁ አላት።"], [12, "ደሊላም አዲስ ገመድ ወስዳ በእርሱ አሰረችው፤ በጓዳዋም የተደበቁ ሰዎች ተቀምጠው ነበር። እርስዋም። ሶምሶን ሆይ፥ ፍልስጥኤማውያን መጡብህ አለችው። ገመዱንም ከክንዱ እንደ ፈትል በጣጠሰው።"], [13, "ደሊላም ሶምሶንን። እስከ አሁን ድረስ አታለልኸኝ፥ የነገርኸኝም ሐሰት ነው፤ የምትታሰርበት ምን እንደ ሆነ ንገረኝ አለችው። እርሱም። የራሴን ጠጕር ሰባቱን ጕንጕን ከድር ጋር ብትጐነጕኚው፥ በችካልም ብትቸክዪው፥ እደክማለሁ፥ እንደ ሌላም ሰው እሆናለሁ አላት።"], [14, "ሶምሶንም በተኛ ጊዜ ደሊላ የራሱን ጠጕር ሰባቱን ጕንጕን ከድሩ ጋር ጐነጐነችው፥ በችካልም ቸከለችውና። ሶምሶን ሆይ፥ ፍልስጥኤማውያን መጡብህ አለችው። ከእንቅልፉም ነቃ፥ ችካሉንም ከነቆንዳላው ድሩንም ነቀለ።"], [15, "እርስዋም። አንተ። እወድድሻለሁ እንዴት ትለኛለህ፥ ልብህ ከእኔ ጋር አይደለም? ስታታልለኝ ይህ ሦስተኛ ጊዜህ ነው፥ ታላቅ ኃይልህም በምን እንደ ሆነ አልነገርኸኝም አለችው።"], [16, "ዕለት ዕለትም በቃልዋ ነዘነዘችው አስቸገረችውም፥ ነፍሱም እስከ ሞት ድረስ ተጨነቀች።"], [17, "እርሱም። ከእናቴ ማኅፀን ጀምሬ ለእግዚአብሔር የተለየሁ ነኝና በራሴ ላይ ምላጭ አልደረሰም፤ የራሴንም ጠጕር ብላጭ ኃይሌ ከእኔ ይሄዳል፥ እደክማለሁም፥ እንደ ሌላም ሰው እሆናለሁ ብሎ የልቡን ሁሉ ገለጠላት።"], [18, "ደሊላም የልቡን ሁሉ እንደ ገለጠላት ባየች ጊዜ። የልቡን ሁሉ ገልጦልኛልና ይህን ጊዜ ደግሞ ኑ ብላ ላከችና የፍልስጥኤማውያንን መኳንንት ጠራች። የፍልስጥኤማውያን መኳንንትም ብሩን በእጃቸው ይዘው ወደ እርስዋ መጡ።"], [19, "እርስዋም በጕልበትዋ ላይ አስተኛችው፤ አንድ ሰውም ጠራች፥ እርሱም ሰባቱን የራሱን ጕንጕን ላጨው። ልታዋርደውም ጀመረች፥ ኃይሉም ከእርሱ ሄደ።"], [20, "እርስዋም። ሶምሶን ሆይ፥ ፍልስጥኤማውያን መጡብህ አለችው። ከእንቅልፉም ነቅቶ። እወጣለሁ እንደ ወትሮውም ጊዜ አደርጋለሁ አለ። ነገር ግን እግዚአብሔር ከእርሱ እንደ ተለየው አላወቀም።"], [21, "ፍልስጥኤማውያንም ይዘው ዓይኖቹን አወጡት፤ ወደ ጋዛም አምጥተው በናስ ሰንሰለት አሰሩት፤ በግዞትም ሆኖ እህል ይፈጭ ነበር።"], [22, "የራሱም ጠጕር ከላጩት በኋላ ያድግ ጀመር።"]]},{"ref": "ዘፍጥረት 19:15-26", "key": 11, "v": [[15, "ጎህም በቀደደ ጊዜ መላእክት ሎጥን። ተነሣ፥ ሚስትህንና ከዚህ ያሉትን ሁለቱን ሴቶች ልጆችህን ውሰድ፤ በከተማይቱ ኃጢአት እንዳትጠፋ እያሉ ያስቸኵሉት ነበር።"], [16, "እርሱም በዘገየ ጊዜ እግዚአብሔር ስላዘነለት እነዚያ ሰዎች የእርሱን እጅ የሚስቱንም እጅ የሁለቱን የሴቶች ልጆቹንም እጅ ይዘው አወጡትና በከተማይቱ ውጭ አስቀመጡት።"], [17, "ወደ ሜዳም ካወጡአቸው በኋላ እንዲህ አለው። ራስህን አድን፤ ወደ ኋላህ አትይ፥ በዚህም ዙሪያ ሁሉ አትቁም እንዳትጠፋም ወደ ተራራው ሸሽተህ አምልጥ።"], [18, "ሎጥም፤ አላቸው። ጌቶቼ ሆይ፥ እንዲህስ አይሁን፤"], [19, "እነሆ ባሪያህ በፊትህ ሞገስን አግኝቶአል፥ ነፍሴን ለማዳን ያደረግህልኝን ምሕረትህንም አብዝተሃል፤ ክፉ እንዳያገኘኝና እንዳልሞት ወደ ተራራ ሸሽቼ አመልጥ ዘንድ አልችልም፤"], [20, "እነሆ ይህች ከተማ ወደ እርስዋ ሸሽቶ ለማምለጥ ቅርብ ናት፥ እርስዋም ትንሽ ናት፤ ነፍሴን ለማዳን ወደ እርስዋ ሸሽቼ ላምልጥ፤ እርስዋ ትንሽ ከተማ አይደለችምን?"], [21, "እርሱም አለው። የተናገርሃትን ከተማ እንዳላጠፋት እነሆ በዚህ ነገር የለመንኸኝን ተቀብዬሃለሁ፤"], [22, "በቶሎ ወደዚያ ሸሽትህ አምልጥ፤ ወደዚያ እስክትደርስ ድረስ ምንም አደርግ ዘንድ አልችልምና። ስለዚህም የዚያች ከተማ ስም ዞዓር ተባለ።"], [23, "ሎጥ ወደ ዞዓር በገባ ጊዜ ፀሐይ በምድር ላይ ወጣች።"], [24, "እግዚአብሔርም በሰዶምና በገሞራ ላይ ከእግዚአብሔር ዘንድ ከሰማይ እሳትና ዲን አዘነበ፤"], [25, "እነዚያንም ከተሞች፥ በዙሪያቸው ያለውንም ሁሉ፥ በከተሞቹም የሚኖሩትን ሁሉ፥ የምድሩንም ቡቃያ ሁሉ ገለበጠ።"], [26, "የሎጥም ሚስት ወደ ኋላዋ ተመለከተች፥ የጨው ሐውልትም ሆነች።"]]},{"ref": "ኢዮብ 2:7-10", "key": 2, "v": [[7, "ሰይጣንም ከእግዚአብሔር ፊት ወጣ፥ ኢዮብንም ከእግሩ ጫማ ጀምሮ እስከ አናቱ ድረስ በክፉ ቍስል መታው።"], [8, "ሥጋውንም ይፍቅበት ዘንድ ገል ወሰደ፥ በአመድም ላይ ተቀመጠ።"], [9, "ሚስቱም። እስከ አሁን ፍጹምነትህን ይዘሃልን? እግዚአብሔርን ስደብና ሙት አለችው።"], [10, "እርሱ ግን አንቺ ከሰነፎች ሴቶች እንደ አንዲቱ ተናገርሽ፤ ከእግዚአብሔር እጅ መልካሙን ተቀበልን፥ ክፉ ነገርንስ አንቀበልምን? አላት። በዚህ ሁሉ ኢዮብ በከንፈሩ አልበደለም።"]]},{"ref": "መሳፍንት 13:2-24", "key": 1, "v": [[2, "ከዳን ወገን የሆነ ማኑሄ የሚባል አንድ የጾርዓ ሰው ነበረ፤ ሚስቱም መካን ነበረች፥ ልጅም አልወለደችም።"], [3, "የእግዚአብሔርም መልአክ ለሴቲቱ ተገልጦ እንዲህ አላት። እነሆ፥ አንቺ መካን ነሽ፥ ልጅም አልወለድሽም፤ ነገር ግን ትፀንሻለሽ፥ ወንድ ልጅም ትወልጃለሽ።"], [4, "አሁንም ተጠንቀቂ፤ የወይን ጠጅን የሚያሰክርም ነገር አትጠጪ፥ ርኩስም ነገር አትብዪ።"], [5, "እነሆ፥ ትፀንሻለሽ፥ ወንድ ልጅም ትወልጃለሽ፤ ልጁም ከእናቱ ማኅፀን ጀምሮ ለእግዚአብሔር የተለየ ናዝራዊ ይሆናልና በራሱ ላይ ምላጭ አይድረስበት፤ እርሱም እስራኤልን ከፍልስጥኤማውያን እጅ ማዳን ይጀምራል።"], [6, "ሴቲቱም ወደ ባልዋ መጥታ። አንድ የእግዚአብሔር ሰው ወደ እኔ መጣ፥ መልኩም እንደ እግዚአብሔር መልአክ እጅግ የሚያስደነግጥ ነበረ፤ ከወዴትም እንደ መጣ አልጠየቅሁትም፥ እርሱም ስሙን አልነገረኝም።"], [7, "እርሱም። እነሆ፥ ትፀንሻለሽ፥ ወንድ ልጅም ትወልጃለሽ፤ ልጁም ከእናቱ ማኅፀን ጀምሮ እስኪሞት ድረስ ለእግዚአብሔር የተለየ ናዝራዊ ይሆናልና አሁን የወይን ጠጅ የሚያሰክርም ነገር አትጠጪ፥ ርኩስም ነገር አትብዪ አለኝ ብላ ተናገረች።"], [8, "ማኑሄም። ጌታ ሆይ፥ የላክኸው የእግዚአብሔር ሰው፥ እባክህ፥ እንደ ገና ወደ እኛ ይምጣ፤ ለሚወለደውም ልጅ ምን እንድናደርግ ያስገንዝበን ብሎ ወደ እግዚአብሔር ለመነ።"], [9, "እግዚአብሔርም የማኑሄን ድምፅ ሰማ፤ የእግዚአብሔርም መልአክ እንደ ገና ለሴቲቱ በእርሻ ውስጥ ተቀምጣ ሳለች ተገለጠላት፤ ባልዋ ማኑሄ ግን ከእርስዋ ጋር አልነበረም።"], [10, "ሴቲቱም ፈጥና ሮጠች ለባልዋም። እነሆ፥ በቀደም ዕለት ወደ እኔ የመጣው ሰው ደግሞ ተገለጠልኝ ብላ ነገረችው።"], [11, "ማኑሄም ተነሥቶ ሚስቱን ተከተለ፥ ወደ ሰውዮውም መጥቶ። ከዚህች ሴት ጋር የተነጋገርህ አንተ ነህን? አለው። እርሱም። እኔ ነኝ አለ።"], [12, "ማኑሄም። ቃልህ በደረሰ ጊዜ የልጁ ሥርዓት ምንድር ነው? የምናደርግለትስ ምንድር ነው? አለው።"], [13, "የእግዚአብሔርም መልአክ ማኑሄን። ሴቲቱ ከነገርኋፅት ሁሉ ትጠንቀቅ።"], [14, "ከወይንም ከሚወጣው ሁሉ አትብላ፥ የወይን ጠጅንም የሚያሰክርንም ነገር አትጠጣ፥ ርኩስም ነገር ሁሉ አትብላ፤ ያዘዝኋትን ሁሉ ትጠብቅ አለው።"], [15, "ማኑሄም የእግዚአብሔርን መልአክ። የፍየል ጠቦት እስክናዘጋጅልህ ድረስ፥ እባክህ፥ ቆይ አለው።"], [16, "የእግዚአብሔርም መልአክ ማኑሄን። አንተ የግድ ብትለኝ መብልህን አልበላም፤ የሚቃጠለውንም መሥዋዕት ማዘጋጀት ብትወድድ ለእግዚአብሔር አቅርበው አለው። ማኑሄም የእግዚአብሔር መልአክ መሆኑን አላወቀም ነበር።"], [17, "ማኑሄም የእግዚአብሔርን መልአክ። ነገርህ በደረሰ ጊዜ እንድናከብርህ ስምህ ማን ነው? አለው።"], [18, "የእግዚአብሔርም መልአክ። ስሜ ድንቅ ነውና ለምን ትጠይቃለህ? አለው።"], [19, "ማኑሄም የፍየሉን ጠቦትና የእህሉን ቍርባን ወስዶ በድንጋይ ላይ ለእግዚአብሔር አቀረበው። መልአኩም ተአምራት አደረገ፥ ማኑሄና ሚስቱም ይመለከቱ ነበር።"], [20, "ነበልባሉም ከመሠዊያው ላይ ወደ ሰማይ በወጣ ጊዜ የእግዚአብሔርም መልአክ በመሠዊያው ነበልባል ውስጥ ዐረገ፤ ማኑሄና ሚስቱም ተመለከቱ፥ በምድርም በግምባራቸው ተደፉ።"], [21, "የእግዚአብሔርም መልአክ ዳግመኛ ላማኑሄና ለሚስቱ አልተገለጠም፤ ያን ጊዜም ማኑሄ የእግዚአብሔር መልአክ መሆኑን አወቀ።"], [22, "ማኑሄም ሚስቱን። እግዚአብሔርን አይተናልና ሞት እንሞታለን አላት።"], [23, "ሚስቱም። እግዚአብሔርስ ሊገድለን ቢወድድ ኖሮ የሚቃጠለውን መሥዋዕትና የእህሉን ቍርባን ከእጃችን ባልተቀበለን፥ ይህንም ነገር ሁሉ ባላሳየን፥ እንዲህ ያለ ነገርም በዚህ ጊዜ ባላስታወቀን ነበር አለችው።"], [24, "ሴቲቱም ወንድ ልጅ ወለደች፥ ስሙንም ሶምሶን ብላ ጠራችው፤ ልጁም አደገ እግዚአብሔርም ባረከው።"]]},{"ref": "መሳፍንት 11:30-40", "key": 6, "v": [[30, "ዮፍታሔም። በእውነት የአሞንን ልጆች በእጄ አሳልፈህ ብትሰጠኝ፥"], [31, "ከአሞን ልጆች ዘንድ በደኅና በተመለስሁ ጊዜ፥ ሊገናኘኝ ከቤቴ ደጅ የሚወጣው ማንኛውም ለእግዚአብሔር ይሆናል፤ ለሚቃጠልም መሥዋዕት አቀርበዋለሁ ብሎ ለእግዚአብሔር ስእለት ተሳለ።"], [32, "ዮፍታሔም ሊዋጋቸው ወደ አሞን ልጆች አለፈ፥ እግዚአብሔርም በእጁ አሳልፎ ሰጣቸው።"], [33, "ከአሮዔርም እስከ ሚኒትና እስከ አቤልክራሚም ድረስ ሀያ ከተሞችን በታላቅ አገዳደል መታቸው። የአሞንም ልጆች በእስራኤል ልጆች ፊት ተዋረዱ።"], [34, "ዮፍታሄም ወደ ቤቱ ወደ ምጽጳ መጣ፥ እነሆም ልጁ ከበሮ ይዛ እየዘፈነች ልትገናኘው ወጣች፤ ለእርሱም አንዲት ብቻ ነበረች፤ ከእርስዋም በቀር ወንድ ወይም ሴት ሌላ ልጅ አልነበረውም።"], [35, "እርስዋንም ባየ ጊዜ ልብሱን ቀድዶ። አወይ ልጄ ሆይ! ወደ እግዚአብሔር አፌን ከፍቻለሁና፥ ከዚያውም እመለስ ዘንድ አልችልምና በጣም አዋረድሽኝ አስጨነቅሽኝም አላት።"], [36, "እርስዋም። አባቴ ሆይ፥ አፍህን ለእግዚአብሔር ከከፈትህ፥ እግዚአብሔር በጠላቶችህ በአሞን ልጆች ላይ ተበቅሎልሃልና በአፍህ እንደ ተናገርህ አድርግብኝ አለችው።"], [37, "አባትዋንም። ይህ ነገር ይደረግልኝ፤ ከዚህ ሄጄ በተራሮች ላይ እንድወጣና እንድወርድ፥ ከባልንጀሮቼም ጋር ለድንግልናዬ እንዳለቅስ ሁለት ወር አሰናብተኝ አለችው።"], [38, "እርሱም። ሂጂ አለ። ሁለት ወርም አሰናበታት፤ ከባልንጀሮችዋም ጋር ሄደች፥ በተራሮችም ላይ ለድንግልናዋ አለቀሰች።"], [39, "ሁለትም ወር ከተፈጸመ በኋላ ወደ አባትዋ ተመለሰች፥ እንደ ተሳለውም ስእለት አደረገባት፤ እርስዋም ወንድ አላወቀችም ነበር።"], [40, "የእስራኤልም ሴቶች ልጆች በዓመት በዓመቱ እየሄዱ የገለዓዳዊውን የዮፍታሔን ልጅ በዓመት አራት ቀን ሙሾ እንዲያወጡ በእስራኤል ዘንድ ልማድ ሆነ።"]]},{"ref": "ሆሴዕ 1:2-9", "key": 1, "v": [[2, "እግዚአብሔር መጀመሪያ በሆሴዕ በተናገረ ጊዜ፥ እግዚአብሔር ሆሴዕን። ምድሪቱ ከእግዚአብሔር ርቃ ታላቅ ግልሙትና ታደርጋለችና ሂድ፤ ጋለሞታን ሴትና የግልሙትናን ልጆች ለአንተ ውሰድ አለው።"], [3, "እርሱም ሄዶ የዴቤላይምን ልጅ ጎሜርን አገባ፤ እርስዋም ፀነሰች ወንድ ልጅንም ወለደችለት።"], [4, "እግዚአብሔርም። ከጥቂት ዘመን በኋላ የኢይዝራኤልን ደም በኢዩ ቤት ላይ እበቀላለሁና፥ ከእስራኤልም ቤት መንግሥትን እሽራለሁና ስሙን ኢይዝራኤል ብለህ ጥራው፤"], [5, "በዚያም ቀን በኢይዝራኤል ሸለቆ ውስጥ የእስራኤልን ቀስት እሰብራለሁ አለው።"], [6, "ደግሞ ፀነሰች ሴት ልጅንም ወለደች። እግዚአብሔርም። ይቅር እላቸው ዘንድ የእስራኤልን ቤት ከእንግዲህ ወዲህ አልምርምና ስምዋን ሎሩሃማ ብለህ ጥራት፤"], [7, "ነገር ግን የይሁዳን ቤት እምራለሁ፤ በአምላካቸውም በእግዚአብሔር አድናቸዋለሁ እንጂ በቀስት ወይም በሰይፍ ወይም በሰልፍ ወይም በፈረሶች ወይም በፈረሰኞች አላድናቸውም አለው።"], [8, "ሎሩሃማም ጡት ባስጣለች ጊዜ፥ ደግሞ ፀነሰች ወንድ ልጅንም ወለደች።"], [9, "እግዚአብሔርም። ሕዝቤ አይደላችሁምና፥ እኔም አምላክ አልሆናችሁምና ስሙን ሎዓሚ ብለህ ጥራው አለው።"]]},{"ref": "1 ሳሙኤል 1:2-7", "key": 0, "v": [[2, "ሁለትም ሚስቶች ነበሩት፤ የአንዲቱ ስም ሐና የሁለተኛይቱም ስም ፍናና ነበረ፤ ለፍናናም ልጆች ነበሩአት፥ ለሐና ግን ልጅ አልነበራትም።"], [3, "ያም ሰው በሴሎ ይሰግድ ዘንድ ለሠራዊት ጌታም ለእግዚአብሔር ይሠዋ ዘንድ ከከተማው በየዓመቱ ይወጣ ነበር። የእግዚአብሔርም ካህናት ሁለቱ የዔሊ ልጆች አፍኒንና ፊንሐስ በዚያ ነበሩ።"], [4, "ሕልቃና የሚሠዋበት ቀን በደረሰ ጊዜም ለሚስቱ ለፍናና ለወንዶችና ለሴቶች ልጆችዋ ሁሉ እድል ፈንታቸውን ሰጣቸው።"], [5, "ሐናንም ይወድድ ነበርና ለሐና ሁለት እጥፍ እድል ፈንታ ሰጣት። እግዚአብሔር ግን ማኅፀንዋን ዘግቶ ነበር።"], [6, "እግዚአብሔርም ማኅፀንዋን ዘግቶ ነበርና ጣውንትዋ ታስቆጣት ታበሳጫትም ነበር።"], [7, "በየዓመቱም እንዲህ ባደረገ ጊዜ እርስዋም ወደ እግዚአብሔር በምትወጣበት ጊዜ ታበሳጫት ነበር፤ ሐናም ታለቅስ ነበር፥ አንዳችም አትቀምስም ነበር።"]]},{"ref": "1 ሳሙኤል 14:49-50፥ 18:17-19", "key": 0, "v": [[49, "የሳኦልም ወንዶች ልጆች ዮናታን፥ የሱዊ፥ ሜልኪሳ ነበሩ፤ የሁለቱም ሴቶች ልጆቹ ስም ይህ ነበረ፤ የታላቂቱ ስም ሜሮብ፥ የታናሺቱም ስም ሜልኮል ነበረ።"], [50, "የሳኦልም ሚስት ስም የአኪማአስ ልጅ አኪናሆም ነበረ፤ የሠራዊቱም አለቃ ስም የሳኦል አጎት የኔር ልጅ አበኔር ነበረ።"], [17, "ሳኦልም ዳዊትን። ታላቂቱ ልጄ ሜሮብ እነኋት፤ እርስዋን እድርልሃለሁ፤ ብቻ ቀልጣፋ ልጅ ሁንልኝ፥ ስለ እግዚአብሔርም ጦርነት ተጋደል አለው። ሳኦልም። የፍልስጥኤማውያን እጅ በእርሱ ላይ ትሁን እንጂ የእኔ እጅ በእርሱ ላይ አትሁን ይል ነበር።"], [18, "ዳዊትም ሳኦልን። ለንጉሥ አማች እሆን ዘንድ እኔ ማን ነኝ? ሰውነቴስ ምንድር ናት? የአባቴስ ወገን በእስራኤል ዘንድ ምንድር ነው? አለው።"], [19, "ነገር ግን የሳኦል ልጅ ሜሮብ ዳዊትን የምታገባበት ጊዜ ሲደርስ ለመሓላታዊው ለኤስድሪኤል ተዳረች።"]], "chap": {"2": "ምዕራፍ 18"}},{"ref": "1 ሳሙኤል 25:43-44፥ 27:3፥ 30:5፥ 18", "key": 0, "v": [[43, "ዳዊትም ደግሞ ኢይዝራኤላዊቱን አኪናሆምን ወሰደ፤ ሁለቱም ሚስቶች ሆኑለት።"], [44, "ሳኦል ግን የዳዊትን ሚስት ልጁን ሜልኮልን አገሩ ጋሊም ለነበረው ለሌሳ ልጅ ለፈልጢ ሰጥቶ ነበር።"], [3, "ዳዊትና ሰዎቹም እያንዳንዳቸው ከነ ቤተ ሰቡ ከአንኩስ ጋር በጌት ውስጥ ተቀመጡ፤ ከዳዊትም ጋር ኢይዝራኤላዊቱ አኪናሆምና የቀርሜሎሳዊው የናባል ሚስት አቢግያ ሁለቱ ሚስቶቹ ነበሩ።"], [5, "የዳዊትም ሁለቱ ሚስቶቹ ኢይዝራኤላዊቱ አኪናሆምና የቀርሜሎሳዊው የናባል ሚስት የነበረችው አቢግያ ተማርከው ነበር።"], [18, "ዳዊትም አማሌቃውያን የወሰዱትን ሁሉ አስጣላቸው፥ ሁለቱንም ሚስቶቹን አዳነ።"]], "chap": {"2": "ምዕራፍ 27", "3": "ምዕራፍ 30"}},{"ref": "2 ሳሙኤል 3:2-5", "key": 2, "v": [[2, "ለዳዊትም ወንድ ልጆች በኬብሮን ተወለዱለት፤ በኵሩም ከኢይዝራኤላዊቱ ከአኪናሆም የተወለደው አምኖን ነበረ።"], [3, "ሁለተኛውም የቀርሜሎሳዊው የናባል ሚስት ከነበረች ከአቢግያ የተወለደው ዶሎሕያ ነበረ። ሦስተኛውም ከጌሹር ንጉሥ ከተልማይ ልጅ ከመዓካ የተወለደው አቤሴሎም ነበረ።"], [4, "አራተኛውም የአጊት ልጅ አዶንያስ፥ አምስተኛውም የአቢጣል ልጅ ሰፋጥያስ ነበረ።"], [5, "ስድስተኛውም የዳዊት ልጅ ሚስት የዔግላ ልጅ ይትረኃም ነበረ። እነዚህም ለዳዊት በኬብሮን ተወለዱለት።"]]},{"ref": "1 ሳሙኤል 28:7-25", "key": 0, "v": [[7, "ሳኦልም ባሪያዎቹን። ወደ እርስዋ ሄጄ እጠይቅ ዘንድ መናፍስትን የምትጠራ ሴት ፈልጉልኝ አላቸው፤ ባሪያዎቹም። እነሆ፥ መናፍስትን የምትጠራ አንዲት ሴት በዓይንዶር አለች አሉት።"], [8, "ሳኦልም መልኩን ለውጦ ሌላ ልብስም ለብሶ ሄደ፥ ሁለትም ሰዎች ከእርሱ ጋር ነበሩ፥ በሌሊትም ወደ ሴቲቱ መጡ። እርሱም። እባክሽ፥ በመናፍስት አምዋርቺልኝ፥ የምልሽንም አስነሽልኝ አላት።"], [9, "ሴቲቱም። እነሆ፥ መናፍስት ጠሪዎችንና ጠንቋዮችን ከምድር እንዳጠፋ ሳኦል ያደረገውን ታውቃለህ፤ ስለ ምን እኔን ለማስገደል ወጥመድ ለነፍሴ ታደርጋለህ? አለችው።"], [10, "ሳኦልም። ሕያው እግዚአብሔርን! በዚህ ነገር ቅጣት አያገኝሽም ብሎ በእግዚአብሔር ማለላት።"], [11, "ሴቲቱም። ማንን ላስነሣልህ? አለች፤ እርሱም። ሳሙኤልን አስነሽልኝ አለ።"], [12, "ሴቲቱም ሳሙኤልን ባየች ጊዜ በታላቅ ድምፅ ጮኸች፤ ሴቲቱም ሳኦልን። አንተ ሳኦል ስትሆን ለምን አታለልኸኝ? ብላ ተናገረችው።"], [13, "ንጉሡም። አትፍሪ፤ ያየሽው ምንድር ነው? አላት። ሴቲቱም ሳኦልን። አማልክት ከምድር ሲወጡ አየሁ አለችው።"], [14, "እርሱም። መልኩ ምን ዓይነት ነው? አላት። እርስዋም። ሽማግሌ ሰው ወጣ፤ መጐናጸፊያም ተጐናጽፎአል አለች። ሳኦልም ሳሙኤል እንደ ሆነ አወቀ፥ በፊቱም ተጐነበሰ፥ በምድርም ላይ እጅ ነሣ።"], [15, "ሳሙኤልም ሳኦልን። ለምን አወክኸኝ? ለምንስ አስነሣኸኝ? አለው። ሳኦልም መልሶ። ፍልስጥኤማውያን ይወጉኛልና እጅግ ተጨንቄአለሁ፥ እግዚአብሔርም ከእኔ ርቆአል፤ በነቢያት ወይም በሕልም አልመለሰልኝም፤ ስለዚህም የማደርገውን ታስታውቀኝ ዘንድ ጠራሁህ አለው።"], [16, "ሳሙኤልም አለ። እግዚአብሔር ከራቀህ ጠላትም ከሆነህ ለምን ትጠይቀኛለህ?"], [17, "እግዚአብሔርም በቃሌ እንደ ተናገረ አድርጎአል፤ እግዚአብሔርም መንግሥትህን ከእጅህ ነጥቆ ለጎረቤትህ ለዳዊት ሰጥቶታል።"], [18, "የእግዚአብሔርን ቃል አልሰማህምና፥ በአማሌቅም ላይ ታላቅ የሆነ ቍጣውን አላደረግህምና ስለዚህ ዛሬ እግዚአብሔር ይህን ነገር አድርጎብሃል።"], [19, "እግዚአብሔርም እስራኤልን ከአንተ ጋር በፍልስጥኤማውያን እጅ አሳልፎ ይሰጣል፤ ነገም አንተና ልጆችህ ከእኔ ጋር ትሆናላችሁ፤ እግዚአብሔርም የእስራኤልን ጭፍራ ደግሞ በፍልስጥኤማውያን እጅ አሳልፎ ይሰጣል።"], [20, "ሳኦልም በዚያን ጊዜ በቁመቱ ሙሉ በምድር ላይ ወደቀ፥ ከሳሙኤልም ቃል የተነሣ እጅግ ፈራ። በዚያም ቀን ሁሉ በዚያም ሌሊት ሁሉ እንጀራ አልበላምና ኃይል አልቀረለትም።"], [21, "ሴቲቱም ወደ ሳኦል መጣች፥ እጅግም ደንግጦ እንደ ነበረ አይታ። እነሆ፥ እኔ ባሪያህ ቃልህን ሰማሁ፥ ነፍሴንም በእጄ ጣልሁ፥ የነገርኸኝንም ቃል ሰማሁ።"], [22, "አሁን እንግዲህ አንተ ደግሞ የባሪያህን ቃል እንድትሰማ እለምንሃለሁ፥ በፊትህም ቍራሽ እንጀራ ላኑርልህ፤ በመንገድም ስትሄድ ትበረታ ዘንድ ብላ አለችው።"], [23, "እርሱ ግን። አልበላም ብሎ እንቢ አለ፤ ነገር ግን ባሪያዎቹና ሴቲቱ አስገደዱት፥ ቃላቸውንም ሰማ፤ ከምድርም ተነሥቶ በአልጋ ላይ ተቀመጠ።"], [24, "ለሴቲቱም ማለፊያ እንቦሳ ነበራት፤ ፈጥና አረደችው፤ ዱቄቱንም ወስዳ ለወሰችው፥ ቂጣም እንጀራ አድርጋ ጋገረችው።"], [25, "በሳኦልና በባሪያዎቹም ፊት አቀረበችው፤ በልተውም ተነሡ፥ በዚያም ሌሊት ሄዱ።"]]},{"ref": "ማቴዎስ 14:1-12", "key": 2, "v": [[1, "በዚያ ዘመን የአራተኛው ክፍል ገዥ ሄሮድስ የኢየሱስን ዝና ሰማ፥"], [2, "ለሎሌዎቹም። ይህ መጥምቁ ዮሐንስ ነው፤ እርሱ ከሙታን ተነሥቶአል፥ ስለዚህም ኃይል በእርሱ ይደረጋል አለ።"], [3, "ሄሮድስ በወንድሙ በፊልጶስ ሚስት በሄሮድያዳ ምክንያት ዮሐንስን አስይዞ አሳስሮት በወህኒ አኑሮት ነበርና፤"], [4, "ዮሐንስ። እርስዋ ለአንተ ትሆን ዘንድ አልተፈቀደም ይለው ነበርና።"], [5, "ሊገድለውም ወዶ ሳለ፥ ሕዝቡ እንደ ነቢይ ስለ አዩት ፈራቸው።"], [6, "ነገር ግን ሄሮድስ የተወለደበት ቀን በሆነ ጊዜ፥ የሄሮድያዳ ልጅ በመካከላቸው ዘፈነች ሄሮድስንም ደስ አሰኘችው፤"], [7, "ስለዚህም የምትለምነውን ሁሉ እንዲሰጣት በመሐላ ተስፋ አደረገላት።"], [8, "እርስዋም በእናትዋ ተመክራ። የመጥምቁን የዮሐንስን ራስ በዚህ በወጭት ስጠኝ አለችው።"], [9, "ንጉሡም አዘነ፥ ነገር ግን ስለ መሐላው ከእርሱም ጋር ተቀምጠው ስላሉት ሰዎች እንዲሰጡአት አዘዘ፤"], [10, "ልኮም የዮሐንስን ራስ በወህኒ አስቆረጠው።"], [11, "ራሱንም በወጭት አምጥተው ለብላቴናይቱ ሰጡአት፥ ወደ እናትዋም ወሰደችው።"], [12, "ደቀ መዛሙርቱም ቀርበው በድኑን ወሰዱና ቀበሩት፥ መጥተውም ለኢየሱስ አወሩለት።"]]},{"ref": "ማቴዎስ 14:6-11", "key": 0, "v": [[6, "ነገር ግን ሄሮድስ የተወለደበት ቀን በሆነ ጊዜ፥ የሄሮድያዳ ልጅ በመካከላቸው ዘፈነች ሄሮድስንም ደስ አሰኘችው፤"], [7, "ስለዚህም የምትለምነውን ሁሉ እንዲሰጣት በመሐላ ተስፋ አደረገላት።"], [8, "እርስዋም በእናትዋ ተመክራ። የመጥምቁን የዮሐንስን ራስ በዚህ በወጭት ስጠኝ አለችው።"], [9, "ንጉሡም አዘነ፥ ነገር ግን ስለ መሐላው ከእርሱም ጋር ተቀምጠው ስላሉት ሰዎች እንዲሰጡአት አዘዘ፤"], [10, "ልኮም የዮሐንስን ራስ በወህኒ አስቆረጠው።"], [11, "ራሱንም በወጭት አምጥተው ለብላቴናይቱ ሰጡአት፥ ወደ እናትዋም ወሰደችው።"]]},{"ref": "ሐዋርያት ሥራ 5:1-11", "key": 0, "v": [[1, "ሐናንያም የተባለ አንድ ሰው ሰጲራ ከተባለች ከሚስቱ ጋር መሬት ሸጠ፥"], [2, "ሚስቱም ደግሞ ስታውቅ ከሽያጩ አስቀረና እኩሌታውን አምጥቶ በሐዋርያት እግር አጠገብ አኖረው።"], [3, "ጴጥሮስም። ሐናንያ ሆይ፥ መንፈስ ቅዱስን ታታልልና ከመሬቱ ሽያጭ ታስቀር ዘንድ ሰይጣን በልብህ ስለ ምን ሞላ?"], [4, "ሳትሸጠው የአንተ አልነበረምን? ከሸጥኸውስ በኋላ በሥልጣንህ አልነበረምን? ይህን ነገር ስለ ምን በልብህ አሰብህ? እግዚአብሔርን እንጂ ሰውን አልዋሸህም አለው።"], [5, "ሐናንያም ይህን ቃል ሰምቶ ወደቀ ሞተም፤ በሰሙትም ሁሉ ላይ ታላቅ ፍርሃት ሆነ።"], [6, "ጐበዞችም ተነሥተው ከፈኑት አውጥተውም ቀበሩት።"], [7, "ከሦስት ሰዓት ያህል በኋላም ሚስቱ የሆነውን ሳታውቅ ገባች።"], [8, "ጴጥሮስም መልሶ። እስቲ ንገሪኝ፥ መሬታችሁን ይህን ለሚያህል ሸጣችሁትን? አላት። እርስዋም። አዎን፥ ይህን ለሚያህል ነው አለች።"], [9, "ጴጥሮስም። የጌታን መንፈስ ትፈታተኑ ዘንድ ስለ ምን ተስማማችሁ? እነሆ፥ ባልሽን የቀበሩት ሰዎች እግር በደጅ ነው አንቺንም ያወጡሻል አላት።"], [10, "ያን ጊዜም በእግሩ አጠገብ ወደቀች ሞተችም፤ ጐበዞችም ሲገቡ ሞታ አገኙአት አውጥተውም በባልዋ አጠገብ ቀበሩአት።"], [11, "በቤተ ክርስቲያን ሁሉና ይህንም በሰሙ ሁሉ ላይ ታላቅ ፍርሃት ሆነ።"]]},{"ref": "ሐዋርያት ሥራ 24:24-27", "key": 0, "v": [[24, "ከጥቂት ቀንም በኋላ ፊልክስ አይሁዳዊት ከነበረች ድሩሲላ ከሚሉአት ከሚስቱ ጋር መጥቶ ጳውሎስን አስመጣ፥ በኢየሱስ ክርስቶስም ስለ ማመን የሚናገረውን ሰማው።"], [25, "እርሱም ስለ ጽድቅና ራስን ስለ መግዛት ስለሚመጣውም ኵነኔ ሲነጋገር ሳለ፥ ፊልክስ ፈርቶ። አሁንስ ሂድ፥ በተመቸኝም ጊዜ ልኬ አስጠራሃለሁ ብሎ መለሰለት።"], [26, "ያን ጊዜም ደግሞ እንዲፈታው ጳውሎስ ገንዘብ ይሰጠው ዘንድ ተስፋ አደረገ፤ ስለዚህ ደግሞ ብዙ ጊዜ እያስመጣ ያነጋግረው ነበር።"], [27, "ሁለት ዓመትም ከሞላ በኋላ ጶርቅዮስ ፊስጦስ በፊልክስ ፈንታ ተተካ። ፊልክስም አይሁድን ደስ ያሰኝ ዘንድ ወዶ ጳውሎስን እንደ ታሰረ ተወው።"]]},{"ref": "ሐዋርያት ሥራ 25:13-26:32", "key": 0, "v": [[13, "ከጥቂት ቀንም በኋላ ንጉሡ አግሪጳ በርኒቄም ለፊስጦስ ሰላምታ እንዲያቀርቡ ወደ ቂሳርያ ወረዱ።"], [14, "በዚያውም ብዙ ቀን ስለተቀመጡ ፊስጦስ የጳውሎስን ነገር ለንጉሡ እንዲህ ብሎ ገለጠ። ፊልክስ አስሮ የተወው አንድ ሰው በዚህ አለ፤"], [15, "በኢየሩሳሌምም ሳለሁ የካህናት አለቆችና የአይሁድ ሽማግሌዎች እፈርድበት ዘንድ እየለመኑ ስለ እርሱ አመለከቱኝ።"], [16, "እኔም። ተከሳሹ በከሳሾቹ ፊት ለፊት ሳይቆም ለተከሰሰበትም መልስ ይሰጥ ዘንድ ፈንታ ሳያገኝ፥ ማንንም ቢሆን አሳልፎ መስጠት የሮማውያን ሥርዓት አይደለም ብዬ መለስሁላቸው።"], [17, "ስለዚህም በዚህ በተሰበሰቡ ጊዜ፥ ሳልዘገይ በማግሥቱ በፍርድ ወንበር ተቀምጬ ያንን ሰው ያመጡት ዘንድ አዘዝሁ።"], [18, "ከሳሾቹም በቆሙ ጊዜ እኔ ያሰብሁትን ክፉ ነገር ክስ ምንም አላመጡበትም፤"], [19, "ነገር ግን ስለ ገዛ ሃይማኖታቸውና ጳውሎስ። ሕያው ነው ስለሚለው ስለ ሞተው ኢየሱስ ስለ ተባለው ከእርሱ ጋር ይከራከሩ ነበር።"], [20, "እኔም ይህን ነገር እንዴት እንድመረምር አመንትቼ። ወደ ኢየሩሳሌም ሄደህ በዚህ ነገር ከዚያ ልትፋረድ ትወዳለህን? አልሁት።"], [21, "ጳውሎስ ግን አውግስጦስ ቄሣር እስኪቈርጥ ድረስ እንዲጠበቅ ይግባኝ ባለ ጊዜ፥ ወደ ቄሣር እስክሰደው ድረስ ይጠበቅ ዘንድ አዘዝሁ።"], [22, "አግሪጳም ፊስጦስን። ያንንስ ሰው እኔ ዳግም እኮ እሰማው ዘንድ እወድ ነበር አለው። እርሱም። ነገ ትሰማዋለህ አለው።"], [23, "በነገውም አግሪጳና በርኒቄ በብዙ ግርማ መጥተው ከሻለቆችና ከከተማው ታላላቆች ጋር ወደ ፍርድ ቤት ገቡ፤ ፊስጦስም ባዘዘ ጊዜ ጳውሎስን አመጡት።"], [24, "ፊስጦስም አለ። አግሪጳ ንጉሥ ሆይ እናንተም ከእኛ ጋር ያላችሁ ሰዎች ሁሉ፥ ከእንግዲህ ወዲህ በሕይወት ይኖር ዘንድ እንዳይገባው እየጮኹ የአይሁድ ሕዝብ ሁሉ በኢየሩሳሌም በዚህም ስለ እርሱ የለመኑኝን ይህን ሰው ታዩታላችሁ።"], [25, "እኔ ግን ሞት የሚገባውን ነገር እንዳላደረገ አስተዋልሁ፥ እርሱም ወደ አውግስጦስ ይግባኝ ስላለ እሰደው ዘንድ ቈረጥሁ።"], [26, "ስለ እርሱም ወደ ጌታዬ የምጽፈው እርግጥ ነገር የለኝም፤ ስለዚህ ከተመረመረ በኋላ የምጽፈውን ነገር አገኝ ዘንድ በፊታችሁ ይልቁንም በፊትህ፥ ንጉሥ አግሪጳ ሆይ፥ አመጣሁት፤"], [27, "እስረኛ ሲላክ የተከሰሰበትን ምክንያት ደግሞ አለማመልከት ሞኝነት መስሎኛልና።"], [30, "ንጉሡም አገረ ገዡም በርኒቄም ከእነርሱም ጋር ተቀምጠው የነበሩት ተነሡ፥"], [31, "ፈቀቅ ብለውም እርስ በርሳቸው። ይህ ሰው እንኳንስ ለሞት ለእስራትም የሚገባ ምንም አላደረገ ብለው ተነጋገሩ።"], [32, "አግሪጳም ፈስጦስን። ይህ ሰው እኮ ወደ ቄሣር ይግባኝ ባይል ይፈታ ዘንድ ይቻል ነበር አለው።"]], "chap": {"15": "ምዕራፍ 26"}},{"ref": "ሐዋርያት ሥራ 12:12-17", "key": 0, "v": [[12, "ባስተዋለም ጊዜ እጅግ ሰዎች ተከማችተው ይጸልዩበት ወደ ነበረው ማርቆስ ወደ ተባለው ወደ ዮሐንስ እናት ወደ ማርያም ቤት መጣ።"], [13, "ጴጥሮስም የደጁን መዝጊያ ባንኳኳ ጊዜ ሮዴ የሚሉአት አንዲት ገረድ ትሰማ ዘንድ ቀረበች፤"], [14, "የጴጥሮስ ድምፅ መሆኑንም ባወቀች ጊዜ ከደስታዋ የተነሣ ደጁን አልከፈተችም፥ ነገር ግን ወደ ውስጥ ሮጣ ጴጥሮስ በደጅ ፊት ቆሞ እንዳለ አወራች።"], [15, "እነርሱም። አብደሻል አሉአት። እርስዋ ግን እንዲሁ እንደ ሆነ ታስረግጥ ነበር። እነርሱም። መልአኩ ነው አሉ።"], [16, "ጴጥሮስ ግን ማንኳኳቱን አዘወተረ፤ ከፍተውም አዩትና ተገረሙ።"], [17, "ግን ዝም እንዲሉ በእጁ ጠቅሶ ጌታ ከወኅኒ እንዴት እንዳወጣው ተረከላቸውና። ይህን ለያዕቆብና ለወንድሞች ንገሩ አላቸው። ወጥቶም ወደ ሌላ ስፍራ ሄደ።"]]},{"ref": "ሐዋርያት ሥራ 17:22-34", "key": 12, "v": [[22, "ጳውሎስም በአርዮስፋጎስ መካከል ቆሞ እንዲህ አለ። የአቴና ሰዎች ሆይ፥ እናንተ በሁሉ ነገር አማልክትን እጅግ እንደምትፈሩ እመለከታለሁ።"], [23, "የምታመልኩትን እየተመለከትሁ ሳልፍ። ለማይታወቅ አምላክ የሚል ጽሕፈት ያለበትን መሠዊያ ደግሞ አግኝቼአለሁና። እንግዲህ ይህን ሳታውቁ የምታመልኩትን እኔ እነግራችኋለሁ።"], [24, "ዓለሙንና በእርሱ ያለውን ሁሉ የፈጠረ አምላክ እርሱ የሰማይና የምድር ጌታ ነውና እጅ በሠራው መቅደስ አይኖርም፤"], [25, "እርሱም ሕይወትንና እስትንፋስን ሁሉንም ለሁሉ ይሰጣልና አንዳች እንደሚጎድለው በሰው እጅ አይገለገልም።"], [26, "-"], [27, "ምናልባትም እየመረመሩ ያገኙት እንደ ሆነ፥ እግዚአብሔርን ይፈልጉ ዘንድ በምድር ሁሉ ላይ እንዲኖሩ የሰውን ወገኖች ሁሉ ከአንድ ፈጠረ፥ የተወሰኑትንም ዘመኖችና ለሚኖሩበት ስፍራ ዳርቻ መደበላቸው። ቢሆንም ከእያንዳንዳችን የራቀ አይደለም።"], [28, "ከእናንተ ከባለ ቅኔዎች አንዳንዶች ደግሞ። እኛ ደግሞ ዘመዶቹ ነንና ብለው እንደ ተናገሩ፥ በእርሱ ሕያዋን ነንና እንንቀሳቀሳለን እንኖርማለን።"], [29, "እንግዲህ የእግዚአብሔር ዘመዶች ከሆን     const kind=i%6===5?'g':(i%2?'b':'a');

    wheelSvg.appendChild(path);
    const mid=a0+SEG/2, tp=wpt(196,mid);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',tp[0].toFixed(1)); t.setAttribute('y',tp[1].toFixed(1));
    t.setAttribute('text-anchor','middle'); t.setAttribute('dominant-baseline','middle');
    t.setAttribute('transform','rotate('+((mid>180?mid-270:mid-90)).toFixed(1)+' '+tp[0].toFixed(1)+' '+tp[1].toFixed(1)+')');
    t.setAttribute('class','wlabel wlabel-'+kind);
    if(order.length>40)t.style.fontSize='10px';if(order.length>60)t.style.fontSize='8px';
    t.textContent=w.n;
    wheelSvg.appendChild(t);
  });
  const hub=document.createElementNS(NS,'circle');
  hub.setAttribute('cx','300'); hub.setAttribute('cy','300'); hub.setAttribute('r','84'); hub.setAttribute('class','wheel-hubface');
  wheelSvg.appendChild(hub);
  const ring=document.createElementNS(NS,'circle');
  ring.setAttribute('cx','300'); ring.setAttribute('cy','300'); ring.setAttribute('r','293'); ring.setAttribute('class','wheel-ring');
  wheelSvg.appendChild(ring);
  const ring2=document.createElementNS(NS,'circle');
  ring2.setAttribute('cx','300'); ring2.setAttribute('cy','300'); ring2.setAttribute('r','286'); ring2.setAttribute('class','wheel-ring2');
  wheelSvg.appendChild(ring2);
}
function showView(v){
  $('catFilters').classList.toggle('hidden',v!=='wheel');
  $('wheelView').classList.toggle('hidden',v!=='wheel');
  $('study').classList.toggle('hidden',v!=='card');
  $('swipeNote').classList.toggle('hidden',v!=='card');
  $('toWheel').classList.toggle('hidden',v!=='card');
}
function setWheelControls(){
  const dis=wheelSpinning;
  $('spin').disabled=dis; $('wheelSpin').disabled=dis; $('hubSpin').disabled=dis;
  $('toWheel').disabled=dis; sel.disabled=dis; $('prev').disabled=dis; $('next').disabled=dis;
  $('spin').textContent=dis?'በዕጣ ላይ…':'ዕጣ';
  $('wheelSpin').textContent=dis?'በዕጣ ላይ…':'ዕጣ';
}
function spinWheel(){
  if(wheelSpinning)return;
  buildWheel(); showView('wheel');
  if(order.length<2)return;
  let targetPos; do{targetPos=Math.floor(Math.random()*order.length)}while(targetPos===pos);
  const finish=()=>{
    wheelSpinning=false; setWheelControls();
    pos=targetPos; render(); showView('card');
    const card=$('card'); card.classList.remove('landed'); void card.offsetWidth; card.classList.add('landed');
    setTimeout(()=>card.classList.remove('landed'),520);
  };
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){finish();return}
  wheelSpinning=true; setWheelControls();
  const jitter=Math.random()*8-4;
  const desired=((-(targetPos*SEG+SEG/2)+jitter)%360+360)%360;
  const curMod=((curRot%360)+360)%360;
  curRot=curRot+360*5+(((desired-curMod)+360)%360);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    rotor.style.transition='transform 5.4s cubic-bezier(.12,.72,.06,1)';
    rotor.style.transform='rotate('+curRot+'deg)';
  })});
  let done=false;
  const onEnd=()=>{if(done)return;done=true;rotor.removeEventListener('transitionend',onEnd);setTimeout(finish,380)};
  rotor.addEventListener('transitionend',onEnd);
  setTimeout(onEnd,6000);
}
$('spin').onclick=()=>spinWheel();
$('wheelSpin').onclick=()=>spinWheel();
$('hubSpin').onclick=()=>spinWheel();
$('wheelStage').addEventListener('click',e=>{if(e.target.closest('button'))return;spinWheel()});
$('toWheel').onclick=()=>{if(wheelSpinning)return;buildWheel();showView('wheel')};
sel.addEventListener('change',()=>{if(!wheelSpinning)showView('card')});
buildWheel(); showView('wheel');
render();
})();
</script>

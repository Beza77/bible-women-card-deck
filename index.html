    /* — ዕጣ spin (lottery) — */
    .spin-btn{position:relative;min-width:84px;letter-spacing:.02em}
    .spin-btn:disabled{opacity:.72;cursor:wait}
    .spin-btn.spinning{border-color:var(--gold);background:color-mix(in srgb,var(--gold-soft) 62%,var(--paper));color:var(--accent)}
    .card.spinning{animation:spinShake .11s linear infinite}
    .card.spinning .front{filter:saturate(1.06)}
    .card.spinning .portrait{filter:blur(.4px)}
    .card.landed{animation:landPulse .48s cubic-bezier(.22,1,.36,1)}
    @keyframes spinShake{0%{transform:translateX(0) scale(1)}25%{transform:translateX(-3px) scale(.997)}75%{transform:translateX(3px) scale(.997)}100%{transform:translateX(0) scale(1)}}
    @keyframes landPulse{0%{transform:scale(.985);box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 55%,transparent),var(--shadow)}55%{transform:scale(1.008);box-shadow:0 0 0 10px color-mix(in srgb,var(--gold) 28%,transparent),var(--shadow)}100%{transform:scale(1);box-shadow:var(--shadow)}}

    /* — Spinner wheel (ዕጣ ዊል) — */

    .toolbar{grid-template-columns:minmax(0,1fr) auto auto}

    .wlabel-a{fill:var(--seg-a-tx)}.wlabel-b{fill:var(--seg-b-tx)}.wlabel-g{fill:var(--seg-g-tx)}
    .wheel-ring{fill:none;stroke:var(--gold);stroke-width:6}
    .wheel-ring2{fill:none;stroke:color-mix(in srgb,var(--gold) 50%,var(--line));stroke-width:2}
    .wheel-hubface{fill:var(--paper);stroke:var(--gold);stroke-width:3}
    .wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:5;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:27px solid var(--gold);filter:drop-shadow(0 3px 4px rgba(31,77,51,.35))}
    .wheel-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;width:27%;aspect-ratio:1/1;border-radius:50%;border:0;background:transparent;color:var(--accent);font-family:"Noto Serif Ethiopic",serif;font-weight:700;font-size:clamp(20px,5vw,30px);cursor:pointer;display:grid;place-items:center;padding:0}

    .wheel-spin-btn{height:52px;padding-inline:38px;border-radius:999px;border-color:color-mix(in srgb,var(--gold) 60%,var(--line));font-size:19px}
    .wheel-spin-btn:disabled{opacity:.72;cursor:wait}
    .wheel-hint{margin:0;color:var(--muted);font-size:13.5px;text-align:center;padding:0 10px}
    @media(max-width:760px){

    /* — Category filter (spin page) — */

    .catbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(31,77,51,.05)}
    .catbtn:hover{border-color:var(--accent)}
    .catbtn:focus-visible{outline:3px solid color-mix(in srgb,var(--gold) 72%,transparent);outline-offset:2px}
    .catbtn[aria-pressed="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
    .catbtn .n{font-weight:800;color:var(--gold)}
    .catbtn[aria-pressed="true"] .n{color:var(--gold-soft)}
    .wheel-stage{width:min(86vw,calc(100dvh - 368px),520px)}
    @media(max-width:760px){

    }
    /* — Pinch zoom: browser/finger zoom stays enabled — */

<script>
(function(){
const women = [
 {n:'አስቴር',c:'ንግሥት',b:'መጽሐፈ አስቴር',i:'esther.jpg',f:'ሕዝቧን ለማዳን ሕይወቷን አደጋ ላይ ጥላ ወደ ንጉሡ ቀረበች።',s:'አስቴር በፋርስ ንግሥት ሆነች። ሐማ አይሁድን ለማጥፋት ሲያሴር፣ እርሷ ጾመችና ሕዝቧንም ወደ ጾም ጠራች። ባልተጠራችበት ጊዜ ወደ ንጉሡ በመግባት ሕይወቷን አደጋ ላይ ጣለች። በድፍረቷም ሕዝቧ ዳነ።',v:'“…ምንም እንኳ ያለ ሕግ ቢሆን ወደ ንጉሡ እገባለሁ፤ ብጠፋም እጠፋለሁ።”',r:'አስቴር 4:16',l:'እግዚአብሔር ያስቀመጠንን ቦታ ሌሎችን ለመጠበቅ በድፍረት ልንጠቀምበት እንችላለን።'},
 {n:'ሩት',c:'ታማኝ ምራት',b:'መጽሐፈ ሩት',i:'ruth.jpg',f:'ኑኃሚንን እና አምላኳን በመምረጥ የታማኝነት ምሳሌ ሆነች።',s:'ሩት ሞዓባዊት ነበረች። ባሏ ከሞተ በኋላ ከአማቷ ኑኃሚን ጋር ወደ ቤተልሔም ሄደች። በትጋት እህል እየቃረመች ኑኃሚንን ተንከባከበች። ቦዔዝን አግብታም የንጉሥ ዳዊት ቅድመ አያት ሆነች።',v:'“…ሕዝብሽ ሕዝቤ፥ አምላክሽም አምላኬ ይሆናል፤”',r:'ሩት 1:16',l:'ፍቅር እና ታማኝነት በትንሽ የዕለት ተዕለት ውሳኔዎች ይገለጣሉ።'},
 {n:'ሔዋን',c:'የመጀመሪያዋ ሴት',b:'ዘፍጥረት 2–4',i:'eve.jpg',f:'በመጽሐፍ ቅዱስ የመጀመሪያዋ ሴትና የሕያዋን ሁሉ እናት ተባለች።',s:'እግዚአብሔር ሔዋንን ለአዳም ረዳትና አጋር አድርጎ ፈጠራት። በኤደን ገነት ኖሩ። እርሷና አዳም የእግዚአብሔርን ትእዛዝ ባለመታዘዛቸው ኃጢአት ወደ ዓለም ገባ። ሆኖም እግዚአብሔር የቤዛነት ተስፋ ሰጠ።',v:'“አዳምም ለሚስቱ ሔዋን ብሎ ስም አወጣ፥ የሕያዋን ሁሉ እናት ናትና።”',r:'ዘፍጥረት 3:20',l:'ውሳኔዎቻችን ውጤት አላቸው፤ እግዚአብሔር ግን በውድቀታችንም መካከል ተስፋ ይሰጣል።'},
 {n:'ሣራ',c:'እናት',b:'ዘፍጥረት 11–23',i:'sarah.jpg',f:'በእርጅናዋ ይስሐቅን ወልዳ የተስፋው ልጅ እናት ሆነች።',s:'ሣራ የአብርሃም ሚስት ነበረች። ልጅ ሳይኖራት ብዙ ዓመታትን ጠበቀች። እግዚአብሔር የገባውን ቃል ፈጽሞ በእርጅናዋ ይስሐቅን ሰጣት። ሳቋም ወደ ደስታ ተለወጠ።',v:'“ሣራም። እግዚአብሔር ሳቅ አድርጎልኛል፤ ይህንንም የሚሰማ ሁሉ በእኔ ምክንያት ይስቃል አለች።”',r:'ዘፍጥረት 21:6',l:'የእግዚአብሔር ጊዜ ከእኛ ጊዜ ቢለይም ተስፋው የታመነ ነው።'},
 {n:'ርብቃ',c:'እናት',b:'ዘፍጥረት 24–27',i:'rebekah.jpg',f:'ለእንግዳውና ለግመሎቹ በልግስና ውኃ አጠጣች።',s:'የአብርሃም አገልጋይ ለይስሐቅ ሚስት ሲፈልግ እግዚአብሔር ርብቃን መራው። ርብቃ ለእርሱና ለግመሎቹ ውኃ በመቅዳት ትጋቷንና ልግስናዋን አሳየች። ቤተሰቧን ትታ በእምነት ወደ አዲስ ሕይወት ሄደች። የዔሳውና የያዕቆብ እናት ሆነች።',v:'“ርብቃንም ጠርተው። ከዚህ ሰው ጋር ትሄጃለሽን? አሉአት። እርስዋም። እሄዳለሁ አለች።”',r:'ዘፍጥረት 24:58',l:'ልግስናና ፈቃደኝነት ወደ እግዚአብሔር አዲስ ጥሪ ሊመሩን ይችላሉ።'},
 {n:'ማርያም (የሙሴ እህት)',c:'ነቢይት',b:'ዘፀአት 2፣ 15',i:'miriam.jpg',f:'እስራኤል ባሕሩን ከተሻገረ በኋላ ሴቶችን በዝማሬ መራች።',s:'ማርያም የሙሴ እህት ነበረች። ሕፃኑ ሙሴ በወንዝ ሲቀመጥ በንቃት ተከታተለችው። ከቀይ ባሕር መሻገር በኋላ ከበሮ ይዛ ሴቶችን በምስጋና መራች። እርሷ በእስራኤል መካከል ነቢይት ተብላለች።',v:'“…በክብር ከፍ ከፍ ብሎአልና ለእግዚአብሔር ዘምሩ፤ ፈረሱንና ፈረሰኛውን በባሕር ጣለ።”',r:'ዘፀአት 15:21',l:'የእግዚአብሔርን ማዳን በማስታወስ ሌሎችን ወደ ምስጋና መምራት እንችላለን።'},
 {n:'ረዓብ',c:'የእምነት ሴት',b:'ኢያሱ 2፣ 6',i:'rahab.jpg',f:'የእስራኤልን ሰላዮች በመደበቅ በእግዚአብሔር ላይ እምነቷን ገለጠች።',s:'ረዓብ በኢያሪኮ ትኖር ነበር። የእስራኤልን ሰላዮች ተቀብላ ከአደጋ ሰወረቻቸው። የእስራኤል አምላክ በሰማይና በምድር አምላክ መሆኑን ተናገረች። ኢያሪኮ ሲወድቅ እርሷና ቤተሰቧ ዳኑ።',v:'“…አምላካችሁም እግዚአብሔር በላይ በሰማይ በታችም በምድር እርሱ አምላክ ነውና…”',r:'ኢያሱ 2:11',l:'እምነት አዲስ መጀመሪያ ይከፍታል፤ ያለፈው ሕይወታችን የወደፊታችንን አይወስንም።'},
 {n:'ዲቦራ',c:'ዳኛና ነቢይት',b:'መሳፍንት 4–5',i:'deborah.jpg',f:'እስራኤልን በጥበብ የመራች ዳኛና ነቢይት ነበረች።',s:'ዲቦራ በዘንባባ ዛፍ ሥር ተቀምጣ ለሕዝቡ ትፈርድ ነበር። እግዚአብሔር ባርቅን ወደ ጦርነት እንዲወጣ በእርሷ በኩል ጠራው። ዲቦራ ከእርሱ ጋር በመሄድ ድፍረት ሰጠችው። ከድሉ በኋላ ከባርቅ ጋር የምስጋና መዝሙር ዘመረች።',v:'“አንቺ፥ ዲቦራ፥ እስክትነሽ ድረስ፥ ለእስራኤልም እናት ሆነሽ እስክትነሽ ድረስ…”',r:'መሳፍንት 5:7',l:'መሪነት ጥበብን፣ ድፍረትን እና ሌሎችን ማበረታታትን ይፈልጋል።'},
 {n:'ኑኃሚን',c:'አማት',b:'መጽሐፈ ሩት',i:'naomi.jpg',f:'ከታላቅ ሐዘን በኋላ በሩት ፍቅር እና በእግዚአብሔር እንክብካቤ ተመለሰች።',s:'ኑኃሚን ባሏንና ሁለት ልጆቿን በሞዓብ አጣች። በልብ ስብራት ወደ ቤተልሔም ስትመለስ ሩት አብራት መጣች። ኑኃሚን ሩትን በጥበብ መክራ ወደ ቦዔዝ መራቻት። በመጨረሻም የልጅ ልጇን በእቅፏ አደረገች።',v:'“ሴቶችም ኑኃሚንን። ዛሬ ዋርሳ ያላሳጣሽ እግዚአብሔር ይባረክ፤ ስሙም በእስራኤል ይጠራ።”',r:'ሩት 4:14',l:'እግዚአብሔር በሐዘን ውስጥ እንኳ በሰዎች ፍቅር ተስፋን ያበቅላል።'},
 {n:'ሐና',c:'የጸሎት እናት',b:'1 ሳሙኤል 1–2',i:'hannah.jpg',f:'ልቧን በጸሎት አፍስሳ ሳሙኤልን ለእግዚአብሔር አቀረበች።',s:'ሐና ልጅ ባለማግኘቷ በጥልቅ ሐዘን ውስጥ ነበረች። በሴሎ ቤተ መቅደስ ልቧን ለእግዚአብሔር አፈሰሰች። እግዚአብሔር ጸሎቷን ሰምቶ ሳሙኤልን ሰጣት። ሐናም የገባችውን ቃል ጠብቃ ልጇን ለእግዚአብሔር አቀረበች።',v:'“ሰለዚህ ሕፃን ጸለይሁ፤”',r:'1 ሳሙኤል 1:27',l:'ሐዘናችንን በቅንነት ለእግዚአብሔር ልናፈስ እንችላለን።'},
 {n:'አቢግያ',c:'የጥበብ ሴት',b:'1 ሳሙኤል 25',i:'abigail.jpg',f:'በጥበብና በትሕትና ዳዊትን ከደም መፍሰስ አስቆመች።',s:'አቢግያ ብልህና አስተዋይ ሴት ነበረች። ባሏ ናባል ዳዊትን ሲያስቆጣው፣ እርሷ ስጦታ ይዛ በፍጥነት ወጣች። በትሕትና ተናግራ ዳዊትን ከበቀል መለሰችው። ዳዊትም ጥበቧን ባረከ።',v:'“ወደ ደም እንዳልሄድ፥ በእጄም በቀል እንዳላደርግ ዛሬ የከለከለኝ አእምሮሽ የተመሰገነ ይሁን፥ አንቺም የተመሰገንሽ ሁኚ።”',r:'1 ሳሙኤል 25:33',l:'በትክክለኛው ጊዜ የተነገረ የጥበብ ቃል ትልቅ ጉዳትን ሊከለክል ይችላል።'},
 {n:'የሳባ ንግሥት',c:'ንግሥት',b:'1 ነገሥት 10',i:'queen-sheba.jpg',f:'የሰሎሞንን ጥበብ ለመፈተን ከሩቅ ሀገር መጣች።',s:'የሳባ ንግሥት የሰሎሞንን ዝና ሰምታ በከባድ ጥያቄዎች ልትፈትነው መጣች። ሰሎሞን ጥያቄዎቿን ሁሉ መለሰላት። ጥበቡንና የመንግሥቱን ሥርዓት ስታይ ተደነቀች። ጥበብን የሰጠውን እግዚአብሔር ባረከች።',v:'“አንተን የወደደ፥ በእስራኤልም ዙፋን ያስቀመጠህ አምላክህ እግዚአብሔር የተባረከ ይሁን፤ …”',r:'1 ነገሥት 10:9',l:'እውነተኛ ጥበብን በትሕትና መፈለግና ሲገኝም ማክበር ይገባል።'},
 {n:'ኤልሳቤጥ',c:'እናት',b:'ሉቃስ 1',i:'elizabeth.jpg',f:'በእርጅናዋ መጥምቁ ዮሐንስን ወለደች።',s:'ኤልሳቤጥና ዘካርያስ በእግዚአብሔር ፊት ጻድቃን ነበሩ። ልጅ ሳይኖራቸው ወደ እርጅና ደረሱ። እግዚአብሔር ጸሎታቸውን ሰምቶ ዮሐንስን ሰጣቸው። ማርያም ስትጎበኛት በመንፈስ ቅዱስ ተሞልታ ባረከቻት።',v:'“ከጌታ፤ የተነገረላት ቃል ይፈጸማልና ያመነች ብፅዕት ናት።”',r:'ሉቃስ 1:45',l:'የሌላውን እምነትና ጥሪ በቃላችን ማበረታታት እንችላለን።'},
 {n:'ማርያም',c:'የኢየሱስ እናት',b:'ማቴዎስ 1–2፣ ሉቃስ 1–2',i:'mary.jpg',f:'የእግዚአብሔርን ጥሪ በትሕትና ተቀብላ የኢየሱስ እናት ሆነች።',s:'መልአኩ ገብርኤል ለማርያም የመሲሑ እናት እንደምትሆን ነገራት። ታላቅ ምስጢር ቢሆንም በእምነት ተቀበለች። ኢየሱስን ወልዳ አሳደገችው። ከመስቀሉም አጠገብ በታማኝነት ቆመች።',v:'“ማርያምም። እነሆኝ የጌታ ባሪያ እንደ ቃልህ ይሁንልኝ አለች።”',r:'ሉቃስ 1:38',l:'እግዚአብሔርን መታመን ሁሉን ሳንረዳ እንኳ ለጥሪው “አዎ” ማለት ነው።'},
 {n:'መግደላዊት ማርያም',c:'ደቀ መዝሙር',b:'ሉቃስ 8፣ ዮሐንስ 20',i:'mary-magdalene.jpg',f:'ከትንሣኤው በኋላ ጌታ ኢየሱስን ካዩት የመጀመሪያዎቹ አንዷ ነበረች።',s:'ኢየሱስ መግደላዊት ማርያምን ፈወሳት። እርሷም ከሌሎች ሴቶች ጋር ኢየሱስን ተከተለችና በገንዘቧ አገለገለች። በመስቀሉና በመቃብሩ አጠገብ ቆየች። የተነሣው ኢየሱስ ተገልጦላት ዜናውን ለደቀ መዛሙርቱ እንድታደርስ ላካት።',v:'“መግደላዊት ማርያም መጥታ ጌታን እንዳየች ይህንም እንዳላት ለደቀ መዛሙርቱ ነገረች።”',r:'ዮሐንስ 20:18',l:'ኢየሱስ የተለወጠ ሕይወታችንን የትንሣኤው ምስክር ያደርገዋል።'},
 {n:'ማርታ',c:'አስተናጋጅ',b:'ሉቃስ 10፣ ዮሐንስ 11–12',i:'martha.jpg',f:'በወንድሟ ሞት መካከል ኢየሱስ መሲሕ መሆኑን መሰከረች።',s:'ማርታ ኢየሱስን በቤቷ በፍቅር ተቀበለች። አንድ ጊዜ በብዙ አገልግሎት ተጨንቃ ነበር፣ ኢየሱስም በፊቱ መቀመጥ እንዳስፈለጋት አስታወሳት። ወንድሟ አልዓዛር ሲሞት በሐዘን መካከል እምነቷን ገለጠች። ኢየሱስም አልዓዛርን ከሞት አስነሣው።',v:'“እርስዋም። አዎን ጌታ ሆይ፤ አንተ ወደ ዓለም የሚመጣው ክርስቶስ የእግዚአብሔር ልጅ እንደ ሆንህ እኔ አምናለሁ አለችው።”',r:'ዮሐንስ 11:27',l:'አገልግሎታችን ከኢየሱስ ጋር ካለን ግንኙነት መፍለቅ አለበት።'},
 {n:'ሳምራዊቷ ሴት',c:'ምስክር',b:'ዮሐንስ 4',i:'samaritan-woman.jpg',f:'ከኢየሱስ ጋር በውኃ ጉድጓድ አጠገብ ተገናኝታ ከተማዋን ወደ እርሱ ጠራች።',s:'ኢየሱስ በሰማርያ የያዕቆብ ጉድጓድ አጠገብ አንዲትን ሴት አገኘ። የሕይወት ውኃ እንደሚሰጥ ነገራት። እርሱ ሕይወቷን በሙሉ እንደሚያውቅ ስትረዳ መሲሑን እንዳገኘች አመነች። ውኃ ማድጋዋን ትታ ወደ ከተማ ሮጠችና ሰዎችን ወደ ኢየሱስ ጠራች።',v:'“ያደረግሁትን ሁሉ የነገረኝን ሰው ኑና እዩ፤ እንጃ እርሱ ክርስቶስ ይሆንን? አለች።”',r:'ዮሐንስ 4:29',l:'ከኢየሱስ ጋር የሚደረግ እውነተኛ ግንኙነት ኀፍረትን ወደ ምስክርነት ይለውጣል።'},
 {n:'ልድያ',c:'አማኝና ነጋዴ',b:'ሐዋርያት ሥራ 16',i:'lydia.jpg',f:'በአውሮፓ በጳውሎስ አገልግሎት መልእክቱን ከተቀበሉት የመጀመሪያዎቹ አንዷ ነበረች።',s:'ልድያ በፊልጵስዩስ የምትኖር የሐምራዊ ልብስ ነጋዴ ነበረች። በወንዝ ዳር ሴቶች ሲጸልዩ ጳውሎስን ሰማች። ጌታ ልቧን ከፈተላትና እርሷና ቤተሰቧ ተጠመቁ። ቤቷን ለወንጌል አገልግሎት ከፈተች።',v:'“…ጳውሎስም የሚናገረውን ታዳምጥ ዘንድ ጌታ ልብዋን ከፈተላት።”',r:'ሐዋርያት ሥራ 16:14',l:'የተከፈተ ልብና የተከፈተ ቤት የወንጌል በረከት ለብዙዎች ያደርሳሉ።'},
 {n:'ጵርስቅላ',c:'አስተማሪ',b:'ሐዋርያት ሥራ 18፣ ሮሜ 16',i:'priscilla.jpg',f:'ከባሏ አቂላ ጋር አጵሎስን የእግዚአብሔርን መንገድ ይበልጥ በትክክል አስተማረች።',s:'ጵርስቅላና አቂላ ድንኳን ሰሪዎችና የጳውሎስ አገልግሎት አጋሮች ነበሩ። አጵሎስ በድፍረት ሲያስተምር ሰሙት። ከዚያም ወስደው የእግዚአብሔርን መንገድ ይበልጥ በትክክል ገለጹለት። ቤታቸውም የቤተ ክርስቲያን መሰብሰቢያ ሆነ።',v:'“…ጵርስቅላና አቂላም በሰሙት ጊዜ፥ ወስደው የእግዚአብሔርን መንገድ ከፊት ይልቅ በትክክል ገለጡለት።”',r:'ሐዋርያት ሥራ 18:26',l:'እውቀታችንን በትሕትናና በአክብሮት ሌሎችን ለማጠናከር መጠቀም እንችላለን።'},
 {n:'ፌበን',c:'አገልጋይ',b:'ሮሜ 16',i:'phoebe.jpg',f:'ጳውሎስ የቀንክራኦስ ቤተ ክርስቲያን አገልጋይና የብዙዎች ረዳት ብሎ አስተዋወቃት።',s:'ፌበን በቀንክራኦስ ቤተ ክርስቲያን ታማኝ አገልጋይ ነበረች። ጳውሎስ ለሮሜ አማኞች በክብር እንዲቀበሏት ጠየቀ። እርሷ ለብዙዎችና ለጳውሎስ ራሱ ረዳት ሆና ነበር። የእርሷ አገልግሎት በቀዳሚዋ ቤተ ክርስቲያን የተከበረ ነበር።',v:'“…እርስዋ ለብዙዎች ለእኔም ለራሴ ደጋፊ ነበረችና፥ …”',r:'ሮሜ 16:2',l:'ታማኝ እርዳታ እና አገልግሎት በእግዚአብሔር ሥራ ውስጥ ትልቅ ዋጋ አላቸው።'},
 {n:'ነቢይቱ ሐና',c:'ነቢይት',b:'ሉቃስ 2',i:'anna.jpg',f:'በእርጅናዋ በቤተ መቅደስ በጾምና በጸሎት ታገለግል ነበር።',s:'ነቢይቱ ሐና በእርጅናዋ ከቤተ መቅደስ አትለይም ነበር። ሌሊትና ቀን በጾምና በጸሎት አገለገለች። ማርያምና ዮሴፍ ሕፃኑን ኢየሱስ ሲያመጡ እርሷም በዚያ ነበረች። እግዚአብሔርን አመሰገነችና ቤዛነትን ለሚጠባበቁ ሁሉ ስለ ሕፃኑ ተናገረች።',v:'“በዚያችም ሰዓት ቀርባ እግዚአብሔርን አመሰገነች፤ የኢየሩሳሌምንም ቤዛ ለሚጠባበቁ ሁሉ ስለ እርሱ ትናገር ነበር።”',r:'ሉቃስ 2:38',l:'ትዕግሥት ያለው ጸሎት እግዚአብሔር የሚሠራውን ለማየት ዓይናችንን ያዘጋጃል።'},
 {n:'አጋር',c:'እናት',b:'ዘፍጥረት 16፣ 21',i:'hagar.jpg',f:'በምድረ በዳ እግዚአብሔር እንዳያት የተረዳች ሴት ናት።',s:'አጋር የሣራ ግብፃዊት አገልጋይ ነበረች። ችግር ሲገጥማት ወደ ምድረ በዳ ሸሸች። የእግዚአብሔር መልአክ በዚያ አገኛትና ስለ ልጇ ተስፋ ሰጣት። በሌላ ጊዜም እርሷና እስማኤል በምድረ በዳ ሲቸገሩ እግዚአብሔር ድምፃቸውን ሰማ።',v:'“…የሚያየኝን በውኑ እዚህ ደግሞ አየሁትን? ብላለችና።”',r:'ዘፍጥረት 16:13',l:'የተረሳን ቢመስለንም እግዚአብሔር ያየናል፣ ይሰማናልም።'},
 {n:'ራሔል',c:'እናት',b:'ዘፍጥረት 29–35',i:'rachel.jpg',f:'ያዕቆብ የወደዳት ሚስትና የዮሴፍና የብንያም እናት ነበረች።',s:'ያዕቆብ ራሔልን በውኃ ጉድጓድ አጠገብ አገኛት። እርሷን ለማግባት ረጅም ዓመታት አገለገለ። ራሔል ልጅ ለማግኘት ረጅም ጊዜ ጠበቀች፣ ከዚያም ዮሴፍን ወለደች። ብንያምን ስትወልድ ሕይወቷ አለፈ።',v:'“እግዚአብሔርም ራሔልን አሰበ፥ እግዚአብሔርም ተለመናት፥ ማኅፀንዋንም ከፈተላት፤”',r:'ዘፍጥረት 30:22',l:'እግዚአብሔር በረጅም መጠበቅና በውስብስብ ቤተሰብ ታሪክ ውስጥም የሰውን ልብ ያውቃል።'},
 {n:'ልያ',c:'እናት',b:'ዘፍጥረት 29–35',i:'leah.jpg',f:'የያዕቆብ ሚስትና የእስራኤል ነገዶች የስድስቱ እናት ነበረች።',s:'ልያ የያዕቆብ የመጀመሪያ ሚስት ነበረች። ከእህቷ ራሔል ጋር በማወዳደር ያልተወደደች መስሎ ተሰማት። እግዚአብሔር ሥቃይዋን አይቶ ልጆችን ሰጣት። በይሁዳ መወለድ ጊዜ “አሁን እግዚአብሔርን አመሰግናለሁ” አለች።',v:'“…በዚህም ጊዜ እግዚአብሔርን አመሰግናለሁ አለች፤ ስለዚህም ስሙን ይሁዳ ብላ ጠራችው።”',r:'ዘፍጥረት 29:35',l:'የሰው አድናቆት ሲጎድል እንኳ እግዚአብሔር ያየናል፣ ዋጋችንንም ያውቃል።'},
 {n:'ትዕማር',c:'የይሁዳ ቤት ሴት',b:'ዘፍጥረት 38',i:'tamar.jpg',f:'በግፍ ቢያዙአትም መብቷን ጠብቃ በመሲሑ የዘር ሐረግ ውስጥ ገባች።',s:'ትዕማር በይሁዳ ቤተሰብ ውስጥ ምራት ነበረች። ባሏ ከሞተ በኋላ ሊጠበቅላት የነበረው መብት ተነፈጋት። በድፍረት ራሷን ተከላክላ እውነቱን አሳየች። ይሁዳም “ከእኔ ይልቅ ጻድቅ ናት” ብሎ አመነ።',v:'“ይሁዳም አወቀ። ከእኔ ይልቅ እርስዋ እውነተኛ ሆነች፤ ልጄን ሴሎምን አልሰጠኋትምና አለ።”',r:'ዘፍጥረት 38:26',l:'እግዚአብሔር በተሰበሩ ሁኔታዎች ውስጥም ፍትሕን ሊያበቅል ይችላል።'},
 {n:'ቤርሳቤህ',c:'እናትና ንግሥት',b:'2 ሳሙኤል 11–12፣ 1 ነገሥት 1–2',i:'bathsheba.jpg',f:'ከታላቅ ሐዘን በኋላ የንጉሥ ሰሎሞን እናትና ንግሥት እናት ሆነች።',s:'ቤርሳቤህ የኦርዮ ሚስት ነበረች። የዳዊት ኃጢአት በእርሷ ሕይወት ላይ ታላቅ ሐዘን አመጣ። በኋላ ሰሎሞንን ወለደች። ሰሎሞን ንጉሥ እንዲሆን በጥበብ ተናገረች፣ እርሱም ንግሥት እናት አድርጎ አከበራት።',v:'“…ለንጉሡም እናት ወንበር አስመጣላት፥ በቀኙም ተቀመጠች።”',r:'1 ነገሥት 2:19',l:'ሐዘን የታሪካችን መጨረሻ አይደለም፤ እግዚአብሔር አዲስ ክብርና ተስፋ ሊሰጥ ይችላል።'},
 {n:'ዮካብድ',c:'ደፋር እናት',b:'ዘፀአት 2፣ 6',i:'jochebed.jpg',f:'ሕፃኑን ሙሴን ከፈርዖን ትእዛዝ ለመጠበቅ በእምነት ደበቀችው።',s:'ዮካብድ የሙሴ፣ የአሮንና የማርያም እናት ነበረች። ፈርዖን ዕብራውያን ወንድ ሕፃናት እንዲገደሉ ባዘዘ ጊዜ ሙሴን ሦስት ወር ደበቀችው። ከዚያም በቅርጫት አስቀምጣ በወንዙ ዳር ተወችው። በእግዚአብሔር አሰራር እርሷው ልጇን እንድታጠባ ተመረጠች።',v:'“ሙሴ ከተወለደ በኋላ ወላጆቹ ያማረ ሕፃን መሆኑን አይተው በእምነት ሦስት ወር ሸሸጉት የንጉሥንም አዋጅ አልፈሩም።”',r:'ዕብራውያን 11:23',l:'የወላጅ እምነትና ድፍረት ትውልድን ሊቀይር ይችላል።'},
 {n:'ሲፓራ',c:'የሙሴ ሚስት',b:'ዘፀአት 2፣ 4',i:'zipporah.jpg',f:'ሙሴ ከግብፅ ሸሽቶ በምድያም ሲኖር ከእርሱ ጋር ቤተሰብ መሠረተች።',s:'ሲፓራ የምድያሙ ካህን ዮቶር ልጅ ነበረች። ሙሴ እረኞችን ከጉድጓድ አጠገብ ከረዳ በኋላ ሲፓራን አገባ። ጌርሳምንና አልዓዛርን ወለደች። በሙሴ የምድረ በዳ ዘመን የቤተሰቡ አካል ሆና ነበር።',v:'“ሙሴም ከዚያ ሰው ጋር ሊቀመጥ ወደደ፤ ልጁንም ሲፓራን ለሙሴ ሚስት ትሆንው ዘንድ ሰጠው።”',r:'ዘፀአት 2:21',l:'እግዚአብሔር በስደትና በመጠበቅ ዘመን ውስጥም ቤተሰብና መጠጊያ ያዘጋጃል።'},
 {n:'ሎይድ',c:'አያት',b:'2 ጢሞቴዎስ 1',i:'lois.jpg',f:'በጢሞቴዎስ ውስጥ የኖረውን ያልተመሰለ እምነት በቤተሰቡ ውስጥ አሳደገች።',s:'ሎይድ የጢሞቴዎስ አያት ነበረች። ጳውሎስ በእርሷ ውስጥ የነበረውን ያልተመሰለ እምነት አስታወሰ። ይህ እምነት በልጇ ኤውንቄና በልጅ ልጇ ጢሞቴዎስ ውስጥ ቀጠለ። በዚህም የቤተሰብ መንፈሳዊ ተጽዕኖ ታይቷል።',v:'“…ይህም እምነት ቀድሞ በአያትህ በሎይድ በእናትህም በኤውንቄ ነበረባቸው፥ …”',r:'2 ጢሞቴዎስ 1:5',l:'በቅንነት የሚኖር እምነት ለቀጣዩ ትውልድ ውድ ርስት ይሆናል።'},
 {n:'ጣቢታ',c:'ደቀ መዝሙር',b:'ሐዋርያት ሥራ 9',i:'dorcas.jpg',f:'በመልካም ሥራና ለድሆች በምታደርገው ርዳታ የታወቀች ደቀ መዝሙር ነበረች።',s:'ጣቢታ፣ በግሪክ ዶርቃ የተባለችው፣ በኢዮጴ ትኖር ነበር። ሁልጊዜ መልካም ሥራ ታደርግና ድሆችን ትረዳ ነበር። ስትሞት መበለቶች የሠራችላቸውን ልብሶች እያሳዩ አለቀሱ። ጴጥሮስ ጸለየ፣ እግዚአብሔርም ከሞት አስነሣት።',v:'“በኢዮጴም ጣቢታ የሚሉአት አንዲት ደቀ መዝሙር ነበረች፥ ትርጓሜውም ዶርቃ ማለት ነው፤ እርስዋም መልካም ነገር የሞላባት ምጽዋትም የምታደርግ ነበረች።”',r:'ሐዋርያት ሥራ 9:36',l:'በእጃችን የምናደርገው ተግባራዊ ፍቅር በሰዎች ሕይወት ዘላቂ ምልክት ይተዋል።'},
 {n:'ኢያዔል',c:'አስተናጋጅ',b:'መሳፍንት 4–5',i:'jael.jpg',f:'በእስራኤል የጦርነት ጊዜ የጠላቱን ሠራዊት አለቃ ሲሣራን በመግደል ድልን አስገኘች።',s:'ሲሣራ ከጦርነቱ ሸሽቶ ወደ ኢያዔል ድንኳን ገባ። ኢያዔልም ወተት ሰጥታ ሸፈነችው። እርሱ ተኝቶ ሲደክም የድንኳኑን ችካል በጭንቅላቱ መትታ ገደለችው። በመዝሙረ ዲቦራም “ከሴቶች ትባረክ” ተባለች።',v:'የኬቤር ሚስት ኢያዔልም የድንኳኑን ችካል ወስዳ መዶሻንም በእጇ ይዛ በዝግታ ወደ እርሱ መጣች፥ እርሱም ተኝቶ ደክሞ ነበርና ችካሉን በጭንቅላቱ መትታ ወደ መሬት አሳለፈችው፤ እርሱም በእግሮቿ መካከል ወድቆ ሞተ።',r:'መሳፍንት 4:21',l:'እግዚአብሔር በቤታችንና በተራ እድሎች ውስጥም ታላቅ ድል ሊያደርግ ይችላል።'},
 {n:'ሕልዳና',c:'ነቢይት',b:'2 ነገሥት 22',i:'huldah.jpg',f:'ንጉሥ ኢዮስያስ የተገኘውን የሕግ መጽሐፍ ትርጉም ከእግዚአብሔር ቃል እንድትነግራቸው ወደ እርስዋ ላከ።',s:'የሕጉ መጽሐፍ በቤተ መቅደስ በተገኘ ጊዜ ንጉሡ መልእክተኞችን ወደ ነቢይቱ ሕልዳና ላከ። ሕልዳናም ሳትፈራ የእግዚአብሔርን የፍርድ ቃል ነገረቻቸው፤ ለኢዮስያስ ግን ስለ ትሕትናው የምሕረት ቃል ተናገረች። ቃሏም የእስራኤልን ሃይማኖታዊ ማሻሻያ መራ።',v:'እንዲህ ይላል እግዚአብሔር። እነሆ፥ በዚህ ስፍራና በእርሱም ላይ በሚኖሩት ላይ ክፉ ነገርን አመጣለሁ፥ የይሁዳ ንጉሥ ያነበበውን የመጽሐፉን ቃል ሁሉ እፈጽማለሁ።',r:'2 ነገሥት 22:16',l:'የእግዚአብሔርን እውነት በትክክልና በድፍረት መናገር ሰዎችን ወደ ንስሓ ይመራል።'},
 {n:'ዓክሳ',c:'የካሌብ ልጅ',b:'መሳፍንት 1',i:'achsah.jpg',f:'ከአባቷ ካሌብ የውኃ ምንጮችን በድፍረት በመጠየቅ በረከትን አገኘች።',s:'ካሌብ ሴት ልጁን ዓክሳን ከተማይቱን ለሚይዝ ለኦትኒኤል ሚስት አድርጎ ሰጣት። ዓክሳም ለባሏ የተሰጣትን ደረቅ ምድር ስታይ ከአባቷ የውኃ ምንጮችንም ጠይቃ ምድርዋን አረፈች።',v:'እርስዋም። በረከት ስጠኝ፤ ወደ ደቡብ ምድር ሰጥተኸኛልና የውኃ ምንጮችንም ስጠኝ አለችው። ካሌብም የላይኞቹን ምንጮችና የታችኞቹን ምንጮች ሰጣት።',r:'መሳፍንት 1:15',l:'በእምነትና በድፍረት የምንጠይቀው ነገር ለሕይወታችን ምንጭ ሊሆን ይችላል።'},
 {n:'አስናት',c:'የዮሴፍ ሚስት',b:'ዘፍጥረት 41',i:'asenath.jpg',f:'የግብፅ ካህን ሴት ልጅ፤ የዮሴፍ ሚስትና የኤፍሬምና የምናሴ እናት ሆነች።',s:'ፈርዖን ዮሴፍን ከፍ ባደረገ ጊዜ የአን ከተማ የፖቲፈራ ካህን ሴት ልጅ አስናትን ለሚስት ሰጠው። አስናትም ምናሴንና ኤፍሬምን ወለደች፤ ልጆቿም የእስራኤል ነገዶች መስራቾች ሆኑ።',v:'የራብ ዓመታትም ሳይመጡ ለዮሴፍ ሁለት ልጆች ተወለዱ፥ የአን ካህን የፖቲፈራ ሴት ልጅ አስናት ወለደችለት።',r:'ዘፍጥረት 41:50',l:'እግዚአብሔር በተለያዩ ባህሎች መካከልም ቤተሰብን ሰርቶ ትውልድን ይቀይራል።'},
 {n:'አስጢን',c:'ንግሥት',b:'መጽሐፈ አስቴር 1',i:'vashti.jpg',f:'የንጉሥ ትእዛዝ ክብሯን ሲነካ እምቢ በማለት ክብሯን ጠበቀች።',s:'ንጉሡ በግብዣው ጊዜ ንግሥቲቱ አስጢን ውበቷን እንድታሳይ ጠራት። አስጢን ግን ክብሯን ጠብቃ እምቢ አለች። በዚህም ምክንያት ዙፋኗን አጣች፤ ነገር ግን የራሷን ክብር ጠብቃለች።',v:'ንግሥቲቱ አስጢንም ንጉሡ በጃንደረቦቹ እጅ የላከውን ቃል እምቢ ብላ አልመጣችም፤ ንጉሡም እጅግ ተቆጣ፥ ቍጣውም በእርሱ ውስጥ ነደደ።',r:'አስቴር 1:12',l:'ክብራችንን የሚነኩ ትእዛዛትን እንኳ እምቢ ማለት ዋጋ ሊያስከፍል ይችላል፤ ክብር ግን ይጠበቃል።'},
 {n:'ዖርፋ',c:'ምራት',b:'መጽሐፈ ሩት',i:'orpah.jpg',f:'አማቷን ኑኃሚንን በልቅሶ ሳማ ወደ ሕዝቧና ወደ ቤቷ ተመለሰች።',s:'ዖርፋና ሩት የኑኃሚን ምራቶች ነበሩ። ባሎቻቸው ከሞቱ በኋላ ኑኃሚን ወደ ቤተልሔም ስትመለስ ዖርፋ በልቅሶ ሳምታ ወደ እናቷ ቤት ተመለሰች፤ ሩት ግን ተጣብቃ ቀረች። ሁለቱም ምርጫዎች የቤተሰብ ፍቅር ታሪካቸውን ይገልጻሉ።',v:'ድምፃቸውንም አነሡና አለቀሱ፤ ዖርፋም አማቷን ሳመች፥ ሩት ግን ከእርስዋ ጋር ተጣበቀች።',r:'ሩት 1:14',l:'የፍቅር ሰዎች አንዳንድ ጊዜ በተለያዩ መንገዶች ይለያያሉ፤ በሰላም መልቀቅም ፍቅር ነው።'},
 {n:'ሜልኮል',c:'የሳኦል ልጅ',b:'1 ሳሙኤል 19',i:'michal.jpg',f:'ዳዊትን ከሞት በመደበቅና በመስኮት በማውረድ ሕይወቱን አዳነች።',s:'ሜልኮል የሳኦል ሴት ልጅና የዳዊት ሚስት ነበረች። ሳኦል ዳዊትን ሊገድል በወሰነ ጊዜ ሜልኮል አስጠንቅቃ በመስኮት አወረደችው፤ ሐውልቱንም በአልጋው ላይ በማኖር ጊዜ ገዝታለት እርሱ ሸሽቶ ዳነ።',v:'ሜልኮልም ዳዊትን በመስኮቱ አወረደችው፤ እርሱም ሄደ፥ ሸሸ፥ ዳነም።',r:'1 ሳሙኤል 19:12',l:'ፍቅር አንዳንድ ጊዜ ውድ ሰውን ከአደጋ ለመታደግ ፈጣንና ደፋር ውሳኔ ይፈልጋል።'},
 {n:'ዮሳቤት',c:'ንግሥታዊት',b:'2 ነገሥት 11',i:'jehosheba.jpg',f:'አታሊያ የንገሥታቱን ዘር ስታጠፋ ሕፃኑን ዮአሽን ሰርቃ ደብቃ አዳነችው።',s:'አታሊያ የንጉሥ ዘርን ሁሉ ለማጥፋት በነሣች ጊዜ ዮሳቤት ሕፃኑን ዮአሽንና ሞግዚቱን ሰርቃ በቤተ መቅደስ ውስጥ ስድስት ዓመት ደበቀቻቸው። በዚህም የዳዊት ዘር ቀጠለ።',v:'የንጉሥ ዮራም ሴት ልጅ የአኃዝያስ እኅት ዮሳቤት ግን ከሚገደሉት ከንገሥታት ልጆች መካከል የንጉሡን ልጅ ዮአሽን ሰርቃ ወሰደችው፥ ሞግዚቱንም ከእርሱ ጋር በመኝታ ቤት ውስጥ ደበቀቻቸው።',r:'2 ነገሥት 11:2',l:'አንዲት ሴት በድብቅ የምትሠራው ታማኝነት ሙሉ ትውልድን ሊያድን ይችላል።'},
 {n:'ሪጽፋ',c:'እናት',b:'2 ሳሙኤል 21',i:'rizpah.jpg',f:'የልጆቿን አስክሬን ወፎችና አራዊት እንዳይነኩ ወራት ሙሉ ጠበቀቻቸው።',s:'ሪጽፋ የሳኦል ክብር ነበረች፤ ሁለት ወንዶች ልጆቿ በገባዖናውያን እጅ በተሰቀሉ ጊዜ ማቅ ለብሳ በአለት ላይ ተቀምጣ ሬሳዎቻቸውን ቀንና ሌሊት ጠበቀች። ጽናቷ ንጉሡን ዳዊትን አንቀሳቅሶ አስክሬኖቹ ክብር አግኝተው ተቀበሩ።',v:'የአያ ሴት ልጅ ሪጽፋም ማቅ ወስዳ በአለት ላይ ለራሷ አነጠፈች፥ ከምርት መጀመሪያ ጀምራ እስከ ሰማይ ውኃ እስኪዘንብባቸው ድረስ፤ በቀንም የሰማይ ወፎች፥ በሌሊትም የምድር አራዊት በእነርሱ ላይ እንዳያርፉ አልፈቀደችም።',r:'2 ሳሙኤል 21:10',l:'የእናት ፍቅርና ጽናት የሙታንንም ክብር ይጠብቃል፤ ዝምታውም ለፍትሕ ድምፅ ይሆናል።'},
 {n:'ሲፓራና ፉሐ',c:'አዋላጆች',b:'ዘፀአት 1',i:'midwives.jpg',f:'እግዚአብሔርን በመፍራት የፈርዖንን የግድያ ትእዛዝ እምቢ ብለው የዕብራውያንን ሕፃናት አዳኑ።',s:'ፈርዖን የዕብራውያንን ወንድ ሕፃናት እንዲገድሉ አዋላጆቹን ሲፓራንና ፉሐን አዘዛቸው። እነርሱ ግን እግዚአብሔርን ፈርተው ትእዛዙን አልፈጸሙም፤ ሕፃናቱንም በሕይወት አኖሩ። እግዚአብሔርም ቤት ሰጣቸው።',v:'አዋላጆቹ ግን እግዚአብሔርን ፈርተው የግብፅ ንጉሥ እንዳዘዛቸው አልፈጸሙም፥ ወንድ ሕፃናቱንም በሕይወት አኖሩአቸው።',r:'ዘፀአት 1:17',l:'ሥልጣን ክፉን ሲያዝ እግዚአብሔርን መፍራት እምቢ ማለት ነው።'},
 {n:'የሰራፕታ መበለት',c:'መበለት',b:'1 ነገሥት 17',i:'zarephath-widow.jpg',f:'በራብ ጊዜ በመጨረሻ እፍኝ ዱቄቷ ኤልያስን በመመገብ ተአምራዊ ምንጭን አገኘች።',s:'በራቡ ዘመን መበለቲቱ ትንሽ ዱቄትና ዘይት ብቻ ነበራት። ኤልያስ በመጣ ጊዜ በመጀመሪያ ለእርሱ እንጀራ ካበሰለች በኋላ ዱቄቷና ዘይቷ እስከ ዝናብ ቀን ድረስ አላለቀም። በኋላም የሞተ ልጇ በኤልያስ ጸሎት ተነሣ።',v:'የእስራኤል አምላክ እግዚአብሔር እንዲህ ይላልና፤ እግዚአብሔር በምድር ላይ ዝናብ እስኪሰጥበት ቀን ድረስ የዱቄቱ ቀፎ አይጎድልም፥ የዘይቱም ብልቃጥ አይያንስም።',r:'1 ነገሥት 17:14',l:'ትንሽ ያለንን በእምነት ስናካፍል እግዚአብሔር ያበዛዋል።'},
 {n:'የሹኔም ሴት',c:'አስተናጋጅ',b:'2 ነገሥት 4',i:'shunammite.jpg',f:'ለኤልሳዕ በቤቷ ክፍል አዘጋጅታ በማስተናገድ የልጅ ተስፋን አገኘች።',s:'በሹኔም አንዲት ባለጠጋ ሴት ኤልሳዕን ሁልጊዜ ታስተናግድ ነበር፤ ከባሏ ጋርም ምንጣፍ ያለበት ትንሽ ክፍል ሠሩለት። ኤልሳዕም ልጅ እንደምትወልድ ነገራት፤ ቃሉም ተፈጽሞ ወንድ ልጅ ወለደች።',v:'እርሱም። በሚመጣው ዓመት እንደዚህ ወራት ልጅ ታቅፋለሽ አለ፤ እርስዋም። አይሆንም፥ ጌታዬ ሆይ፥ የእግዚአብሔር ሰው ሆይ፥ ባሪያህን አትዋሽብኝ አለች።',r:'2 ነገሥት 4:16',l:'በልግስና የተከፈተ ቤት ለእግዚአብሔር ተአምራት መቀመጫ ይሆናል።'},
 {n:'የአቤል ጥበበኛ ሴት',c:'ጥበበኛ ሴት',b:'2 ሳሙኤል 20',i:'wise-woman-abel.jpg',f:'ከተማዋን ከጥፋት ለማዳን ከዮአብ ጋር በጥበብ ተነጋግራ ሰላም አስገኘች።',s:'ብልጣዩ ሼባ በአቤል ከተማ ውስጥ ተከብቦ ሳለ ዮአብ ከተማዋን ሊያጠፋ ጀመረ። ጥበበኛይቱ ሴት ከቅጥሩ ላይ ዮአብን ጠርታ በጥበብ ተነጋገረችው፤ ከተማዋም ሼባን ሰጥታ ዮአብ ከከተማዋ ራቀ። በቃሏም ከተማይቱ በሙሉ ዳነች።',v:'እኔ በእስራኤል ውስጥ ከሰላም ወዳጆችና ከታማኝ ሰዎች አንዲቱ ነኝ፤ አንተም በእስራኤል ውስጥ ከተማይቱንና እናትን ለማጥፋት ትፈልጋለህ፤ የእግዚአብሔርን ርስት ለምን ትውጣለህ?',r:'2 ሳሙኤል 20:19',l:'አንዲት ሴት በጥበብ የምትናገረው ቃል መላ ከተማን ሊያድን ይችላል።'},
 {n:'የሰሎፍሐድ ሴት ልጆች',c:'እኅቶች',b:'ዘኍልቍ 27',i:'zelophehad-daughters.jpg',f:'አባታቸው ወንድ ልጅ ስለሌለው የርስት መብታቸውን በድፍረት ጠይቀው ሕግ አስገኙ።',s:'ማሕላ፥ ኖዓ፥ ኃግላ፥ ሚልካና ትርሳ የአባታቸው ርስት ስለ ወንድ ልጅ አለመኖር እንዲሰጣቸው በሙሴና በጉባኤው ፊት በድፍረት ጠየቁ። እግዚአብሔርም ጥያቄያቸውን ትክክል ብሎ ሴቶች ርስት እንዲወርሱ ሕግ አወጣ።',v:'የሰሎፍሐድ ሴት ልጆች በትክክል ተናግረዋል፤ ከአባታቸው ወንድሞች መካከል ርስት ትሰጣቸዋለህ፥ የአባታቸውንም ርስት ለእነርሱ ታሻግረዋለህ።',r:'ዘኍልቍ 27:7',l:'ፍትሕን በድፍረትና በክብር መጠየቅ ለትውልዶች ሕግ ሊሆን ይችላል።'},
 {n:'ሱላማጢስ',c:'ሙሽራ',b:'መኃልየ መኃልይ',i:'shulammite.jpg',f:'በሰሎሞን የፍቅር መኃልይ ውስጥ የፍቅርን ኃይል የተዘመረላት ሙሽራ ናት።',s:'ሱላማጢስ በመኃልየ መኃልይ ውስጥ የፍቅርን ጥልቅና ጽኑዕነት ትገልጻለች። ፍቅር እንደ ሞት ኃያል መሆኑንና ብዙ ውኃ ሊያጠፋው እንደማይችል ዘምራለች።',v:'ብዙ ውኃ ፍቅርን ሊያጠፋው አይችልም፥ ጐርፎችም ሊያሰጥሙት አይችሉም፤ አንድ ሰው ስለ ፍቅር የቤቱን ሀብት ሁሉ ቢሰጥ ፈጽሞ ይነቀፍል ነበር።',r:'መኃልየ መኃልይ 8:7',l:'እውነተኛ ፍቅር በፈተናና በጎርፍ አይጠፋም፤ ጽኑዕ ነው።'},
 {n:'ማርያም (የአልዓዛር እኅት)',c:'ደቀ መዝሙር',b:'ዮሐንስ 12',i:'mary-bethany.jpg',f:'ውድ ሽቱን በኢየሱስ እግር ላይ በማፍሰስ ፍቅሯንና ክብሯን ገለጠች።',s:'ማርያም የማርታና የአልዓዛር እኅት ነበረች። ኢየሱስ በቤተንያ ባለ ጊዜ የእጅግ ውድ የናርዶስ ሽቱ አንድ ሩጫ ወስዳ እግሮቹን ቀብታ በጠጕሯ አበሰቻቸው። ኢየሱስም ሥራዋን ለቀብሩ ቀን እንደ ተጠበቀ አወደሰ።',v:'ማርያምም የእጅግ ውድ የሆነ የንጹሕ ናርዶስ ሽቱ አንድ ሩጫ ወስዳ የኢየሱስን እግሮች ቀብታ በጠጕሯም አበሰቻቸው፤ ቤቱም ከሽቱ መዓዛ ተሞላ።',r:'ዮሐንስ 12:3',l:'ለኢየሱስ የምንሰጠው ውድ ስጦታ ብክነት አይደለም፤ የፍቅር መግለጫ ነው።'},
 {n:'ዮሐና',c:'ደቀ መዝሙር',b:'ሉቃስ 24',i:'joanna.jpg',f:'የትንሣኤውን ዜና መጀመሪያ ካወሩትና ለሐዋርያት ካደረሱት ሴቶች አንዷ ነበረች።',s:'ዮሐና የሄሮድስ የቤት አስተዳዳሪ የኩዛ ሚስት ነበረች፤ ከንብረቷ ኢየሱስን ታገለግል ነበር። ከትንሣኤው በኋላ ወደ መቃብሩ ቀድማ ሄዳ የመልአካቱን ቃል ሰምታ ዜናውን ለሐዋርያት አደረሰች።',v:'እነርሱም መግደላዊት ማርያም፥ ዮሐና፥ የያዕቆብ እናት ማርያም፥ ከእነርሱ ጋር የነበሩት ሌሎቹም ሴቶች ነበሩ፤ እነዚህንም ለሐዋርያት ነገሩ።',r:'ሉቃስ 24:10',l:'የትንሣኤ ዜና መጀመሪያ የተሰጠው ለታማኝ ሴቶች ነበር።'},
 {n:'ሶስና',c:'ደቀ መዝሙር',b:'ሉቃስ 8',i:'susanna.jpg',f:'ከንብረቷ ኢየሱስንና ደቀ መዛሙርቱን ካገለገሉት ሴቶች አንዷ ነበረች።',s:'ሶስና ከብዙ ሴቶች ጋር ኢየሱስን ትከተል ነበር። ከንብረታቸውም ወንጌል ለሚሰብከው ቡድን ድጋፍ ይሰጡ ነበር። ስምዋ በሉቃስ ወንጌል ከዮሐና ጋር ተዘግቧል።',v:'የሄሮድስም የቤት አስተዳዳሪ የኩዛ ሚስት ዮሐና፥ ሶስናም፥ ሌሎችም ብዙዎች፥ እነርሱም ካላቸው ንብረት ያገለግሉት ነበር።',r:'ሉቃስ 8:3',l:'የወንጌል ሥራ በልግስና በሚደግፉ ታማኝ ሰዎች ይቀጥላል።'},
 {n:'ሰሎሜ',c:'ደቀ መዝሙር',b:'ማርቆስ 15',i:'salome.jpg',f:'እስከ መስቀሉ ድረስ ኢየሱስን ተከትላ ከሩቅም የተመለከቱት ሴቶች አንዷ ነበረች።',s:'ሰሎሜ ኢየሱስ በገሊላ ሳለ ከሚከተሉት ሴቶች አንዷ ነበረች። በመስቀሉ አጠገብ ከሌሎቹ ሴቶች ጋር ቆማ ተመለከተች፤ ከትንሣኤው በኋላም ሽቱ ይዛ ወደ መቃብሩ የመጡት መካከል ነበረች።',v:'ከሩቅም የሚያዩ ሴቶች ነበሩ፥ ከእነርሱም መግደላዊት ማርያም፥ የትናንሹ ያዕቆብና የዮሳ እናት ማርያም፥ ሰሎሜም ነበሩ።',r:'ማርቆስ 15:40',l:'በጨለማ ሰዓታትም በአጠገብ መቆም ታማኝነት ነው።'},
 {n:'ማርያም (የያዕቆብ እናት)',c:'ደቀ መዝሙር',b:'ማርቆስ 16',i:'mary-james.jpg',f:'የትንሣኤውን ጠዋት ሽቱ ይዛ ወደ መቃብሩ ከመጡት ሴቶች አንዷ ነበረች።',s:'ማርያም የያዕቆብና የዮሳ እናት ነበረች። ኢየሱስ በተቀበረ ጊዜ ስፍራውን ተመለከተች፤ ሰንበትም ካለፈ በኋላ ከሌሎቹ ሴቶች ጋር ሽቱ ገዝታ ጠዋት ወደ መቃብሩ ሄዳ ባዶ መቃብሩንና የመልአኩን ዜና አገኘች።',v:'ሰንበትም ካለፈ በኋላ መግደላዊት ማርያም የያዕቆብ እናት ማርያም ሰሎሜም ሊቀቡት ሽቱ ገዙ።',r:'ማርቆስ 16:1',l:'በሐዘን ውስጥም ፍቅር ወደ መቃብሩ ይመራል፤ እዚያም የትንሣኤ ዜና ይገኛል።'},
 {n:'የከነዓናዊት ሴት',c:'አማኝ',b:'ማቴዎስ 15',i:'canaanite-woman.jpg',f:'ለሴት ልጇ ፈውስን በጽናትና በትሕትና በመከራከር “እምነትሽ ታላቅ ነው” የሚል ቃልን አገኘች።',s:'የከነዓናዊት ሴት ልጅ በአጋንንት ትሰቃይ ነበር። ኢየሱስ መጀመሪያ ዝም ቢልም እርሷ አልተሸሸችም፤ በትሕትና መከራክራ “ከጌቶቻቸው ጠረጴዛ የሚወድቀውን ፍርፋሪ ውሾችም ይበላሉ” አለች። ኢየሱስም እምነቷን አወድሶ ልጇን ፈወሰ።',v:'በዚያን ጊዜ ኢየሱስ መልሶ። አንቺ ሴት ሆይ፥ እምነትሽ ታላቅ ነው፤ እንደ ወደድሽ ይሁንልሽ አላት፤ ሴት ልጇም ከዚያች ሰዓት ጀምራ ዳነች።',r:'ማቴዎስ 15:28',l:'ጽናት ያለውና ትሕትና ያለበት እምነት እንቅፋትን ያልፋል።'},
 {n:'ደም የሚፈሳት ሴት',c:'አማኝ',b:'ማርቆስ 5',i:'bleeding-woman.jpg',f:'አሥራ ሁለት ዓመት ደም እየፈሳት ኢየሱስን ከኋላ ነክታ ወዲያውኑ ተፈወሰች።',s:'ሴቲቱ ለአሥራ ሁለት ዓመታት በደም ፈሳሽ ትሰቃይ ነበር፥ ሀብቷንም ሁሉ ለባለሞያዎች አልቃ ነበር። “ልብሱን ብቻ ብነካ እድናለሁ” ብላ ከኋላ መጥታ ነከችው፥ ወዲያውኑም የደምዋ ምንጭ ደረቀ። ኢየሱስም “እምነትሽ አዳነሽ” አላት።',v:'እርሱም። ልጄ ሆይ፥ እምነትሽ አዳነሽ፤ በሰላም ሂጂ፥ ከሥቃይሽም ተፈውሺ አላት።',r:'ማርቆስ 5:34',l:'ከሕዝቡ መካከል በእምነት መነካካት ወደ ፈውስ ይመራል።'},
 {n:'የናይን መበለት',c:'መበለት',b:'ሉቃስ 7',i:'nain-widow.jpg',f:'ኢየሱስ ብቸኛ ልጇን ከሞት አስነሥቶ የሰጣት መበለት ናት።',s:'የናይን መበለት ብቸኛ ወንድ ልጇ ሞቶ ይወሰድ ሳለ ኢየሱስ አገኛት። ጌታም አዝኖላት “አታልቅሺ” አላት፤ ሳንዱቁን ነክቶ ወጣቱን አስነሣውና ለእናቱ ሰጣት።',v:'ጌታም ባያት ጊዜ አዘነላት። አታልቅሺም አላት።',r:'ሉቃስ 7:13',l:'ኢየሱስ የሐዘናችንን ልቅሶ ያያል፥ በአጠገባችንም ይቆማል።'},
 {n:'የታገበተች ሴት',c:'የተፈወሰች',b:'ሉቃስ 13',i:'bent-woman.jpg',f:'አሥራ ስምንት ዓመት ታግባ የነበረች ኢየሱስ ቀጥ አድርጓት እግዚአብሔርን አከበረች።',s:'ሴቲቱ በድካም መንፈስ ምክንያት ለአሥራ ስምንት ዓመታት ታግባ ቀጥ ማለት አትችልም ነበር። ኢየሱስ በምኩራብ ባያት ጊዜ ጠርቶ “ከድካምሽ ተፈታሽ” ብሎ ፈወሳት፤ እርስዋም ቀጥ ብላ እግዚአብሔርን አከበረች።',v:'ኢየሱስም ባያት ጊዜ ጠርቶ። ሴት ሆይ፥ ከድካምሽ ተፈታሻለሽ አላት።',r:'ሉቃስ 13:12',l:'ኢየሱስ ለረጅም ጊዜ የታገበውን ሕይወት ቀጥ ያደርጋል።'},
 {n:'ኤውንቄ',c:'እናት',b:'ሐዋርያት ሥራ 16',i:'eunice.jpg',f:'የጢሞቴዎስ እናት፤ እምነቷ በልጇ ውስጥ የቀጠለች አይሁዳዊት አማኝ ነበረች።',s:'ኤውንቄ በልስጥራ የምትኖር አይሁዳዊት አማኝ ነበረች፤ ባሏ ግን ግሪካዊ ነበር። በልጇ ጢሞቴዎስ ውስጥ ያልተመሰለ እምነትን አሳድጋለች፥ ጳውሎስም ይህን እምነት ከአያቱ ሎይድ ጀምሮ እንዳለ አስታወሰ።',v:'ወደ ደርቤና ወደ ልስጥራም መጣ፤ እነሆም በዚያ ጢሞቴዎስ የሚባል አንድ ደቀ መዝሙር ነበረ፥ እርሱም ያመነች የአይሁድ ሴት ልጅ ነበረ፥ አባቱ ግን ግሪካዊ ነበረ።',r:'ሐዋርያት ሥራ 16:1',l:'የእናት እምነት በልጇ ሕይወት ውስጥ ዘር ሆኖ ያብባል።'},
 {n:'ሮዴ',c:'አገልጋይ',b:'ሐዋርያት ሥራ 12',i:'rhoda.jpg',f:'ጴጥሮስ ከእስር ቤት ሲወጣ ድምፁን አውቃ ከደስታ የተነሣ በሩን ሳትከፍት ሮጣ የነገረች አገልጋይ ናት።',s:'ሄሮድስ ጴጥሮስን አስሮ ሳለ ቤተ ክርስቲያን ትጸልይ ነበር። መልአክ ጴጥሮስን ነጻ ባወጣው ጊዜ ወደ ቤቱ መጣ፤ ሮዴ ድምፁን አወቀች፥ ከደስታም የተነሣ ሳትከፍት ሮጣ አወራች። በመጀመሪያ ባይታመንም ጴጥሮስ በእውነት በሩ ላይ ነበር።',v:'የጴጥሮስንም ድምፅ ባወቀች ጊዜ ከደስታ የተነሣ በሩን ሳትከፍት ወደ ውስጥ ሮጣ ጴጥሮስ በበሩ ፊት ቆሞአል ብላ አወራች።',r:'ሐዋርያት ሥራ 12:14',l:'የጸሎት ምላሽ አንዳንድ ጊዜ ከምንጠብቀው በላይ በፍጥነት ይመጣል።'},
 {n:'ንግሥት ቀንዳቄ',c:'የኢትዮጵያ ንግሥት',b:'ሐዋርያት ሥራ 8',i:'candace.jpg',f:'የኢትዮጵያ ንግሥት፤ የሀብቷ ሹም ጃንደረባዋ ሊሳለል ወደ ኢየሩሳሌም ሄዶ ሲመለስ ወንጌልን ተቀበለ።',s:'ንግሥት ቀንዳቄ የኢትዮጵያ ንግሥት ነበረች፤ የሀብቷ ሁሉ ሹም የነበረው ጃንደረባዋ ሊሳለል ወደ ኢየሩሳሌም ሄዶ ሲመለስ ፊልጶስ ወንጌልን ነግሮት ተጠምቆ በደስታ ሄደ። ወንጌልም በንግሥቲቱ ሠራዊት በኩል ወደ ኢትዮጵያ ገባ።',v:'ተነሥቶም ሄደ፤ እነሆም የኢትዮጵያ ንግሥት የቀንዳቄ ጃንደረባ የነበረ በሀብቷም ሁሉ ላይ የነበረ አንድ የኢትዮጵያ ሰው ሊሳለል ወደ ኢየሩሳሌም መጥቶ ነበር።',r:'ሐዋርያት ሥራ 8:27',l:'ወንጌል በኢትዮጵያ ቤተ መንግሥት ጀምሮ እስከ ዛሬ ድረስ ቀጥሎአል።'},
 {n:'ማርያም (የቅሎፋ ሚስት)',c:'ደቀ መዝሙር',b:'ዮሐንስ 19',i:'mary-clopas.jpg',f:'በኢየሱስ መስቀል አጠገብ ከሌሎቹ ሴቶች ጋር የቆመች ታማኝ ሴት ነበረች።',s:'ዮሐንስ በመስቀሉ አጠገብ ከቆሙት ሴቶች መካከል የቅሎፋ ሚስትን ማርያምን ይጠቅሳል። ሌሎች ብዙዎች በሸሹበት ጊዜ እርሷ ከኢየሱስ እናት ጋር በመስቀሉ ሥር ቆመች።',v:'በኢየሱስም መስቀል አጠገብ እናቱ የእናቱም እኅት የቅሎፋ ሚስት ማርያም መግደላዊትም ማርያም ቆመው ነበር።',r:'ዮሐንስ 19:25',l:'በጣም በከባድ ሰዓት በአጠገብ መቆም የፍቅር ምልክት ነው።'},
 {n:'የጲላጦስ ሚስት',c:'የገዥ ሚስት',b:'ማቴዎስ 27',i:'pilates-wife.jpg',f:'በሕልምዋ ተሰቃይታ ኢየሱስ ጻድቅ እንደ ሆነ ለባሏ መልእክት የላከች ሴት ናት።',s:'ጲላጦስ በፍርድ ወንበሩ ላይ ተቀምጦ ሳለ ሚስቱ መልእክት ላከችበት፦ ስለ ኢየሱስ በሕልም ብዙ ስለ ተሰቃየች ከዚያ ጻድቅ ሰው ጋር እንዳይገናኝ አስጠነቀቀችው። ድምፅዋ በፍርድ ቤቱ ውስጥ የእውነት ምስክር ሆነ።',v:'እርሱም በፍርድ ወንበሩ ላይ ተቀምጦ ሳለ ሚስቱ ወደ እርሱ ልካ። ከዚያ ከጻድቁ ሰው ጋር ምንም አትገናኝ፤ ዛሬ በሕልም ስለ እርሱ ብዙ ተሰቃይቻለሁና አለች።',r:'ማቴዎስ 27:19',l:'እግዚአብሔር በሕልምና በልብ ውስጥ እንኳ እውነትን ሊያስታውቅ ይችላል።'},
 {n:'የጴጥሮስ አማት',c:'የተፈወሰች',b:'ማርቆስ 1',i:'peters-mother-in-law.jpg',f:'ኢየሱስ ከንዳድ ፈውሶአት ወዲያውኑ ተነሥታ እንግዶችን ያገለገለች ሴት ናት።',s:'የጴጥሮስ አማት በንዳድ ታማ ተኝታ ነበር። ኢየሱስ ወደ ቤቱ ገብቶ እጇን ይዞ አስነሣት፥ ንዳዱም ወዲያውኑ ተወላት። እርስዋም ተነሥታ ኢየሱስንና እንግዶቹን አገለገለች።',v:'ቀርቦም እጇን ይዞ አስነሣት፤ ንዳዱም ወዲያውኑ ተወላት፥ እርስዋም ታገለግላቸው ነበር።',r:'ማርቆስ 1:31',l:'ፈውስ ወደ አገልግሎት ይመራል፤ የተቀበልነው ኃይል ለሌሎች ነው።'},
 {n:'ዓዳ',c:'የላሜሕ ሚስት',b:'ዘፍጥረት 4',i:'adah.jpg',f:'የላሜሕ የመጀመሪያ ሚስት፥ የያባልና የዩባል እናት ነበረች።',s:'ዓዳ የላሜሕ የመጀመሪያ ሚስት ነበረች። ያባልን የዘላኖች አባትንና ዩባልን የበገናና የመለከት አባትን ወለደች። ስምዋ በመጽሐፍ ቅዱስ ከተጠሩት የመጀመሪያ ሴቶች አንዲት ናት። ላሜሕም የበቀሉን ቃል ለእርሷና ለሴላ ነገራቸው ነበር።',v:'“ላሜሕም ለራሱ ሁለት ሚስቶችን አገባ፤ የአንዲቱ ስም ዓዳ፥ የሁለተኛይቱ ስም ሴላ ነበረ።”',r:'ዘፍጥረት 4:19',l:'ቤተሰብን ማቆምና ልጆችን ማሳደግ ከጥንት ጀምሮ የእግዚአብሔር ሥራ ነው።'},
 {n:'ሴላ',c:'የላሜሕ ሚስት',b:'ዘፍጥረት 4',i:'zillah.jpg',f:'የላሜሕ ሁለተኛ ሚስት፥ የቱባልቃይንና የናዕማ እናት ነበረች።',s:'ሴላ የላሜሕ ሁለተኛ ሚስት ነበረች። ቱባልቃይንን የናስና የብረት ሠራተኛንና እኅቱን ናዕማን ወለደች። ላሜሕ ስለ በቀሉ ለዓዳና ለሴላ ሲናገር እርሷም ከሚሰሙት አንዲት ነበረች።',v:'“ላሜሕም ለራሱ ሁለት ሚስቶችን አገባ፤ የአንዲቱ ስም ዓዳ፥ የሁለተኛይቱ ስም ሴላ ነበረ።”',r:'ዘፍጥረት 4:19',l:'እግዚአብሔር ለቤተሰብ የሚሰጠውን ችሎታ ለበጎ ሥራ እንድንጠቀምበት ይፈልጋል።'},
 {n:'ባላ',c:'ገረድ',b:'ዘፍጥረት 29–30',i:'bilhah.jpg',f:'የራሔል ገረድ፥ ለያዕቆብ ዳንንና ንፍታሌምን ወለደች።',s:'ባላ የራሔል ገረድ ነበረች። ራሔል ልጅ ሳይኖራት ባላዋን ለባልዋ ለያዕቆብ ሰጠችው። ባላም ዳንንና ንፍታሌምን ወለደች፤ ስሞቻቸውንም ራሔል አወጣችላቸው። ልጆቿ ከእስራኤል ነገዶች መካከል ተቆጠሩ።',v:'“ላባም ለልጁ ለራሔል ባርያይቱን ባላን ባርያ ትሆናት ዘንድ ሰጣት።”',r:'ዘፍጥረት 29:29',l:'እግዚአብሔር በዝቅተኛ ቦታ ያሉትንም በታላቅ ዕቅዱ ውስጥ ይጠቀምባቸዋል።'},
 {n:'ኬጡራ',c:'የአብርሃም ሚስት',b:'ዘፍጥረት 25',i:'keturah.jpg',f:'ከሣራ በኋላ የአብርሃም ሚስት ሆና ስድስት ወንዶች ወለደች።',s:'ሣራ ከሞተች በኋላ አብርሃም ኬጡራን አገባ። እርሷም ዝምራንን፥ ዮቅሳንን፥ ሜዳንን፥ ሚድያንን፥ ይስባቅንና ሹሐንን ወለደችለት። አብርሃም ለይስሐቅ ሁሉን ነገር ሰጥቶ ለኬጡራ ልጆችም ስጦታ ሰጥቶ ወደ ምሥራቅ አገር ሰደዳቸው።',v:'“አብርሃምም ደግሞ ስምዋ ኬጡራ የተባላች ሚስት አገባ።”',r:'ዘፍጥረት 25:1',l:'በኋለኛው የሕይወት ዘመንም እግዚአብሔር አዲስ መጀመሪያ ሊሰጥ ይችላል።'},
 {n:'ዲና',c:'የያዕቆብ ልጅ',b:'ዘፍጥረት 30፣ 34',i:'dinah.jpg',f:'የያዕቆብና የልያ ብቸኛ የተጠራችው ሴት ልጅ ነበረች።',s:'ዲና የልያ ልጅና የያዕቆብ ብቸኛ የተጠራችው ሴት ልጅ ነበረች። ወደ ሴኬም ከተማ ስትወጣ የዚያ አገር አለቃ ልጅ ሴኬም አስገድዶ አዋረዳት። ወንድሞችዋ ስምዖንና ሌዊም በሴኬም ሰዎች ላይ ተበቀሉ፤ ያዕቆብም በዚህ አዘነ። ታሪክዋ በሴቶች ላይ የሚደርስ ግፍ ምን ያህል ሐዘን እንደሚያመጣ ያሳያል።',v:'“ከዚያም በኋላ ሴት ልጅን ወለደች፥ ስምዋንም ዲና አለቻት።”',r:'ዘፍጥረት 30:21',l:'እግዚአብሔር የተገፋች ሴት ክብርን ያውቃል፥ ሐዘንዋንም አይዘነጋም።'},
 {n:'ትዕማር (የዳዊት ልጅ)',c:'የዳዊት ልጅ',b:'2 ሳሙኤል 13',i:'tamar-david.jpg',f:'የዳዊት ልጅና የአቤሴሎም እኅት፥ በእኩይ ወንድምዋ በአምኖን የተገፋች ሴት ነበረች።',s:'ትዕማር የንጉሥ ዳዊት ውብ ልጅና የአቤሴሎም እኅት ነበረች። እኩይ ወንድምዋ አምኖን በብልጠት ወደ ቤቱ ጠርቶአት አስገድዶ አዋረዳት። እርሷም የተቀደደ ልብስ ለብሳ አመድ ነስናሳ ለቅሳ ኖረች፤ አቤሴሎምም ወንድምዋን ጠልቶ ቆየ። ዳዊትም ለልጁ ፍትሕ አላደረገም።',v:'“ከዚህም በኋላ እንዲህ ሆነ፤ ለዳዊት ልጅ ለአቤሴሎም አንዲት የተዋበች እኅት ነበረችው፥ ስምዋም ትዕማር ነበረ፤ የዳዊትም ልጅ አምኖን ወደዳት።”',r:'2 ሳሙኤል 13:1',l:'በቤተሰብ ውስጥ የሚደርስ ግፍ ተደብቆ መቆየት የለበትም፤ እውነትና ፍትሕ ፈውስ ያመጣሉ።'},
 {n:'መዓካ (የአቤሴሎም እናት)',c:'የዳዊት ሚስት',b:'2 ሳሙኤል 3',i:'maacah.jpg',f:'የጌሹር ንጉሥ የተልማይ ልጅ፥ የዳዊት ሚስትና የአቤሴሎም እናት ነበረች።',s:'መዓካ የጌሹር ንጉሥ የተልማይ ልጅ ነበረች። ዳዊት በኬብሮን በነገሠበት ጊዜ አግብቶአት የአቤሴሎም እናት ሆነች። ልጁ አቤሴሎም በኋላ በውበቱና በዐመፁ ዝና አገኘ። እርሷ ከሌላ መንግሥት መጥታ የዳዊት ቤት አባል ሆነች።',v:'“ሁለተኛውም የቀርሜሎሳዊው የናባል ሚስት ከነበረች ከአቢግያ የተወለደው ዶሎሕያ ነበረ። ሦስተኛውም ከጌሹር ንጉሥ ከተልማይ ልጅ ከመዓካ የተወለደው አቤሴሎም ነበረ።”',r:'2 ሳሙኤል 3:3',l:'ከየትም ብንመጣ እግዚአብሔር በእቅዱ ውስጥ ቦታ ሊሰጠን ይችላል።'},
 {n:'ጎቶልያ',c:'ንግሥት',b:'2 ነገሥት 11',i:'athaliah.jpg',f:'የአካዝያስ እናት፥ የይሁዳን ዙፋን ቀምታ ስድስት ዓመት ነገሠች።',s:'ጎቶልያ የአካዝያስ እናትና የአክዓብ ቤት ልጅ ነበረች። ልጁ ሲሞት የዳዊትን ንጉሣዊ ዘር ሁሉ አጥፍታ ዙፋኑን ቀምታ ስድስት ዓመት ነገሠች። ነገር ግን ሕፃኑ ዮአስ በቤተ መቅደስ ተሰውሮ ዳነ፤ በሰባተኛው ዓመትም ንጉሥ ሆኖ ጎቶልያ ተገደለች።',v:'“የአካዝያስም እናት ጎቶልያ ልጅዋ እንደ ሞተ ባየች ጊዜ ተነሥታ የመንግሥትን ዘር ሁሉ አጠፋች።”',r:'2 ነገሥት 11:1',l:'በኃጢአት የተገኘ ሥልጣን አይጸናም፤ የእግዚአብሔር ተስፋ ግን በድብቅም ቢሆን ይኖራል።'},
 {n:'ኤልዛቤል',c:'ንግሥት',b:'1 ነገሥት 16፣ 21',i:'jezebel.jpg',f:'የአክዓብ ሚስት፥ በኣልን አስገብታ ናቦትንም አስገደለች።',s:'ኤልዛቤል የሲዶና ንጉሥ ልጅና የአክዓብ ሚስት ነበረች። የኣልን አምልኮ ወደ እስራኤል አስገባች፥ ነቢያትንም አሳደደች። የናቦትን የወይን አትክልት ለአክዓብ ለማስገኘት የሀሰት ክስ አዘጋጅታ ናቦትን አስገደለች። ኤልያስም ስለ እርሷ ፍርድ ተናግሮ ነበር፤ እርሷም በኢይዝራኤል በመስኮት ተጥላ ሞተች።',v:'“በናባጥም ልጅ በኢዮርብዓም ኃጢአት መሄድ ታናሽ ነገር መሰለው፥ የሲዶናውያንንም ንጉሥ የኤትበኣልን ልጅ ኤልዛቤልን አገባ፥ ሄዶም በኣልን አመለከ ሰገደለትም።”',r:'1 ነገሥት 16:31',l:'ተጽዕኖአችንን ለክፉ ነገር መጠቀም ወደ ጥፋት ይመራል።'},
 {n:'ደሊላ',c:'የሶምሶን ፍቅረኛ',b:'መሳፍንት 16',i:'delilah.jpg',f:'የሶምሶንን የኃይል ምሥጢር በመለመን አወጣችበት።',s:'ደሊላ በሶሬቅ ሸለቆ የምትኖር ሴት ነበረች፤ ሶምሶንም ወደዳት። የፍልስጥኤም አለቆች ብር ቃል ገብተውላት የኃይሉን ምሥጢር እንድታወጣ ጠየቋት። እርሷም ደጋግማ በመለመን ምሥጢሩን አወጣችበት፤ ሶምሶንም ተይዞ ዐይኖቹ ተገልብጠው ወደ እስር ቤት ወረደ።',v:'“ከዚህም በኋላ በሶሬቅ ሸለቆ የነበረች ደሊላ የተባለች አንዲት ሴትን ወደደ።”',r:'መሳፍንት 16:4',l:'የቅርብ ሰዎች እምነት ማታለል ታላቅ ጉዳት ያመጣል።'},
 {n:'የሎጥ ሚስት',c:'የሎጥ ሚስት',b:'ዘፍጥረት 19',i:'lots-wife.jpg',f:'ከሰዶም ስትሸሽ ወደ ኋላ ተመልክታ የጨው ሐውልት ሆነች።',s:'መላእክት ሎጥንና ቤተሰቡን ከሰዶም ለማውጣት መጡ። "ወደ ኋላ አትመልከት" ተብሎአቸው ነበር። የሎጥ ሚስት ግን ወደ ኋላ ተመለከተች፥ የጨው ሐውልትም ሆነች። ኢየሱስም "የሎጥን ሚስት አስቡ" ብሎ አስጠንቅቋል።',v:'“የሎጥም ሚስት ወደ ኋላዋ ተመለከተች፥ የጨው ሐውልትም ሆነች።”',r:'ዘፍጥረት 19:26',l:'እግዚአብሔር ወደፊት ሲጠራን ወደ ኋላው ኃጢአት መመልከት አደገኛ ነው።'},
 {n:'የኢዮብ ሚስት',c:'የኢዮብ ሚስት',b:'መጽሐፈ ኢዮብ 2',i:'jobs-wife.jpg',f:'በመከራው መካከል ኢዮብን "እግዚአብሔርን ስደብና ሙት" አለችው።',s:'ኢዮብ ልጆቹንና ሀብቱን አጥቶ በቁስል ታሞ ነበር። ሚስቱም በመከራው ተስፋ ቆርጣ "እስከ አሁን ፍጹምነትህን ይዘሃልን? እግዚአብሔርን ስደብና ሙት" አለችው። ኢዮብ ግን እርሷን መለሰላት፥ በእምነቱም ጸና። እርሷም ልጆቿን ያጣች እናት ነበረችና ሐዘንዋ እውነተኛ ነበር።',v:'“ሚስቱም። እስከ አሁን ፍጹምነትህን ይዘሃልን? እግዚአብሔርን ስደብና ሙት አለችው።”',r:'ኢዮብ 2:9',l:'በሐዘን ውስጥ የተናገርነው ቃል ሌሎችን ወደ ተስፋ መቁረጥ ሊገፋቸው ይችላል።'},
 {n:'የማኑሄ ሚስት (የሶምሶን እናት)',c:'የሶምሶን እናት',b:'መሳፍንት 13',i:'manoahs-wife.jpg',f:'መካን ሳለች የመልአኩን የሶምሶን ልደት ተስፋ ተቀበለች።',s:'የማኑሄ ሚስት መካን ነበረች፥ ልጅም አልወለደችም ነበር። የእግዚአብሔር መልአክ ለእርሷ ተገልጦ ወንድ ልጅ እንደምትወልድ፥ እርሱም እስራኤልን ከፍልስጥኤም እጅ ማዳን እንደሚጀምር ነገራት። እርሷም ለባልዋ ዜናውን አደረሰች፥ ሶምሶንም ተወለደ።',v:'“የእግዚአብሔርም መልአክ ለሴቲቱ ተገልጦ እንዲህ አላት። እነሆ፥ አንቺ መካን ነሽ፥ ልጅም አልወለድሽም፤ ነገር ግን ትፀንሻለሽ፥ ወንድ ልጅም ትወልጃለሽ።”',r:'መሳፍንት 13:3',l:'እግዚአብሔር ተስፋውን መጀመሪያ ለሚጠብቅና ለሚያምን ልብ ይገልጣል።'},
 {n:'የዮፍታሔ ልጅ',c:'የዮፍታሔ ልጅ',b:'መሳፍንት 11',i:'jephthahs-daughter.jpg',f:'ለአባትዋ ለተሳለ ስእለት ራስዋን በትእግሥት ሰጠች።',s:'ዮፍታሔ በአሞን ልጆች ላይ ድል ቢያደርግ ወደ ቤቱ መጀመሪያ የሚወጣውን ለእግዚአብሔር እንደሚያቀርብ ተሳለ። ድልም አደረገ፤ የመጀመሪያ የወጣችለት ግን ብቸኛ ልጁ ነበረች። እርሷም "በአፍህ እንደ ተናገርህ አድርግብኝ" ብላ ሁለት ወር ከጓደኞችዋ ጋር ኖራ ተመለሰች።',v:'“እርስዋም። አባቴ ሆይ፥ አፍህን ለእግዚአብሔር ከከፈትህ፥ እግዚአብሔር በጠላቶችህ በአሞን ልጆች ላይ ተበቅሎልሃልና በአፍህ እንደ ተናገርህ አድርግብኝ አለችው።”',r:'መሳፍንት 11:36',l:'የሌሎች ውሳኔ ሸክም ክብደት ቢኖርም በጽናትና በክብር መሄድ ይቻላል።'},
 {n:'ጎሜር',c:'የሆሴዕ ሚስት',b:'መጽሐፈ ሆሴዕ 1',i:'gomer.jpg',f:'የሆሴዕ ሚስት፥ የእስራኤል ክህነት ሕያው ምልክት ሆነች።',s:'እግዚአብሔር ሆሴዕን ጎሜርን እንዲያገባ አዘዘው፥ ሕይወቷ የእስራኤል ክህነት ምስል ይሆን ዘንድ። ጎሜርም ሦስት ልጆች ወለደች፤ ስሞቻቸውም ለእስራኤል የፍርድ መልእክት ነበሩ። በመጽሐፉ መጨረሻም እግዚአብሔር ሆሴዕን እርሷን እንደ ገና እንዲወስዳት አዞ ምሕረቱን አሳየ።',v:'“እርሱም ሄዶ የዴቤላይምን ልጅ ጎሜርን አገባ፤ እርስዋም ፀነሰች ወንድ ልጅንም ወለደችለት።”',r:'ሆሴዕ 1:3',l:'እግዚአብሔር የከሐደ ልብንም በምሕረቱ ሊመልስ ይችላል።'},
 {n:'ፍናና',c:'የኤልቃና ሚስት',b:'1 ሳሙኤል 1',i:'peninnah.jpg',f:'ልጆች እያሏት መካኒቱን ሐናን ትገሥጽባት ነበረች።',s:'ፍናና የኤልቃና ሁለተኛ ሚስት ነበረች፥ ልጆችም ነበሩአት። ሐና ግን መካን ነበረች። ወደ ሺሎ በሄዱበት ጊዜ ሁሉ ፍናና ሐናን ታስቆጣት ነበረች፤ ሐናም ታለቅስ ነበር። እግዚአብሔር ግን የሐናን ጸሎት ሰምቶ ሳሙኤልን ሰጣት።',v:'“ሁለትም ሚስቶች ነበሩት፤ የአንዲቱ ስም ሐና የሁለተኛይቱም ስም ፍናና ነበረ፤ ለፍናናም ልጆች ነበሩአት፥ ለሐና ግን ልጅ አልነበራትም።”',r:'1 ሳሙኤል 1:2',l:'የሌሎችን ድክምት መገሠጽ መራራነትን እንጂ በረከትን አያመጣም።'},
 {n:'ሜሮብ',c:'የሳኦል ልጅ',b:'1 ሳሙኤል 14፣ 18',i:'merab.jpg',f:'የሳኦል ታላቂቱ ልጅ፥ ለዳዊት ተስፍታ ግን ለአድርኤል ተዳረች።',s:'ሜሮብ የሳኦል ታላቂቱ ልጅ፥ የሜልኮል እኅት ነበረች። ሳኦል ጎልያድን ለገደለ ሚስት እንደሚሰጣት ቃል ገብቶ ነበር፤ ጊዜው ሲደርስ ግን ለአድርኤል መሐላዊ ሰጣት። እርሷም ለአድርኤል አምስት ወንዶች ወለደች። የወላጆች ቃል አለመጠበቅ በልጆች ሕይወት ላይ ጫና ያደርጋል።',v:'“የሳኦልም ወንዶች ልጆች ዮናታን፥ የሱዊ፥ ሜልኪሳ ነበሩ፤ የሁለቱም ሴቶች ልጆቹ ስም ይህ ነበረ፤ የታላቂቱ ስም ሜሮብ፥ የታናሺቱም ስም ሜልኮል ነበረ።”',r:'1 ሳሙኤል 14:49',l:'የሰዎች ቃል ባይጸናም የእግዚአብሔር ቃል ይጸናል።'},
 {n:'አኪናሆም (የዳዊት ሚስት)',c:'የዳዊት ሚስት',b:'1 ሳሙኤል 25–30',i:'ahinoam.jpg',f:'ኢይዝራኤላዊቱ፥ የዳዊት ሚስት፥ በሽሽቱም ከእርሱ ጋር ዞረች።',s:'አኪናሆም ከኢይዝራኤል የነበረች የዳዊት ሚስት ነበረች። ዳዊት ከሳኦል ሲሸሽ እርሷም ከእርሱ ጋር ወደ ጋትና ወደ ጺቅላግ ዞረች። አማሌቃውያን ጺቅላግን ሲዘርፉ እርሷም ተማርካ ነበር፤ ዳዊትም ተከትሎ አዳናት።',v:'“ዳዊትም ደግሞ ኢይዝራኤላዊቱን አኪናሆምን ወሰደ፤ ሁለቱም ሚስቶች ሆኑለት።”',r:'1 ሳሙኤል 25:43',l:'ታማኝነት በመልካምም በመከራም ጊዜ አብሮ መቆም ነው።'},
 {n:'አጊት',c:'የዳዊት ሚስት',b:'2 ሳሙኤል 3',i:'haggith.jpg',f:'በኬብሮን የዳዊት ሚስት፥ የአዶንያስ እናት ነበረች።',s:'አጊት ዳዊት በኬብሮን በነገሠበት ጊዜ ከሚስቶቹ አንዲት ነበረች። የአራተኛ ልጁ የአዶንያስ እናት ሆነች። አዶንያስም በኋላ ዳዊት በሸመገለ ጊዜ መንግሥቱን ሊቀማ ሞከረ፤ ሰሎሞን ግን ንጉሥ ሆነ።',v:'“አራተኛውም የአጊት ልጅ አዶንያስ፥ አምስተኛውም የአቢጣል ልጅ ሰፋጥያስ ነበረ።”',r:'2 ሳሙኤል 3:4',l:'ልጆቻችንን በትክክለኛው መንገድ ማሳደግ ከሥልጣን ፍላጎት ይበልጣል።'},
 {n:'የዓይንዶር መናፍስት ጠሪት',c:'መናፍስት ጠሪት',b:'1 ሳሙኤል 28',i:'witch-endor.jpg',f:'በዓይንዶር ለሳኦል ሳሙኤልን ጠርታ አስነሣችለት።',s:'ሳኦል እግዚአብሔርን ጠይቆ ምላሽ ባላገኘ ጊዜ ራሱን ቀይሮ ወደ ዓይንዶር ወደ መናፍስት ጠሪቷ ሴት ሄደ። እርሷም በመጀመሪያ ፈርታ ነበር፤ በኋላም ሳሙኤልን አስነሣችለት፥ የፍርድ ቃሉንም ሰማ። ከዚያም ለሳኦልና ለአገልጋዮቹ ምግብ አዘጋጅታ ሰጠቻቸው። ታሪክዋ እግዚአብሔር ዝም ሲል ወደ ክፉ መንገድ መሄድ አደገኛ እንደሆነ ያሳያል።',v:'“ሳኦልም ባሪያዎቹን። ወደ እርስዋ ሄጄ እጠይቅ ዘንድ መናፍስትን የምትጠራ ሴት ፈልጉልኝ አላቸው፤ ባሪያዎቹም። እነሆ፥ መናፍስትን የምትጠራ አንዲት ሴት በዓይንዶር አለች አሉት።”',r:'1 ሳሙኤል 28:7',l:'እግዚአብሔር ዝም ሲልብን ወደ እርሱ እንጂ ወደ ጨለማ መንገድ መመለስ የለብንም።'},
 {n:'ሄሮድያዳ',c:'የሄሮድስ ሚስት',b:'ማቴዎስ 14',i:'herodias.jpg',f:'በዮሐንስ መጥምቁ ላይ ቂም ይዛ ራሱ እንዲቆረጥ አደረገች።',s:'ሄሮድያዳ የፊልጶስ ሚስት ነበረች፥ በኋላም ሄሮድስ አገባት። ዮሐንስ መጥምቅ "እርስዋ ለአንተ ልትሆን አይገባም" ስላላቸው በእርሱ ላይ ቂም ያዘች። በሄሮድስ የልደት ግብዣ ላይ ልጅዋ ዘፍና ስትጨርስ የዮሐንስን ራስ እንድትጠይቅ አስተማረቻት፤ ራሱም በወጭት ቀረበላት።',v:'“ሄሮድስ በወንድሙ በፊልጶስ ሚስት በሄሮድያዳ ምክንያት ዮሐንስን አስይዞ አሳስሮት በወህኒ አኑሮት ነበርና፤”',r:'ማቴዎስ 14:3',l:'ቂም በልብ ውስጥ ሲቆይ ወደ ታላቅ ኃጢአት ይወስዳል።'},
 {n:'የሄሮድያዳ ልጅ',c:'የሄሮድያዳ ልጅ',b:'ማቴዎስ 14',i:'herodias-daughter.jpg',f:'በሄሮድስ የልደት ግብዣ ዘፍና የዮሐንስን ራስ ለምና ተቀበለች።',s:'የሄሮድያዳ ልጅ በሄሮድስ የልደት ቀን በመካከላቸው ዘፈነች፥ ንጉሡንም ደስ አሰኘችው። እርሱም የምትጠይቀውን ሁሉ እንዲሰጣት ማለ። እርሷም በእናትዋ ተማምና የዮሐንስ መጥምቅን ራስ በወጭት እንድትሰጥ ጠየቀች፤ እንዲሁም ሆነ። መጽሐፍ ቅዱስ ስምዋን አይጠቅምም።',v:'“ነገር ግን ሄሮድስ የተወለደበት ቀን በሆነ ጊዜ፥ የሄሮድያዳ ልጅ በመካከላቸው ዘፈነች ሄሮድስንም ደስ አሰኘችው፤”',r:'ማቴዎስ 14:6',l:'የወላጆች ክፉ ምክር ልጆችን ወደ ኃጢአት ሊመራቸው ይችላል።'},
 {n:'ሰጲራ',c:'አማኝ',b:'ሐዋርያት ሥራ 5',i:'sapphira.jpg',f:'ከባልዋ ከሐናንያ ጋር ስለ መሬቱ ዋጋ ሀሰት ተናግራ ወደቀች።',s:'ሰጲራና ባልዋ ሐናንያ መሬታቸውን ሽጠው ዋጋውን በሙሉ እንዳስረከቡ እየመሰሉ ከፊሉን ሰወሩ። ጴጥሮስም "መንፈስ ቅዱስን ታታልላችሁ ዘንድ ስምምነት አደረጋችሁ" አላቸው። ሰጲራም እንደ ባልዋ ወድቃ ሞተች፤ በቤተ ክርስቲያን ላይም ታላቅ ፍርኃት ሆነ።',v:'“ሐናንያም የተባለ አንድ ሰው ሰጲራ ከተባለች ከሚስቱ ጋር መሬት ሸጠ፥”',r:'ሐዋርያት ሥራ 5:1',l:'በእምነት ሕይወት ውስጥ ሀሰትና ግብዝነት ስፍራ የላቸውም።'},
 {n:'ድሩሲላ',c:'የገዥ ሚስት',b:'ሐዋርያት ሥራ 24',i:'drusilla.jpg',f:'የገዥው የፊልክስ ሚስት፥ ጳውሎስ ስለ እምነት ሲናገር ሰምታለች።',s:'ድሩሲላ አይሁዳዊት የገዥው ፊልክስ ሚስት ነበረች። ከባልዋ ጋር ጳውሎስን አስመጥተው ስለ ክርስቶስ እምነት የሚናገረውን ሰሙት። ጳውሎስ ስለ ጽድቅና ስለ ራስን መግዛት ስለሚመጣውም ፍርድ ሲናገር ፊልክስ ፈራ፥ ወሬውንም ለሌላ ጊዜ አዘገየው።',v:'“ከጥቂት ቀንም በኋላ ፊልክስ አይሁዳዊት ከነበረች ድሩሲላ ከሚሉአት ከሚስቱ ጋር መጥቶ ጳውሎስን አስመጣ፥ በኢየሱስ ክርስቶስም ስለ ማመን የሚናገረውን ሰማው።”',r:'ሐዋርያት ሥራ 24:24',l:'የእምነትን ቃል መስማት ብቻውን አይበቃም፤ በእርሱ መኖር ያስፈልጋል።'},
 {n:'በርኒቄ',c:'ንግሥታዊት',b:'ሐዋርያት ሥራ 25–26',i:'bernice.jpg',f:'የንጉሥ አግሪጳ እኅት፥ ጳውሎስ ለንጉሡ ሲመከር ተገኝታለች።',s:'በርኒቄ የንጉሡ የአግሪጳ እኅት ነበረች። ከወንድምዋ ጋር ወደ ቂሳርያ መጥታ ጳውሎስ ለንጉሡ ሲመከር ተገኝታለች። ጳውሎስም የኢየሱስን ትንሣኤ በድፍረት ሰበከ፤ በመጨረሻም አግሪጳና በርኒቄ ተነሥተው ጳውሎስ የሞት ዋጋ የሚያስከፍል አንዳች እንዳላደረገ ተስማሙ።',v:'“ከጥቂት ቀንም በኋላ ንጉሡ አግሪጳ በርኒቄም ለፊስጦስ ሰላምታ እንዲያቀርቡ ወደ ቂሳርያ ወረዱ።”',r:'ሐዋርያት ሥራ 25:13',l:'የሥልጣን ሰዎች ፊትም ወንጌል በእውነት ይሰበካል።'},
 {n:'ማርያም (የዮሐንስ ማርቆስ እናት)',c:'አስተናጋጅ',b:'ሐዋርያት ሥራ 12',i:'mary-john-mark.jpg',f:'በኢየሩሳሌም ያላት ቤት ለአማኞች የጸሎት ስፍራ ሆነ።',s:'ማርያም የማርቆስ የተባለ የዮሐንስ እናት ነበረች። በኢየሩሳሌም ያላት ቤት አማኞች ተሰብስበው የሚጸልዩበት ስፍራ ነበረ። ጴጥሮስ ከወህኒ በተአምራት ሲወጣ መጀመሪያ ወደ እርሷ ቤት መጣ፤ አገልጋይዋ ሮዴም በሩን ከፈተችለት። ቤትዋ ለቤተ ክርስቲያን ማእከል ሆነ።',v:'“ባስተዋለም ጊዜ እጅግ ሰዎች ተከማችተው ይጸልዩበት ወደ ነበረው ማርቆስ ወደ ተባለው ወደ ዮሐንስ እናት ወደ ማርያም ቤት መጣ።”',r:'ሐዋርያት ሥራ 12:12',l:'ቤታችንን ለጸሎትና ለአገልግሎት መክፈት ታላቅ በረከት ያመጣል።'},

 'ረዓብ':'ያለፈው ሕይወትሽ የወደፊትሽን እንዲገድብ አትፍቀጂ፤ በእምነት የምትወስጂው እርምጃ ለቤተሰብሽም አዲስ መንገድ ሊከፍት ይችላል።',
 'ዲቦራ':'ግጭትና ግራ መጋባት በበዛበት ጊዜ፣ በጥበብ ልትመሪ፣ ሌሎችንም ወደ ድፍረት ልታነሺ ትችያለሽ።',
 'ኑኃሚን':'ሐዘን ሲከብድሽ ከሰዎች ፍቅር ራስሽን አትለዪ፤ ተስፋ በትንሽ ግንኙነቶች እንደገና ሊበቅልልሽ ይችላል።',
 'ሐና':'ማኅበራዊ ጫናና ያልተመለሱ ጥያቄዎች ሲያስጨንቁሽ፣ ልብሽን ሳትሸፍኚ በጸሎት ማፍሰስ ትችያለሽ።',
 'አቢግያ':'ቁጣና ክፍፍል በበዛበት ዓለም፣ በትክክለኛው ጊዜ የምትናገሪው የጥበብ ቃል ጉዳትን ሊያቆም ይችላል።',
 'የሳባ ንግሥት':'የተሳሳተ መረጃ በፍጥነት በሚሰራጭበት ዘመን፣ ጥያቄ ጠይቂ፣ እውነትን ፈልጊ፣ ከምታገኚውም ጥበብ ተማሪ።',
 'ኤልሳቤጥ':'ውድድር ሴቶችን ሲለያይ፣ የሌላዋን ሴት ጥሪ በቅንነት አክብሪ፤ ቃልሽ እምነቷን ሊያበረታ ይችላል።',
 'ማርያም':'የወደፊትሽ መንገድ ሙሉ በሙሉ ባይገባሽም፣ በእምነት “አዎ” ብለሽ የሚቀጥለውን እርምጃ ልትወስጂ ትችያለሽ።',
 'መግደላዊት ማርያም':'የዳንሽበትንና የተለወጥሽበትን ታሪክ አታሳንሺ፤ ተስፋ በጠፋበት ቦታ የትንሣኤን ዜና ልታደርሺ ትችያለሽ።',
 'ማርታ':'ሁልጊዜ ሥራ እንድታበዢ በሚጠይቅ ዓለም፣ እረፍትንና መገኘትን ምረጪ፤ ዋጋሽ በምርታማነትሽ ብቻ አይለካም።',
 'ሳምራዊቷ ሴት':'ኀፍረት እንድትደበቂ ሲነግርሽ፣ እውነትን ተቀብለሽ ድምፅሽን መልሰሽ አግኚ፤ ታሪክሽ ሌሎችን ወደ ተስፋ ሊጠራ ይችላል።',
 'ልድያ':'ሥራሽን፣ ቤትሽንና ያለሽን ሀብት ለመልካም ነገር በልግስና ልታካፍዪ ትችያለሽ፤ ተጽዕኖ መድረክ ብቻ አይፈልግም።',
 'ጵርስቅላ':'ብዙ ድምፆች በሚሰሙበት ዘመን፣ የምታውቂውን እውነት በትሕትናና በክብር በማካፈል ሌሎችን ማሳደግ ትችያለሽ።',
 'ፌበን':'ማንም ባያይሽም የምታደርጊው ታማኝ አገልግሎት ሰዎችንና ማኅበረሰብን ይደግፋል፤ የማይታይ ሥራሽ ዋጋ አለው።',
 'ነቢይቱ ሐና':'ፈጣን ውጤት በሚፈለግበት ዘመን፣ በጸሎት ጸንተሽ በመጠበቅ እግዚአብሔር የሚሠራውን ለማየት ልብሽን ማዘጋጀት ትችያለሽ።',
 'አጋር':'የተረሳሽ ወይም ያልታየሽ ቢመስልሽም ድምፅሽ ይሰማል፤ በስደትና በብቸኝነት ውስጥም ተስፋን መያዝ ትችያለሽ።',
 'ራሔል':'ንጽጽርና ረጅም መጠበቅ ሲያደክሙሽ፣ የራስሽን ጉዞ አክብሪ፤ ሕመምሽን ለመናገርና ድጋፍ ለመቀበል ትችያለሽ።',
 'ልያ':'መልክ፣ ተወዳጅነትና ንጽጽር ዋጋሽን እንዲወስኑ አትፍቀጂ፤ ያለሽው ክብር ከሌሎች ምርጫ አይመጣም።',
 'ትዕማር':'ሥርዓቶች ፍትሕን ሲነፍጉሽ፣ እውነትሽን በድፍረት ልትናገሪና መብትሽን ልትጠብቂ ትችያለሽ።',
 'ቤርሳቤህ':'በአንቺ ላይ የተፈጸመው ጉዳት የታሪክሽ መጨረሻ አይደለም፤ ክብርሽን መልሰሽ ተስፋን ልትገነቢ ትችያለሽ።',
 'ዮካብድ':'ልጆች በአደጋ ሲጋለጡ፣ ፍርሃት ቢኖርሽም ለደኅንነታቸው በጥበብና በድፍረት መቆም ትችያለሽ።',
 'ሲፓራ':'ስደትና የባህል ለውጥ በቤተሰብሽ ላይ ሲከብድ፣ ማንነትሽን ጠብቀሽ አዲስ ቤትና ግንኙነት ልትገነቢ ትችያለሽ።',
 'ሎይድ':'ዲጂታል ድምፆች ልጆችን በሚቀርጹበት ዘመን፣ በአኗኗርሽ የምታሳዪው እምነት ለቀጣዩ ትውልድ ዘላቂ ርስት ይሆናል።',
 'ጣቢታ':'ድህነትና ብቸኝነት በዙሪያሽ ሲታዩ፣ በእጅሽ ያለውን ችሎታ ተጠቅመሽ ተግባራዊ ፍቅርን ማሳየት ትችያለሽ።',
 'ኢያዔል':'ጠላት ወደ ቤትሽ ሲገባ በፍርሃት ዝም አትበይ፤ በእጅሽ ያለውን ተጠቅመሽ ለቤተሰብሽና ለእምነትሽ መቆም ትችያለሽ።',
 'ሕልዳና':'እውነት አንዳንድ ጊዜ ከባድ ቢሆንም በፍቅርና በድፍረት ልትናገሪው ትችያለሽ፤ ቃልሽ ለውጥ ሊያመጣ ይችላል።',
 'ዓክሳ':'ፍላጎትሽን ዝም ብለሽ አትሸፍኚ፤ በትክክለኛው ሰው ፊት በድፍረት ልትጠይቂ ትችያለሽ።',
 'አስናት':'ከሌላ ባህልና ቤተሰብ ብትመጪም አንቺ ለትውልድ በረከት የምትሆን እናትና ሴት ልትሆኚ ትችያለሽ።',
 'አስጢን':'ሰዎች ለእይታቸው ብቻ እንድትቀርቢ ሲፈልጉ ክብርሽን አታሳንሺ፤ “እምቢ” ማለትሽ ራስሽን መጠበቅ ሊሆን ይችላል።',
 'ዖርፋ':'አንቺም አንዳንድ ግንኙነት በሰላም ልትለቂ ትችያለሽ፤ መለያየት ሁልጊዜ ውድቀት አይደለም።',
 'ሜልኮል':'የምትወጂውን ሰው በአደጋ ስታይ ዝም አትበይ፤ በጥበብና በድፍረት ልትጠብቂው ትችያለሽ።',
 'ዮሳቤት':'ማንም ባያይሽም በድብቅ የምታደርጊው ጥበቃና ታማኝነት ዋጋ አለው፤ አንቺ ለትውልድ ጠባቂ ልትሆኚ ትችያለሽ።',
 'ሪጽፋ':'በሐዘን ውስጥም ክብርን ጠብቀሽ ጸንተሽ መቆም ትችያለሽ፤ ጽናትሽ ለሌሎች ፍትሕ ሊያመጣ ይችላል።',
 'ሲፓራና ፉሐ':'በሥራ ቦታሽም ሆነ በማኅበራዊ ጫና ውስጥ ክፉ ነገር ሲጠየቅሽ እምቢ ልትዪ ትችያለሽ፤ ታማኝነትሽ ሕይወትን ያድናል።',
 'የሰራፕታ መበለት':'ያለሽ ትንሽ ቢሆንም በልግስና ስትካፈዪ እግዚአብሔር ለቤተሰብሽ ምንጭ ሊከፍትልሽ ይችላል።',
 'የሹኔም ሴት':'ቤትሽንና ጊዜሽን ለሌሎች ስትከፍቺ እግዚአብሔር ያልጠበቅሽውን በረከት ሊያመጣልሽ ይችላል።',
 'የአቤል ጥበበኛ ሴት':'ግጭት ሲነሣ በድምፅሽ ሰላምን ልትፈልጊ ትችያለሽ፤ በጥበብ የምትናገሪው ቃል ብዙዎችን ሊጠብቅ ይችላል።',
 'የሰሎፍሐድ ሴት ልጆች':'መብትሽ ሲነፈግሽ ዝም አትበይ፤ በክብርና በድፍረት ልትናገሪ ትችያለሽ፤ ድምፅሽ ለሌሎች ሴቶችም መንገድ ሊከፍት ይችላል።',
 'ሱላማጢስ':'በፈጣን ግንኙነቶች ዘመን አንቺ ጽኑዕና ታማኝ ፍቅርን ልትመርጪ ትችያለሽ።',
 'ማርያም (የአልዓዛር እኅት)':'ጊዜሽንና ያለሽን ውድ ነገር ለእግዚአብሔር ስትሰጪ ሌሎች ብክነት ቢሉትም አንቺ የፍቅር ዋጋውን ታውቂያለሽ።',
 'ዮሐና':'አንቺም የተቀበልሽውን የተስፋ ዜና ለሌሎች ልታደርሺ ትችያለሽ፤ ምስክርነትሽ ዋጋ አለው።',
 'ሶስና':'አንቺም ያለሽን በልግስና በመስጠት የሌሎችን አገልግሎት ልትደግፊ ትችያለሽ።',
 'ሰሎሜ':'ሌሎች በሚሸሹበት መከራ ውስጥ አንቺ በአጠገብ ቆመሽ ታማኝነትሽን ልታሳዪ ትችያለሽ።',
 'ማርያም (የያዕቆብ እናት)':'አንቺም በሐዘንሽ መካከል ፍቅርሽን ስትከተዪ ያልጠበቅሽውን የተስፋ ዜና ልታግኚ ትችያለሽ።',
 'የከነዓናዊት ሴት':'ምላሽ ሲዘገይብሽ ተስፋ አትቁረጪ፤ በጽናትና በትሕትና መለመንሽን ቀጥዪ።',
 'ደም የሚፈሳት ሴት':'ለረጅም ጊዜ የቆየ ሕመምሽ ተስፋ እንዳታቋርጪ፤ በእምነት ወደ ኢየሱስ ልትቀርቢ ትችያለሽ።',
 'የናይን መበለት':'አንቺም በሐዘንሽ ውስጥ ብቸኛ አይደለሽም፤ ኢየሱስ ያይሻል፥ ይራራልሻልም።',
 'የታገበተች ሴት':'ለረጅም ጊዜ የከበደሽ ነገር ቢኖርም አንቺ ዛሬ ቀጥ ልትይ እግዚአብሔርንም ልታከብሪ ትችያለሽ።',
 'ኤውንቄ':'አንቺም በቤትሽ የምታሳድጊው እምነት በልጆችሽ ውስጥ ለትውልድ ሊቆይ ይችላል።',
 'ሮዴ':'አንቺም የጸሎትሽ ምላሽ ሲመጣ በደስታ ዜናውን ለሌሎች ልታደርሺ ትችያለሽ።',
 'ንግሥት ቀንዳቄ':'አንቺም በምትሠርይበት ቦታ የምታደርጊው ታማኝነት ወንጌልን ለሌሎች ሊያደርስ ይችላል።',
 'ማርያም (የቅሎፋ ሚስት)':'አንቺም በመከራ ጊዜ ከምትወጂያቸው ሰዎች አጠገብ መቆምሽ የፍቅርሽ ማረጋገጫ ነው።',
 'የጲላጦስ ሚስት':'አንቺም በልብሽ የምታውቂውን እውነት ለሚመለከተው ሰው በሰዓቱ ልትናገሪ ትችያለሽ።',
 'የጴጥሮስ አማት':'አንቺም ከተፈወሽና ከተደገፍሽ በኋላ ያገኘሽውን ኃይል ለሌሎች አገልግሎት ልትጠቀሚበት ትችያለሽ።',
 'ዓዳ':'አንቺም በቤትሽ ውስጥ ለትውልድ መሠረት የምትጥይ ሴት ልትሆኚ ትችያለሽ፤ የምታሳድጊያቸው ልጆች የራሳቸውን ስፍራ በታሪክ ይይዛሉ።',
 'ሴላ':'አንቺም ልጆችሽ ያላቸውን ችሎታ አስተውለሽ ለበጎ ሥራ እንዲጠቀሙበት ልታበረታችይ ትችያለሽ።',
 'ባላ':'አንቺም ቦታሽ ዝቅ ያለ ቢመስልም እግዚአብሔር በሕይወትሽ በኩል ታላቅ ነገር ሊሠራ እንደሚችል አምኚ።',
 'ኬጡራ':'አንቺም ዕድሜሽ ወይም ያለፈው ዘመንሽ ለእግዚአብሔር አዲስ ሥራ እንቅፋት አይደለም፤ እርሱ አሁንም ሊጀምርልሽ ይችላል።',
 'ዲና':'አንቺም የተጎዳች ወይም የተገፋች ሴት ካየሽ ዝም አትበይ፤ አጠገብዋ ቆመሽ ድምፅ ልትሆኚላት ትችያለሽ።',
 'ትዕማር (የዳዊት ልጅ)':'አንቺም አንዲት ሴት ስትገፋ ድምፅሽን ከፍ አድርገሽ ልትናገሪ ትችያለሽ፤ ዝምታ ግፍን አያቆምም።',
 'መዓካ (የአቤሴሎም እናት)':'አንቺም መነሻሽ የወደፊትሽን አይወስንም፤ እግዚአብሔር ባልጠበቅሽው ስፍራ ሊያኖርሽ ይችላል።',
 'ጎቶልያ':'አንቺም ሥልጣንን ወይም ዕድልን በክፉ መንገድ አትፈልጊ፤ ትክክለኛው መንገድ ዘገም ብሎም ይጸናል።',
 'ኤልዛቤል':'አንቺም በቤትሽና በማኅበረ ሰብሽ ያልሽን ተጽዕኖ ለበጎ ነገር እንጂ ለጉዳት እንዳትጠቀሚበት ተጠንቅቂ።',
 'ደሊላ':'አንቺም ሰዎች የሚያምኑሽን ምሥጢር ጠብቂ፤ ታማኝነት የምትገነባው ሀብትሽ ነው።',
 'የሎጥ ሚስት':'አንቺም እግዚአብሔር ካወጣሽበት ሕይወት ወደ ኋላ አትመልከች፤ እርሱ ያዘጋጀልሽ ወደፊት ነው።',
 'የኢዮብ ሚስት':'አንቺም በሐዘንሽ ውስጥም ቢሆን የተስፋ ቃል ልትናገሪ ትችያለሽ፤ ቃልሽ ለምትወጂው ሰው ኃይል ሊሆን ይችላል።',
 'የማኑሄ ሚስት (የሶምሶን እናት)':'አንቺም ለረጅም ጊዜ የጠበቅሽው ነገር እግዚአብሔር ባልጠበቅሽው ሰዓት ሊጀምርልሽ ይችላል፤ ተስፋሽን ጠብቂ።',
 'የዮፍታሔ ልጅ':'አንቺም የሌሎች ውሳኔ ሸክም ቢሆንብሽም ክብርሽን ጠብቀሽ በጽናት ልትቆሚ ትችያለሽ።',
 'ጎሜር':'አንቺም ከእግዚአብሔር የራቅሽ ቢሆንም እርሱ በምሕረት ሊመልስሽ እንደሚችል አስታውሽ፤ ተመለሽ።',
 'ፍናና':'አንቺም ያልሽን በረከት የሌላዋን ሕመም ለመንቀፍ አትጠቀሚበት፤ በሚራራ ልብ ተጠቅመሽ ኑሪ።',
 'ሜሮብ':'አንቺም ሰዎች ቃላቸውን ባይጠብቁልሽም ተስፋሽን በእግዚአብሔር ላይ አድርጊ፤ እርሱ ቃሉን ይጠብቃል።',
 'አኪናሆም (የዳዊት ሚስት)':'አንቺም ለምትወጂያቸው ሰዎች በመከራ ጊዜም አብረሽ በመቆም ታማኝነትሽን ልታሳዪ ትችያለሽ።',
 'አጊት':'አንቺም ልጆችሽን በትሕትናና በእውነት እንጂ በትምክህት እንዳያድጉ ልታሳድጊ ትችያለሽ።',
 'የዓይንዶር መናፍስት ጠሪት':'አንቺም ምላሽ ሲዘገይብሽ በትእግሥት እግዚአብሔርን ጠብቂ፤ አቋራጭ የጨለማ መንገድ አትፈልጊ።',
 'ሄሮድያዳ':'አንቺም ቂምን በልብሽ አታሳድሪው፤ ይቅርታና መልቀቅ ነፍስሽን ነፃ ያወጣታል።',
 'የሄሮድያዳ ልጅ':'አንቺም ምክር ስትቀበዪ መልካምን ከክፉ ለይተሽ አወቂ፤ የእግዚአብሔርን ፈቃድ የሚቃረን ምክር አትከተዪ።',
 'ሰጲራ':'አንቺም በእግዚአብሔርም በሰዎችም ፊት በቅንነት ኑሪ፤ እውነት ሁልጊዜ ከግብዝነት ይበልጣል።',
 'ድሩሲላ':'አንቺም የምትሰሚውን የእግዚአብሔርን ቃል ለሌላ ቀን አታዘግዪው፤ ዛሬውኑ ተጠቅመሽ ኑሪ።',
 'በርኒቄ':'አንቺም እምነትሽን በማናቸውም ስፍራ ያለ ፍርኃት ልትናገሪ ትችያለሽ፤ እውነት ለሁሉም ነው።',
 'ማርያም (የዮሐንስ ማርቆስ እናት)':'አንቺም ቤትሽን ለጸሎትና ለሚያስፈልጋቸው ሰዎች ስትከፍች እግዚአብሔር ለብዙዎች መጽናናት ሊያደርግሽ ይችላል።',
 'ደማሪስ':'አንቺም አካባቢሽ ለወንጌል ዝግ ያለ ቢመስልም ተስፋ አትቁረጪ፤ አንድ ልብ መከፈቱ መጀመሪያ ነው።',
 'አፍብያ':'አንቺም በቤተ ክርስቲያንሽ ውስጥ "እኅት" ልትባዪ በሚገባ ፍቅርና አገልግሎት ኑሪ።',
 'ኤዎድያ እና ሲንጤኪ':'አንቺም ከአገልግሎት ባልንጀራሽ ጋር አለመግባባት ቢኖር ዕርቅን ፈልጊ፤ አንድነት አገልግሎትን ያጸናል።',
 'የዝሙት የተያዘች ሴት':'አንቺም ያለፈሽ ኃጢአት ቢያሳፍርሽም ኢየሱስ አይፈርድብሽም፤ ምሕረቱን ተቀብለሽ አዲስ ሕይወት ጀምሪ።',
 'የናእማን ቤት ውስጥ ያለችው ታናሽ ሴት ልጅ':'አንቺም ትንሽና ስም አልባ በሰዎች ዓይን ብትመስይም፥ ስለ እግዚአብሔር የምትናገሪው አንዲት ቃል የሌላውን ሕይወት ሊቀይር ይችላል፤ ዝም አትበዪ።'

const passages=[{"ref": "አስቴር 4:1-17", "key": 15, "v": [[1, "መርዶክዮስም የተደረገውን ሁሉ ባወቀ ጊዜ ልብሱን ቀደደ፥ ማቅም ለበሰ አመድም ነሰነሰ፥ ወደ ከተማይቱም መካከል ወጣ፥ ታላቅም የመረረ ጩኸት ጮኸ።"], [2, "ማቅም ለብሶ በንጉሥ በር መግባት አይገባም ነበርና እስከ ንጉሡ በር አቅራቢያ መጣ።"], [3, "የንጉሡም ትእዛዝና አዋጅ በደረሰበት አገር ሁሉ በአይሁድ ላይ ታላቅ ኀዘንና ጾም ልቅሶና ዋይታም ሆነ ብዙዎችም ማቅና አመድ አነጠፉ።"], [4, "የአስቴርም ደንገጥሮችዋና ጃንደረቦችዋ መጥተው ነገሩአት፥ ንግሥቲቱም እጅግ አዘነች፤ ማቁንም ለውጦ ልብስ ይለብስ ዘንድ ለመርዶክዮስ ሰደደችለት፤ እርሱ ግን አልተቀበለም።"], [5, "አስቴርም ያገለግላት ዘንድ ንጉሡ ያቆመውን አክራትዮስን ጠራች እርሱም ከጃንደረቦች አንዱ ነበረ፥ እርስዋም ይህ ነገር ምንና ምን እንደ ሆነ ያስታውቃት ዘንድ ወደ መርዶክዮስ እንዲሄድ አዘዘችው።"], [6, "አክራትዮስም በንጉሥ በር ፊት ወደ ነበረችው ወደ ከተማይቱ አደባባይ ወደ መርዶክዮስ ወጣ።"], [7, "መርዶክዮስም የተደረገውን ሁሉ፥ አይሁድንም ለማጥፋት ሐማ በንጉሡ ግምጃ ቤት ይመዝን ዘንድ የተናገረውን የብሩን ቍጥር ነገረው።"], [8, "ለአስቴርም እንዲያሳያት ለመጥፋታቸው በሱሳ የተነገረውን የአዋጁን ጽሕፈት ቅጅ ሰጠው፤ ወደ ንጉሡም ገብታ ስለ ሕዝብዋ ትለምነውና ትማልደው ዘንድ እንዲነግራትና እንዲያዝዛት ነገረው።"], [9, "አክራትዮስም መጥቶ የመርዶክዮስን ቃል ለአስቴር ነገራት።"], [10, "አስቴርም አክራትዮስን ተናገረችው፥ ለመርዶክዮስም እንዲህ የሚል መልእክት ሰጠችው።"], [11, "የንጉሡ ባሪያዎችና በአገሮችም የሚኖሩ ሕዝብ ሁሉ ወንድ ወይም ሴት ቢሆን ሳይጠራ ወደ ንጉሡ ወደ ውስጠኛው ወለል የሚገባ ሁሉ፥ በሕይወት ይኖር ዘንድ ንጉሡ የወርቁን ዘንግ ካልዘረጋለት በቀር፥ እርሱ ይሞት ዘንድ ሕግ እንዳለ ያውቃሉ፤ እኔ ግን ወደ ንጉሡ ለመግባት ይህን ሠላሳውን ቀን አልተጠራሁም።"], [12, "አክራትዮስም የአስቴርን ቃል ለመርዶክዮስ ነገረው።"], [13, "መርዶክዮስም አክራትዮስን። ሂድና ለአስቴር እንዲህ በላት አለው። አንቺ። በንጉሥ ቤት ስለ ሆንሁ ከአይሁድ ሁሉ ይልቅ እድናለሁ ብለሽ በልብሽ አታስቢ።"], [14, "በዚህ ጊዜ ቸል ብትዪ ዕረፍትና መዳን ለአይሁድ ከሌላ ስፍራ ይሆንላቸዋል፥ አንቺና የአባትሽ ቤት ግን ትጠፋላችሁ፤ ደግሞስ ወደ መንግሥት የመጣሽው እንደዚህ ላለው ጊዜ እንደ ሆነ ማን ያውቃል?"], [15, "አስቴርም እንዲህ ብሎ ለመርዶክዮስ እንዲመልስ አዘዘችው።"], [16, "ሄደህ በሱሳ ያሉትን አይሁድ ሁሉ ሰብስብ፥ ለእኔም ጹሙ፤ ሦስት ቀን ሌሊቱንና ቀኑን አትብሉም፥ አትጠጡም፤ እኔና ደንገጥሮቼ ደግሞ እንዲሁ እንጾማለን፤ ምንም እንኳ ያለ ሕግ ቢሆን ወደ ንጉሡ እገባለሁ፤ ብጠፋም እጠፋለሁ።"], [17, "መርዶክዮስም ሄዶ አስቴር እንዳዘዘችው ሁሉ አደረገ። Wordproject® is a registered name of the International Biblical Association, a non-profit organization registered in Macau, China. Contact | Disclaimer | Statement of Faith | Mission | Copyrights"]]}, {"ref": "ሩት 1:6-22", "key": 10, "v": [[6, "እርስዋም በሞዓብ ምድር ሳለች እግዚአብሔር ሕዝቡን እንደ ጐበኘ እንጀራም እንደ ሰጣቸው ስለ ሰማች፥ ከሞዓብ ምድር ልትመለስ ከሁለቱ ምራቶችዋ ጋር ተነሣች።"], [7, "እርስዋም ከሁለቱ ምራቶችዋ ጋር ከተቀመጠችበት ስፍራ ወጣች፤ ወደ ይሁዳም ምድር ሊመለሱ በመንገድ ሄዱ።"], [8, "ኑኃሚንም ምራቶችዋን። ሂዱ፥ ወደ እናቶቻችሁም ቤት ተመለሱ፤ በእኔና በሞቱት እንዳደረጋችሁ፥ እግዚአብሔር ቸርነት ያድርግላችሁ።"], [9, "እግዚአብሔር በየባላችሁ ቤት ዕረፍት ይስጣችሁ አለቻቸው። ሳመቻቸውም፤ ድምፃቸውንም ከፍ አድርገው አለቀሱ።"], [10, "እነርሱም። ከአንቺ ጋር ወደ ሕዝብሽ እንመለሳለን አሉአት።"], [11, "ኑኃሚንም አለች። ልጆቼ ሆይ፥ ተመለሱ፤ ለምን ከእኔ ጋር ትሄዳላችሁ? ባሎቻችሁ የሚሆኑ ልጆች በሆዴ አሉኝን?"], [12, "ልጆቼ ሆይ፥ ተመለሱ፤ ባል ለማግባት አርጅቻለሁና ሂዱ፤ ተስፋ አለኝ ብል፥ ዛሬ ሌሊትስ እንኳ ባል ባገባ፥ ወንዶች ልጆችም ብወልድ፥"], [13, "እነርሱ እስኪያድጉ ድረስ ትቆያላችሁን? ስለ እነርሱስ ባል ማግባት ትተዋላችሁን? ልጆቼ ሆይ፥ እንዲህ አይደለም፤ የእግዚአብሔር እጅ በእኔ ወጥቶአልና ከእናንተ የተነሣ እጅግ ተመርሬአለሁ።"], [14, "ድምፃቸውንም ከፍ አድርገው እንደ ገና አለቀሱ፤ ዖርፋም አማትዋን ሳመች፤ ሩት ግን ተጠጋቻት።"], [15, "ኑኃሚንም። እነሆ፥ ባልንጀራሽ ወደ ሕዝብዋና ወደ አማልክትዋ ተመልሳለች፤ አንቺም ደግሞ ከባልንጀራሽ ጋር ተመለሽ አለቻት።"], [16, "ሩትም። ወደምትሄጅበት እሄዳለሁና፥ በምታድሪበትም አድራለሁና እንድተውሽ ከአንቺም ዘንድ እንድመለስ አታስቸግሪኝ፤ ሕዝብሽ ሕዝቤ፥ አምላክሽም አምላኬ ይሆናል፤"], [17, "በምትሞችበትም ስፍራ እሞታለሁ፥ በዚያም እቀበራለሁ፤ ከሞት በቀር አንቺንና እኔን አንዳች ቢለየን እግዚአብሔር ይህን ያድርግብኝ እንዲሁም ይጨምርብኝ አለች።"], [18, "ኑኃሚንም ከእርስዋ ጋር ለመሄድ እንደ ቈረጠች ባየች ጊዜ እርስዋን ከመናገር ዝም አለች።"], [19, "ሁሉቱም እስከ ቤተ ልሔም ድረስ ሄዱ። ወደ ቤተ ልሔምም በደረሱ ጊዜ የከተማይቱ ሰዎች ሁሉ ስለ እነርሱ። ይህች ኑኃሚን ናትን? እያሉ ተንጫጩ።"], [20, "እርስዋም። ሁሉን የሚችል አምላክ አስመርሮኛልና ማራ በሉኝ እንጂ ኑኃሚን አትበሉኝ።"], [21, "በሙላት ወጣሁ፥ እግዚአብሔርም ወደ ቤቴ ባዶዬን መለሰኝ፤ እግዚአብሔር አዋርዶኛልና፥ ሁሉንም የሚችል አምላክ አስጨንቆኛልና ኑኃሚን ለምን ትሉኛላችሁ? አለቻቸው።"], [22, "ኑኃሚንም ከእርስዋም ጋር ከሞዓብ ምድር የተመለሰችው ሞዓባዊቱ ምራትዋ ሩት ተመለሱ። የገብስም መከር በተጀመረ ጊዜ ወደ ቤተልሔም መጡ። Wordproject® is a registered name of the International Biblical Association, a non-profit organization registered in Macau, China. Contact | Disclaimer | Statement of Faith | Mission | Copyrights"]]}, {"ref": "ዘፍጥረት 3:1-24", "key": 19, "v": [[1, "እባብም እግዚአብሔር አምላክ ከፈጠረው ከምድር አውሬ ሁሉ ይልቅ ተንኰለኛ ነበረ። ሴቲቱንም። በውኑ እግዚአብሔር ከገነት ዛፍ ሁሉ እንዳትበሉ አዝዞአልን? አላት።"], [2, "ሴቲቱም ለእባቡ አለችው። በገነት ካለው ከዛፍ ፍሬ እንበላለን፤"], [3, "ነገር ግን በገነት መካከል ካለው ከዛፉ ፍሬ፥ እግዚአብሔር አለ። እንዳትሞቱ ከእርሱ አትብሉ አትንኩትም።"], [4, "እባብም ለሴቲቱ አላት። ሞትን አትሞቱም፤"], [5, "ከእርስዋ በበላችሁ ቀን ዓይኖቻችሁ እንዲከፈቱ እንደ እግዚአብሔርም መልካምንና ክፉን የምታውቁ እንድትሆኑ እግዚአብሔር ስለሚያውቅ ነው እንጂ።"], [6, "ሴቲቱም ዛፉ ለመብላት ያማረ እንደ ሆነ፥ ለዓይንም እንደሚያስጎመጅ፥ ለጥበብም መልካም እንደ ሆነ አየች፤ ከፍሬውም ወሰደችና በላች፤ ለባልዋም ደግሞ ሰጠችው እርሱም ከእርስዋ ጋር በላ።"], [7, "የሁለቱም ዓይኖች ተከፈቱ፥ እነርሱም ዕራቁታቸውን እንደ ሆኑ አወቁ፤ የበለስንም ቅጠሎች ሰፍተው ለእነርሱ ለራሳቸው ግልድም አደረጉ።"], [8, "እነርሱም ቀኑ በመሸ ጊዜ የእግዚአብሔርን የአምላክን ድምፅ ከገነት ውስጥ ሲመላለስ ሰሙ፤ አዳምና ሚስቱም ከእግዚአብሔር ከአምላክ ፊት በገነት ዛፎች መካከል ተሸሸጉ።"], [9, "እግዚአብሔር አምላክም አዳምን ጠርቶ። ወዴት ነህ? አለው።"], [10, "እርሱም አለ። በገነት ድምፅህን ሰማሁ፤ ዕራቁቴንም ስለ ሆንሁ ፈራሁ፥ ተሸሸግሁም።"], [11, "እግዚአብሔርም አለው። ዕራቁትህን እንደ ሆንህ ማን ነገረህ? ከእርሱ እንዳትበላ ካዘዝሁህ ዛፍ በውኑ በላህን?"], [12, "አዳምም አለ። ከእኔ ጋር እንድትሆን የሰጠኸኝ ሴት እርስዋ ከዛፉ ሰጠችኝና በላሁ።"], [13, "እግዚአብሔር አምላክም ሴቲቱን። ይህ ያደረግሽው ምንድር ነው? አላት። ሴቲቱም አለች። እባብ አሳተኝና በላሁ።"], [14, "እግዚአብሔር አምላክም እባቡን አለው። ይህን ስላደረግህ ከእንስሳት ከምድር አራዊትም ሁሉ ተለይተህ አንተ የተረገምህ ትሆናለህ፤ በሆድህም ትሄዳለህ፥ አፈርንም በሕይወትህ ዘመን ሁሉ ትበላለህ።"], [15, "በአንተና በሴቲቱ መካከል፥ በዘርህና በዘርዋም መካከል ጠላትነትን አደርጋለሁ፤ እርሱ ራስህን ይቀጠቅጣል፥ አንተም ሰኰናውን ትቀጠቅጣለህ።"], [16, "ለሴቲቱም አለ። በፀነስሽ ጊዜ ጭንቅሽን እጅግ አበዛለሁ፤ በጭንቅ ትወልጃለሽ፤ ፈቃድሽም ወደ ባልሽ ይሆናል፥ እርሱም ገዥሽ ይሆናል።"], [17, "አዳምንም አለው። የሚስትህን ቃል ሰምተሃልና፥ ከእርሱ እንዳትበላ ካዘዝሁህ ዛፍም በልተሃልና ምድር ከአንተ የተነሣ የተረገመች ትሁን፤ በሕይወት ዘመንህም ሁሉ በድካም ከእርስዋ ትበላለህ፤"], [18, "እሾህንና አሜከላን ታበቅልብሃለች፤ የምድርንም ቡቃያ ትበላለህ።"], [19, "ወደ ወጣህበት መሬት እስክትመለስ ድረስ በፊትህ ወዝ እንጀራን ትበላለህ፤ አፈር ነህና፥ ወደ አፈርም ትመለሳለህና።"], [20, "አዳምም ለሚስቱ ሔዋን ብሎ ስም አወጣ፥ የሕያዋን ሁሉ እናት ናትና።"], [21, "እግዚአብሔር አምላክም ለአዳምና ለሚስቱ የቁርበትን ልብስ አደረገላቸው፥ አለበሳቸውም።"], [22, "እግዚአብሔር አምላክም አለ። እነሆ አዳም መልካምንና ክፉን ለማወቅ ከእኛ እንደ አንዱ ሆነ፤ አሁንም እጁን እንዳይዘረጋ፥ ደግሞም ከሕይወት ዛፍ ወስዶ እንዳይበላ፥ ለዘላለምም ሕያው ሆኖ እንዳይኖር፤"], [23, "ስለዚህ እግዚአብሔር አምላክ ከዔድን ገነት አስወጣው፥ የተገኘባትን መሬት ያርስ ዘንድ።"], [24, "አዳምንም አስወጣው፥ ወደ ሕይወት ዛፍ የሚወስደውንም መንገድ ለመጠበቅ ኪሩቤልንና የምትገለባበጥ የነበልባል ሰይፍን በዔድን ገነት ምሥራቅ አስቀመጠ። Wordproject® is a registered name of the International Biblical Association, a non-profit organization registered in Macau, China. Contact | Disclaimer | Statement of Faith | Mission | Copyrights"]]}, {"ref": "ዘፍጥረት 21:1-8", "key": 5, "v": [[1, "እግዚአብሔርም እንደ ተናገረው ሣራን አሰበ፤ እግዚአብሔርም እንደ ተናገረው ለሣራ አደረገላት።"], [2, "ሣራም ፀነሰች፥ እግዚአብሔርም በተናገረው ወራት ለአብርሃም በእርጅናው ወንድ ልጅን ወለደችለት።"], [3, "አብርሃምም የተወለደለትን ሣራ የወለደች ፈረሱንና ፈረሰኛውን በባሕር ጣለ።"], [2, "ጕልበቴ ዝማሬዬም እግዚአብሔር ነው፥ መድኃኒቴም ሆነልኝ፤ ይህ አምላኬ ነው አመሰግነውማለሁ፥ የአባቴ አምላክ ነው ከፍ ከፍም አደርገዋለሁ።"], [3, "እግዚአብሔር ተዋጊ ነው፥ ስሙም እግዚአብሔር ነው፥"], [4, "የፈርዖንን ሰረገሎች ሠራዊቱንም በባሕር ጣላቸው፤ የተመረጡት ሦስተኞች በኤርትራ ባሕር ሰጠሙ።"], [5, "ቀላያትም ከደኑአቸው፤ ወደ ባሕር ጥልቀት እንደ ድንጋይ ሰጠሙ።"], [6, "አቤቱ፥ ቀኝህ በኃይል ከበረ፤ አቤቱ፥ ቀኝህ ጠላቱን አደቀቀ።"], [7, "በክብርህም ብዛት የተነሡብህን አጠፋህ፤ ቍጣህን ሰድደህ፥ እንደ ገለባም በላቸው።"], [8, "በአፍንጫህ እስትንፋስ ውኆች ተከመሩ፥ ፈሳሾቹም እንደ ክምር ቆሙ፤ ሞገዱም በባሕር ውስጥ ረጋ።"], [9, "ጠላትም። አሳድጄ እይዛቸዋለሁ፥ ምርኮም እካፈላለሁ፥ ነፍሴም ትጠግባቸዋለች፤ ሰይፌንም እመዝዛለሁ፥ እጄም ታጠፋቸዋለች አለ።"], [10, "ነፋስህን አነፈስህ፥ ባሕርም ከደናቸው፤ በኃይለኞች ውኆችም እንደ አረር ሰጠሙ።"], [11, "አቤቱ፥ በአማልክት መካከል እንደ አንተ ያለ ማን ነው? በምስጋና የተፈራህ፥ ድንቅንም የምታደርግ፥ በቅድስና የከበረ እንደ አንተ ያለ ማን ነው?"], [12, "ቀኝህን ዘረጋህ፥ ምድርም ዋጠቻቸው።"], [13, "በቸርነትህ የተቤዠሃቸውን ሕዝብህን መራህ፤ በኃይልህ ወደ ቅዱስ ማደሪያህ አገባሃቸው።"], [14, "አሕዛብ ሰሙ፥ ተንቀጠቀጡም፤ በፍልስጥኤም የሚኖሩትን ምጥ ያዛቸው።"], [15, "የዚያን ጊዜ የኤዶም አለቆች ደነገጡ፤ የሞአብን ኃያላን መንቀጥቀጥ ያዛቸው፤ በከነዓን የሚኖሩ ሁሉ ቀለጡ።"], [16, "አቤቱ፥ ሕዝብህ እስኪያልፍ ድረስ፥ የተቤዠኸው ሕዝብ እስኪያልፍ ድረስ፥ ፍርሃትና ድንጋጤ ወደቀባቸው፤ በክንድህ ብርታት እንደ ድንጋይ ዝም አሉ።"], [17, "አቤቱ፥ አንተ ታስገባቸዋለህ፥ በርስትህ ተራራም ትተክላቸዋለህ፥ አቤቱ፥ ለማደሪያህ ባደረግኸው ስፍራ፥ አቤቱ፥ እጆችህ ባዘጋጁት መቅደስ።"], [18, "እግዚአብሔር ለዘላለሙ እስከ ፍጻሜ ይነግሣል።"], [19, "የፈርዖን ፈረሶች ከሰረገሎቹ ከፈረሰኞቹም ጋር ወደ ባሕር ገቡ፥ እግዚአብሔርም የባሕሩን ውኆች መለሰባቸው፤ የእስራኤል ልጆች ግን በባሕሩ መካከል በየብስ ሄዱ።"], [20, "የአሮን እኅት ነቢይቱ ማሪያምም ከበሮ በእጅዋ ወሰደች፤ ሴቶችም ሁሉ በከበሮና በዘፈን በኋላዋ ወጡ።"], [21, "ማርያምም እየዘመረች መለሰችላቸው። በክብር ከፍ ከፍ ብሎአልና ለእግዚአብሔር ዘምሩ፤ ፈረሱንና ፈረሰኛውን በባሕር ጣለ።"]]}, {"ref": "ኢያሱ 2:1-21", "key": 10, "v": [[1, "የነዌም ልጅ ኢያሱ። ሄዳችሁ ምድሪቱንና ኢያሪኮን እዩ ብሎ ከሰጢም ሁለት ሰላዮች በስውር ላከ። ሄዱም፤ ረዓብም ወደሚሉአት ጋለሞታ ቤት ገቡ፥ በዚያም አደሩ።"], [2, "የኢያሪኮም ንጉሥ። እነሆ፥ ሰዎች ከእስራኤል ልጆች አገሩን ሊሰልሉ ወደዚህ በሌሊት ገቡ ሲባል ወሬ ሰማ።"], [3, "የኢያሪኮም ንጉሥ። አገሩን ሁሉ ሊሰልሉ መጥተዋልና ወደ አንቺ የመጡትን ወደ ቤትሽም የገቡትን ሰዎች አውጪ ብሎ ወደ ረዓብ ላከ።"], [4, "ሴቲቱም ሁለቱን ሰዎች ወስዳ ሸሸገቻቸው፤ እርስዋም። አዎን፥ ሰዎቹ ወደ እኔ መጡ፥ ከወዴት እንደ ሆኑ ግን አላወቅሁም፤"], [5, "በሩም ሲዘጋ ሲጨልምም ሰዎቹ ወጡ፤ ወዴት እንደ ሄዱ አላውቅም፤ ፈጥናችሁ አሳድዱአቸው፥ ታገኙአቸውማላችሁ አለች።"], [6, "እርስዋ ግን ወደ ሰገነቱ አውጥታቸው ነበር፤ በዚያም በረበረበችው በተልባ እግር ውስጥ ሸሽጋቸው ነበር።"], [7, "ሰዎቹም ወደ ዮርዳኖስ መሻገሪያ በሚወስደው መንገድ አሳደዱአቸው፤ እሳዳጆችም ከወጡ በኋላ በሩ ተቈለፈ።"], [8, "እነዚህም ሳይተኙ ሴቲቱ ወደ እነርሱ ወደ ሰገነቱ ወጣች።"], [9, "ሰዎቹንም እንዲህ አለቻቸው። እግዚአብሔር ምድሪቱን እንደ ሰጣችሁ፥ እናንተንም መፍራት በላያችን እንደ ወደቀ፥ በምድሪቱም የሚኖሩት ሁሉ ከፊታችሁ እንደ ቀለጡ አወቅሁ።"], [10, "ከግብፅ ምድር በወጣችሁ ጊዜ እግዚአብሔር የኤርትራን ባሕር በፊታችሁ እንዳደረቀ፥ በዮርዳኖስም ማዶ በነበሩት እናንተም ፈጽማችሁ ባጠፋችኋቸው በሁለቱ በአሞራውያን ነገሥታት፥ በሴዎንና በዐግ ያደረጋችሁትን ሰምተናል።"], [11, "ይህንም ነገር ሰምተን ልባችን ቀለጠ፤ አምላካችሁም እግዚአብሔር በላይ በሰማይ በታችም በምድር እርሱ አምላክ ነውና ከእናንተ የተንሣ ከዚያ ወዲያ ለማንም ነፍስ አልቀረለትም።"], [12, "አሁንም፥ እባካችሁ፥ በእግዚአብሔር ማሉልኝ፥ በእውነትም ምልክት ስጡኝ፥ እኔ ለእናንተ ቸርነት እንደ ሠራሁ እናንተ ደግሞ ለአባቴ ቤት ቸርነት እንድትሠሩ፥"], [13, "አባቴንና እናቴንም ወንድሞቼንና እኅቶቼንም ያላቸውንም ሁሉ እንድታድኑ፥ ሰውነታችንንም ከሞት እንድታድኑ።"], [14, "ሰዎቹም። ይህን ነገራችንን ባትገልጪ ነፍሳችን በነፍሳችሁ ፋንታ ለሞት ይሆናል፤ እግዚአብሔርም ምድሪቱን በሰጠን ጊዜ ከአንቺ ጋር ቸርነትንና እውነትን እናደርጋለን አሉአት።"], [15, "ቤትዋም በከተማ ቅጥር የተጠጋ ነበረና፥ እርስዋም በቅጥሩ ላይ ተቀምጣ ነበርና ከመስኮቱ በገመድ አወረደቻቸው።"], [16, "እርስዋም። አሳዳጆቹ እንዳያገኙአችሁ ወደ ተራራው ሂዱ፤ አሳዳጆቹም እስኪመለሱ ድረስ በዚያ ሦስት ቀን ተሰውራችሁ ተቀመጡ፤ ኋላም መንገዳችሁን ትሄዳላችሁ አለቻቸው።"], [17, "ሰዎቹም አሉአት። እኛ ከዚህ ካማልሽን መሐላ ንጹሐን እንሆናለን።"], [18, "እነሆ፥ እኛ ወደ አገሩ በገባን ጊዜ ይህን ቀይ ፈትል እኛን ባወረድሽበት መስኮት በኩል እሰሪው፤ አባትሽንም እናትሽንም ወንድሞችሽንም የአባትሽንም ቤተ ሰብ ሁሉ ወደ አንቺ ወደ ቤትሽ ሰብስቢ።"], [19, "ከቤትሽም ደጅ ወደ ሜዳ የሚወጣ ደሙ በራሱ ላይ ይሆናል፥ እኛም ንጹሐን እንሆናለን፤ ነገር ግን ከአንቺ ጋር በቤቱ ውስጥ ያለውን አንድ እጅ ቢነካው ደሙ በእኛ ራስ ላይ ይሆናል።"], [20, "ይህንን ነገራችንን ግን ብትገልጪ ከዚህ ካማልሽን መሐላ ንጹሐን እንሆናለን።"], [21, "እርስዋም። እንደ ቃላችሁ ይሁን አለች፤ ሰደደቻቸውም እነርሱም ሄዱ፤ ቀዩንም ፈትል በመስኮቱ በኩል አንጠለጠለችው።"]]}, {"ref": "መሳፍንት 4:1-5:7", "key": 30, "v": [[1, "ናዖድም ከሞተ በኋላ የእስራኤል ልጆች በእግዚአብሔር ፊት እንደ ገና ክፉ ሥራ ሠሩ።"], [2, "እግዚአብሔርም በአሶር በነገሠው በከነዓን ንጉሥ በኢያቢስ እጅ አሳልፎ ሰጣቸው፤ የሠራዊቱም አለቃ በአሕዛብ አሪሶት የተቀመጠው ሲሣራ ነበረ።"], [3, "የእስራኤልም ልጆች ወደ እግዚአብሔር ጮኹ፤ ዘጠኝ መቶ የብረት ሰረገሎች ነበሩትና፥ የእስራኤልንም ልጆች ሀያ ዓመት ያህል እጅግ ያስጨንቃቸው ነበር።"], [4, "በዚያ ጊዜም ነቢይቱ የለፊዶት ሚስት ዲቦራ በእስራኤል ላይ ትፈርድ ነበረች።"], [5, "እርስዋም በተራራማው በኤፍሬም አገር በራማና በቤቴል መካከል ካለው የዲቦራ ዛፍ ከሚባለው ከዘንባባው በታች ተቀምጣ ነበር፤ የእስራኤልም ልጆች ወደ እርስዋ ለፍርድ ይወጡ ነበር።"], [6, "ልካም ከቃዴስ ንፍታሌም የአቢኒኤምን ልጅ ባርቅን ጠርታ። የእስራኤል አምላክ እግዚአብሔር። ሄደህ ወደ ታቦር ተራራ ውጣ፥ ከአንተም ጋር ከንፍታሌምና ከዛብሎን ልጆች አሥር ሺህ ሰዎች ውሰድ፤"], [7, "እኔም የኢያቢስን ሠራዊት አለቃ ሲሣራን ሰረገሎቹንም ሕዝቡንም ሁሉ ወደ አንተ ወደ ቂሶን ወንዝ እስባለሁ፥ በእጅህም አሳልፌ እሰጠዋለሁ ብሎ አላዘዘህምን? አለችው።"], [8, "ባርቅም። አንቺ ከእኔ ጋር ብትሄጂ እኔ እሄዳለሁ፤ አንቺ ግን ከእኔ ጋር ባትሄጂ እኔ አልሄድም አላት።"], [9, "እርሷም። በእውነት ከአንተ ጋር እሄዳለሁ፤ ነገር ግን እግዚአብሔር ሲሣራን በሴት እጅ አሳልፎ ይሰጣልና በዚህ በምትሄድበት መንገድ ለአንተ ክብር አይሆንም አለችው። ዲቦራም ተነሥታ ከባርቅ ጋር ወደ ቃዴስ ሄደች።"], [10, "ባርቅም ዛብሎንንና ንፍታሌምን ወደ ቃዴስ ጠራቸው፥ አሥር ሺህም ሰዎች ተከትለውት ወጡ፤ ዲቦራም ከእርሱ ጋር ወጣች።"], [11, "ቄናዊውም ሔቤር ከሙሴ አማት ከኦባብ ልጆች ከቄናውያን ተለይቶ ድንኳኑን በቃዴስ አጠገብ በጻዕናይም እስከ ነበረው እስከ ትልቁ ዛፍ ድረስ ተከለ።"], [12, "የአቢኒኤምም ልጅ ባርቅ ወደ ታቦር ተራራ እንደ ወጣ ለሲሣራ ነገሩት።"], [13, "ሲሣራም ሰረገሎቹን ሁሉ፥ ዘጠኝ መቶ የብረት ሰረገሎች፥ ከእርሱም ጋር የነበሩትን ሕዝቡን ሁሉ ከአሪሶት ወደ ቂሶን ወንዝ ሰበሰባቸው።"], [14, "ዲቦራም ባርቅን። እግዚአብሔር ሲሣራን በእጅህ አሳልፎ የሚሰጥበት ቀን ዛሬ ነውና ተነሣ፤ እነሆ፥ እግዚአብሔር በፊትህ ወጥቶአል አለችው። ባርቅም አሥር ሺህ ሰዎች ተከትለውት ከታቦር ተራራ ወረደ።"], [15, "እግዚአብሔርም ሲሣራን ሰረገሎቹንም ሁሉ ሠራዊቱንም ሁሉ ከባርቅ ፊት በሰይፍ ስለት አስደነገጣቸው፤ ሲሣራም ከሰረገላው ወርዶ በእግሩ ሸሸ።"], [16, "ባርቅም ሰረገሎችንና ሠራዊቱን እስከ አሪሶት ድረስ አባረረ፤ የሲሣራም ሠራዊት ሁሉ በሰይፍ ስለት ወደቀ፤ አንድ እንኳ አልቀረም።"], [17, "በአሶር ንጉሥም በኢያቢስና በቄናዊው በሔቤር ቤት መካከል ሰላም ነበረና ሲሣራ በእግሩ ሸሽቶ ወደ ቄናዊው ወደ ሔቤር ሚስት ወደ ኢያዔል ድንኳን ደረሰ።"], [18, "ኢያዔልም ሲሣራን ለመገናኘት ወጥታ። ግባ፥ ጌታዬ ሆይ፥ ወደ እኔ ግባ፤ አትፍራ አለችው። ወደ እርስዋም ወደ ድንኳንዋ ገባ፥ በመጐናጸፊያዋም ሸፈነችው።"], [19, "እርሱም። ጠምቶኛልና እባክሽ የምጠጣው ጥቂት ውኃ ስጭኝ አላት፤ እርስዋም የወተቱን አቁማዳ ፈትታ አጠጣችው፥ ሸፈነችውም።"], [20, "እርሱም። ከድንኳኑ ደጃፍ ቁሚ፤ ሰውም መጥቶ። በዚህ ሰው አለን? ብሎ ቢጠይቅሽ አንቺ። የለም ትዪዋለሽ አላት።"], [21, "የሔቤርም ሚስት ኢያዔል የድንኳን ካስማ ወሰደች፥ በእጅዋም መዶሻ ያዘች፥ ቀስ ብላም ወደ እርሱ ቀረበች፤ በጆሮግንዱ ካስማውን ቸነከረች፤ እርሱም ደክሞ እንቀላፍቶ ነበርና ካስማው ወደ መሬት ጠለቀ፥ እርሱም ሞተ።"], [22, "እነሆም፥ ባርቅ ሲሣራን ሲያባርር ኢያዔል ልትገናኘው ወጥታ። ና የምትሻውንም ሰው አሳይሃለሁ አለችው። ወደ እርስዋም ገባ፥ እነሆም፥ ሲሣራን ወድቆ ሞቶም አገኘው፥ ካስማውም ከጆሮግንዱ ውስጥ ነበረ።"], [23, "በዚያም ቀን እግዚአብሔር የከነዓንን ንጉሥ ኢያቢስን በእስራኤል ልጆች ፊት አዋረደ።"], [24, "የከነዓንን ንጉሥ ኢያቢስንም እስኪያጠፉ ድረስ በከነዓን ንጉሥ በኢያቢስ ላይ የእስራኤል ልጆች እጅ እየበረታች ሄደች። Wordproject® is a registered name of the International Biblical Association, a non-profit organization registered in Macau, China. Contact | Disclaimer | Statement of Faith | Mission | Copyrights"], [1, "በዚያም ቀን ዲቦራና የአቢኒኤም ልጅ ባርቅ እንዲህ ብለው ተቀኙ።"], [2, "በእስራኤ አለሁና ባሪያህን እንደ ምናምንቴ ሴት አትቍጠረኝ ብላ መለሰችለት።"], [17, "ዔሊም። በደኅና ሂጂ፥ የእስራኤልም አምላክ የለመንሽውን ልመና ይስጥሽ ብሎ መለሰላት።"], [18, "እርስዋም። ባሪያህ በዓይንህ ፊት ሞገስ ላግኝ አለች። ሴቲቱም መንገድዋን ሄደች በላችም፥ ፊትዋም ከእንግዲህ ወዲያ አዘንተኛ መስሎ አልታየም።"], [19, "ማልደው ተነሥተው በእግዚአብሔር ፊት ሰገዱ፥ ተመልሰውም ወደ አርማቴም ወደ ቤታቸው መጡ። ሕልቃናም ሚስቱን ሐናን አወቃት፤ እግዚአብሔርም አሰባት፤"], [20, "የመፅነስዋም ወራት ካለፈ በኋላ ሐና ወንድ ልጅ ወለደች፤ እርስዋም። ከእግዚአብሔር ለምኜዋለሁ ስትል ስሙን ሳሙኤል ብላ ጠራችው።"], [21, "ሰውዮውም ሕልቃና ከቤተ ሰቡ ሁሉ ጋር የዓመቱን መሥዋዕትና ስእለቱን ለእግዚአብሔር ያቀርብ ዘንድ ወጣ።"], [22, "ሐና ግን አልወጣችም፥ ባልዋንም። ሕፃኑ ጡት እስኪተው ድረስ እቀመጣለሁ፤ ከዚያም በኋላ በእግዚአብሔር ፊት ይታይ ዘንድ፥ በዚያም ለዘላለም ይሆን ዘንድ አመጣዋለሁ አለችው።"], [23, "ባልዋም ሕልቃና። በዓይንሽ ደስ ያሰኘሽን አድርጊ፥ ጡትም እስኪተው ድረስ ተቀመጪ፤ ብቻ እግዚአብሔር ቃሉን ያጽና አላት። ሴቲቱም ልጅዋን እያጠባች ጡት እስኪተው ድረስ በቤትዋ ተቀመጠች።"], [24, "ጡትም በተወ ጊዜ ከእርስዋ ጋር እርሱንና አንድ የሦስት ዓመት ወይፈን፥ አንድ የኢፍ መስፈሪያ ዱቄት፥ አንድ አቁማዳ የወይን ጠጅ ይዛ ወደ ሴሎ ወደ እግዚአብሔር ቤት አመጣችው፤ ሕፃኑም ገና ታናሽ ነበረ።"], [25, "ወይፈኑንም አረዱ፥ ሕፃኑንም ወደ ዔሊ አመጡት።"], [26, "እርስዋም አለች። ጌታዬ ሆይ፥ በሕያው ነፍስህ እምላለሁ! ጌታ ሆይ፥ ወደ እግዚአብሔር ለመጸለይ በዚህ በአንተ ዘንድ ቆማ የነበረች ሴት እኔ ነኝ።"], [27, "ሰለዚህ ሕፃን ጸለይሁ፤"], [28, "እግዚአብሔርም የለመንሁትን ልመናዬን ሰጥቶኛል፤ እኔም ደግሞ ለእግዚአብሔር ሰጥቼዋለሁ፤ ዕድሜውን ሁሉ ለእግዚአብሔር የተሰጠ ይሆናል። Wordproject® is a registered name of the International Biblical Association, a non-profit organization registered in Macau, China. Contact | Disclaimer | Statement of Faith | Mission | Copyrights"]]}, {"ref": "1 ሳሙኤል 25:14-35", "key": 19, "v": [[14, "ከብላቴኖቹ አንዱ ለናባል ሚስት ለአቢግያ እንዲህ ብሎ ነገራት። እነሆ፥ ዳዊት በምድረ በዳ ሳለ ጌታችንን ሊባርኩ መልእክተኞች ላከ፤ እርሱ ግን ሰደባቸው።"], [15, "እነዚህ ሰዎች ግን በእኛ ዘንድ እጅግ መልካም ነበሩ፤ አልበደሉንምም፥ ከእነርሱም በሄድንበት ዘመን ሁሉ በምድረ በዳ ሳለን አንዳች አልጠፋብንም፤"], [16, "ከእነርሱ ጋር ሆነን መንጋውን በጠበቅንበት ዘመን ሁሉ ሌሊትና ቀን አጥር ሆነውን ነበር።"], [17, "ስለዚህም በጌታችንና በቤቱ ሁሉ ላይ ክፉ ነገር እንዲመጣ ተቈርጦአልና፥ እርሱ ምናምንቴ ሰው ስለ ሆነ ማንም ሊናገረው አይችልምና የምታደርጊውን ተመልከቺና እወቂ።"], [18, "አቢግያም ፈጥና ሁለት መቶ እንጀራ፥ ሁለት አቁማዳ የወይን ጠጅ፥ አምስትም የተዘጋጁ በጎች፥ አምስትም መስፈሪያ ጥብስ እሸት፥ አንድ መቶ ዘለላ ዘቢብ፥ ሁለት መቶም የበለስ ጥፍጥፍ ወሰደች፥ በአህዮችም ላይ አስጫነች።"], [19, "ለብላቴኖችዋም። አስቀድማችሁ በፊቴ ሂዱ፥ እነሆም፥ እከተላችኋለሁ አለች። ይህንም ለባልዋ ለናባል አልነገረችውም።"], [20, "እርስዋም በአህያው ላይ ተቀምጣ በተራራው ላይ በተሰወረ ስፍራ በወረደች ጊዜ፥ እነሆ፥ ዳዊትና ሰዎቹ ወደ እርስዋ ወረዱ፤ እርስዋም ተገናኘቻቸው።"], [21, "ዳዊትም። ለዚህ ሰው ከሆነው ሁሉ አንድ ነገር እንዳይጠፋበት በእውነት ከብቱን ሁሉ በምድረ በዳ በከንቱ ጠበቅሁ፥ እርሱም ስለ በጎነቴ ክፋት መለሰልኝ።"], [22, "ለእርሱም ከሆነው ሁሉ እስከ ነገ ጥዋት ድረስ አንድ ወንድ ስንኳ ብተው፥ እግዚአብሔር በዳዊት ላይ እንዲህ ያድርግ እንዲህም ይጨምር ብሎ ነበር።"], [23, "አቢግያም ዳዊትን ባየች ጊዜ ከአህያዋ ላይ ፈጥና ወረደች፥ በዳዊትም ፊት በግምባርዋ ወደቀች፥ በምድርም ላይ እጅ ነሣች።"], [24, "በእግሩም ላይ ወደቀች፥ እንዲህም አለች። ጌታዬ ሆይ፥ ይህ ኃጢአት በእኔ ላይ ይሁን፤ እኔ ባሪያህ በጆሮህ ልናገር፥ የባሪያህንም ቃል አድምጥ።"], [25, "በዚህ ምናምንቴ ሰው በናባል ላይ ጌታዬ ልቡን እንዳይጣል እለምናለሁ፤ እንደ ስሙ እንዲሁ እርሱ ነው፤ ስሙ ናባል ነው፥ ስንፍናም አድሮበታል፤ እኔ ባሪያህ ግን ከአንተ የተላኩትን የጌታዬን ጕልማሶች አላየሁም።"], [26, "አሁንም፥ ጌታዬ ሆይ፥ ሕያው እግዚአብሔርን! በሕያው ነፍስህም እምላለሁ! ወደ ደም እንዳትገባ፥ እጅህም ራስህን እንዳታድን የከለከለህ እግዚአብሔር ነው፤ አሁንም ጠላቶችህና በጌታዬ ላይ ክፉ የሚሹ ሁሉ እንደ ናባል ይሁኑ።"], [27, "አሁንም ባሪያህ ወደ ጌታዬ ያመጣችው ይህ መተያያ ጌታዬን ለሚከተሉ ጕልማሶች ይሰጥ።"], [28, "የእግዚአብሔርን ጦርነት ስለምትዋጋ እግዚአብሔር በእውነት ለጌታዬ የታመነ ቤት ይሠራልና የእኔን የባሪያህን ኃጢአት፥ እባክህ፥ ይቅር በል፤ በዘመንህም ሁሉ ክፋት አይገኝብህም።"], [29, "ያሳድድህ ዘንድ ነፍስህንም ይሻ ዘንድ ሰው ቢነሣ፥ የጌታዬ ነፍስ በሕያዋን ወገን በአምላክህ በእግዚአብሔር ዘንድ የታሰረች ትሆናለች፤ የጠላቶችህንም ነፋስ ከወንጭፍ እንደሚጣል እንዲሁ ይጥላታል።"], [30, "እግዚአብሔርም ለጌታዬ የተናገረውን ቸርነት ሁሉ ባደረገልህ ጊዜ፥ በእስራኤልም ላይ አለቃ አድርጎ ባስነሣህ ጊዜ፥"], [31, "አንተ በከንቱ ደም እንዳላፈሰስህ፥ በገዛ እጅህም እንዳልተካስህ ይህ ዕንቅፋትና የሕሊና ጸጸት በጌታዬ አይሆንልህም፤ እግዚአብሔርም ለጌታዬ በጎ ባደረገልህ ጊዜ፥ ባሪያህን አስብ።"], [32, "ዳዊትም አቢግያን አላት። ዛሬ እኔን ለመገናኘት አንቺን የሰደደ የእስራኤል አምላክ እግዚአብሔር ይመስገን።"], [33, "ወደ ደም እንዳልሄድ፥ በእጄም በቀል እንዳላደርግ ዛሬ የከለከለኝ አእምሮሽ የተመሰገነ ይሁን፥ አንቺም የተመሰገንሽ ሁኚ።"], [34, "ነገር ግን ክፉ እንዳላደርግብሽ የከለከለኝ የእስራኤል አምላክ ሕያው እግዚአብሔርን! እኔን ለመገናኘት ፈጥነሽ ባልመጣሽ ኖሮ እስኪነጋ ድረስ ለናባል አንድ ወንድ ስንኳ ባልቀረውም ነበር።"], [35, "ዳዊትም ያመጣችውን ከእጅዋ ተቀብሎ። በደኅና ወደቤትሽ ሂጂ፤ እነሆ፥ ቃልሽን ሰማሁ፥ ፊትሽንም አከበርሁ አላት።"]]}, {"ref": "1 ነገሥት 10:1-13", "key": 8, "v": [[1, "የሳባም ንግሥት በእግዚአብሔር ስም የወጣለትን የሰሎሞንን ዝና በሰማች ጊዜ በእንቆቅልሽ ትፈትነው ዘንድ መጣች።"], [2, "በግመሎችም ላይ ሽቱና እጅግ ብዙ ወርቅ የከበረም ዕንቍ አስጭና ከታላቅ ጓዝ ጋር ወደ ኢየሩሳሌም ገባች፤ ወደ ሰሎሞንም በመጣች ጊዜ በልብዋ ያለውን ሁሉ አጫወተችው።"], [3, "ሰሎሞንም የጠየቀችውን ሁሉ ፈታላት፤ ሊፈታላት ያልቻለውና ከንጉሡ የተሰወረ ነገር አልነበረም።"], [4, "የሳባም ንግሥት የሰሎሞንን ጥበብ ሁሉ፥ ሠርቶትም የነበረውን ቤት፥"], [5, "የማዕዱንም መብል፥ የብላቴኖቹንም አቀማመጥ፥ የሎሌዎቹንም አሠራር አለባበሳቸውንም፥ ጠጅ አሳላፊዎቹንም፥ በእግዚአብሔርም ቤት የሚያሳርገውን መሥዋዕት ባየች ጊዜ ነፍስ አልቀረላትም።"], [6, "ንጉሡንም አለችው። ስለ ነገርህና ስለ ጥበብህ በአገሬ ሳለሁ የሰማሁት ዝና እውነት ነው።"], [7, "እኔም መጥቼ በዓይኔ እስካይ ድረስ የነገሩኝን አላመንሁም ነበር፤ እነሆም፥ እኩሌታውን አልነገሩኝም ነበር፤ ጥበብህና ሥራህ ከሰማሁት ዝና ይበልጣል።"], [8, "በፊትህ ሁልጊዜ የሚቆሙ ጥበብህንም የሚሰሙ ሰዎችህና እነዚህ ባሪያዎችህ ምስጉኖች ናቸው።"], [9, "አንተን የወደደ፥ በእስራኤልም ዙፋን ያስቀመጠህ አምላክህ እግዚአብሔር የተባረከ ይሁን፤ እግዚአብሔር እስራኤልን ለዘላለም ወድዶታልና ስለዚህ ጽድቅና ፍርድ ታደርግ ዘንድ ንጉሥ አድርጎ አስነሣህ።"], [10, "ለንጉሡም መቶ ሀያ መክሊት ወርቅ እጅግም ብዙ ሽቱ የከበረም ዕንቍ ሰጠችው፤ የሳባ ንግሥት ለንጉሡ ለሰሎሞን እንደ ሰጠችው ያለ የሽቱ ብዛት ከዚያ ወዲያ አልመጣም ነበር።"], [11, "ከኦፊርም ወርቅ ያመጡ የኪራም መርከቦች እጅግ ብዙ የሰንደል እንጨትና የከበረ ዕንቍ ከኦፊር አመጡ።"], [12, "ንጉሡም ከሰንደሉ እንጨት ለእግዚአብሔር ቤትና ለንጉሡ ቤት መከታ፥ ለመዘምራኑም መሰንቆና በገና አደረገ፤ እስከ ዛሬም ድረስ እንደዚያ ያለ የሰንደል እንጨት ከቶ አልመጣም አልታየምም።"], [13, "ንጉሡም ሰሎሞን፥ በገዛ እጁ ከሰጣት ሌላ፥ የወደደችውን ሁሉ ከእርሱም የለመነችውን ሁሉ ለሳባ ንግሥት ሰጣት፤ እርስዋም ተመልሳ ከባሪያዎችዋ ጋር ወደ ምድርዋ ሄደች።"]]}, {"ref": "ሉቃስ 1:39-45", "key": 6, "v": [[39, "ማርያምም በዚያ ወራት ተነሥታ ወደ ተራራማው አገር ወደ ይሁዳ ከተማ ፈጥና ወጣች፥"], [40, "ወደ ዘካርያስም ቤት ገብታ ኤልሳቤጥን ተሳለመቻት።"], [41, "ኤልሳቤጥም የማርያምን ሰላምታ በሰማች ጊዜ ፅንሱ በማኅፀንዋ ውስጥ ዘለለ፤ በኤልሳቤጥም መንፈስ ቅዱስ ሞላባት፥"], [42, "በታላቅ ድምፅም ጮኻ እንዲህ አለች። አንቺ ከሴቶች መካከል የተባረክሽ ነሽ፥ የማኅፀንሽም ፍሬ የተባረከ ነው።"], [43, "የጌታዬ እናት ወደ እኔ ትመጣ ዘንድ እንዴት ይሆንልኛል?"], [44, "እነሆ፥ የሰላምታሽ ድምጽ በጆሮዬ በመጣ ጊዜ ፅንሱ በማኅፀኔ በደስታ ዘሎአልና።"], [45, "ከጌታ፤ የተነገረላት ቃል ይፈጸማልና ያመነች ብፅዕት ናት።"]]}, {"ref": "ሉቃስ 1:26-38", "key": 12, "v": [[26, "በስድስተኛውም ወር መልአኩ ገብርኤል ናዝሬት ወደምትባል ወደ ገሊላ ከተማ፥"], [27, "ከዳዊት ወገን ለሆነው ዮሴፍ ለሚባል ሰው ወደ ታጨች ወደ አንዲት ድንግል ከእግዚአብሔር ዘንድ ተላከ፥ የድንግሊቱም ስም ማርያም ነበረ።"], [28, "መልአኩም ወደ እርስዋ ገብቶ። ደስ ይበልሽ፥ ጸጋ የሞላብሽ ሆይ፥ ጌታ ከአንቺ ጋር ነው፤ አንቺ ከሴቶች መካከል የተባረክሽ ነሽ አላት።"], [29, "እርስዋም ባየችው ጊዜ ከንግግሩ በጣም ደነገጠችና። ይህ እንዴት ያለ ሰላምታ ነው? ብላ አሰበች።"], [30, "መልአኩም እንዲህ አላት። ማርያም ሆይ፥ በእግዚአብሔር ፊት ጸጋ አግኝተሻልና አትፍሪ።"], [31, "እነሆም፥ ትፀንሻለሽ ወንድ ልጅም ትወልጃለሽ፥ ስሙንም ኢየሱስ ትዪዋለሽ።"], [32, "እርሱ ታላቅ ይሆናል የልዑል ልጅም ይባላል፥ ጌታ አምላክም የአባቱን የዳዊትን ዙፋን ይሰጠዋል፤"], [33, "በያዕቆብ ቤትም ላይ ለዘለላም ይነግሣል፥ ለመንግሥቱም መጨረሻ የለውም።"], [34, "ማርያምም መልአኩን። ወንድ ስለማላውቅ ይህ እንዴት ይሆናል? አለችው።"], [35, "መልአኩም መልሶ እንዲህ አላት። መንፈስ ቅዱስ በአንቺ ላይ ይመጣል፥ የልዑልም ኃይል ይጸልልሻል ስለዚህ ደግሞ ከአንቺ የሚወለደው ቅዱስ የእግዚአብሔር ልጅ ይባላል።"], [36, "እነሆም ዘመድሽ ኤልሳቤጥ፥ እርስዋ ደግሞ በእርጅናዋ ወንድ ልጅ ፀንሳለች፥ ለእርስዋም መካን ትባል ለነበረችው ይህ ስድስተኛ ወር ነው፤"], [37, "ለእግዚአብሔር የሚሳነው ነገር የለምና።"], [38, "ማርያምም። እነሆኝ የጌታ ባሪያ እንደ ቃልህ ይሁንልኝ አለች። መልአኩም ከእርስዋ ሄደ።"]]}, {"ref": "ዮሐንስ 20:1-18", "key": 17, "v": [[1, "ከሳምንቱም በፊተኛው ቀን መግደላዊት ማርያም ገና ጨለማ ሳለ ማለዳ ወደ መቃብር መጣች ድንጋዩም ከመቃብሩ ተፈንቅሎ አየች።"], [2, "እየሮጠችም ወደ ስምዖን ጴጥሮስና ኢየሱስ ይወደው ወደ ነበረው ወደ ሌላው ደቀ መዝሙር መጥታ። ጌታን ከመቃብር ወስደውታል ወዴትም እንዳኖሩት አናውቅም አለቻቸው።"], [3, "ስለዚህ ጴጥሮስና ሌላው ደቀ መዝሙር ወጥተው ወደ መቃብሩ ሄዱ።"], [4, "ሁለቱም አብረው ሮጡ፤ ሌላው ደቀ መዝሙርም ከጴጥሮስ ይልቅ ፈጥኖ ወደ ፊት ሮጠና አስቀድሞ ከመቃብሩ ደረሰ፤"], [5, "ዝቅም ብሎ ቢመለከት የተልባ እግሩን ልብስ ተቀምጦ አየ፥ ነገር ግን አልገባም።"], [6, "ስምዖን ጴጥሮስም ተከትሎት መጣ ወደ መቃብሩም ገባ፤ የተልባ እግሩን ልብስ ተቀምጦ አየ፥"], [7, "ደግሞም በራሱ የነበረውን ጨርቅ ለብቻው በአንድ ስፍራ ተጠምጥሞ እንደ ነበረ እንጂ ከተልባ እግሩ ልብስ ጋር ተቀምጦ እንዳልነበረ አየ።"], [8, "በዚያን ጊዜ አስቀድሞ ወደ መቃብር የመጣውም ሌላው ደቀ መዝሙር ደግሞ ገባ፥ አየም፥ አመነም፤"], [9, "ከሙታን ይነሣ ዘንድ እንዲገባው የሚለውን የመጽሐፉን ቃል ገና አላወቁም ነበርና።"], [10, "ደቀ መዛሙርቱም ወደ ቤታቸው ደግሞ ሄዱ።"], [11, "ማርያም ግን እያለቀሰች ከመቃብሩ በስተ ውጭ ቆማ ነበር። ስታለቅስም ወደ መቃብር ዝቅ ብላ ተመለከተች፤"], [12, "ሁለት መላእክትም ነጭ ልብስ ለብሰው የኢየሱስ ሥጋ ተኝቶበት በነበረው አንዱ በራስጌ ሌላውም በእግርጌ ተቀምጠው አየች።"], [13, "እነርሱም። አንቺ ሴት፥ ስለ ምን ታለቅሻለሽ? አሉአት። እርስዋም። ጌታዬን ወስደውታል ወዴትም እንዳኖሩት አላውቅም አለቻቸው።"], [14, "ይህንም ብላ ወደ ኋላ ዘወር ስትል ኢየሱስን ቆሞ አየችው፤ ኢየሱስም እንደ ሆነ አላወቀችም።"], [15, "ኢየሱስም። አንቺ ሴት፥ ስለ ምን ታለቅሻለሽ? ማንንስ ትፈልጊያለሽ? አላት። እርስዋም የአትክልት ጠባቂ መስሎአት። ጌታ ሆይ፥ አንተ ወስደኸው እንደ ሆንህ ወዴት እንዳኖርኸው ንገረኝ እኔም እወስደዋለሁ አለችው።"], [16, "ኢየሱስም። ማርያም አላት። እርስዋ ዘወር ብላ በዕብራይስጥ። ረቡኒ አለችው፤ ትርጓሜውም። መምህር ሆይ ማለት ነው።"], [17, "ኢየሱስም። ገና ወደ አባቴ አላረግሁምና አትንኪኝ፤ ነገር ግን ወደ ወንድሞቼ ሄደሽ። እኔ ወደ አባቴና ወደ አባታችሁ ወደ አምላኬና ወደ አምላካችሁ ዓርጋለሁ ብለሽ ንገሪአቸው አላት።"], [18, "መግደላዊት ማርያም መጥታ ጌታን እንዳየች ይህንም እንዳላት ለደቀ መዛሙርቱ ነገረች።"]]}, {"ref": "ዮሐንስ 11:17-27", "key": 10, "v": [[17, "ኢየሱስም በመጣ ጊዜ በመቃብር እስከ አሁን አራት ቀን ሆኖት አገኘው።"], [18, "ቢታንያም አሥራ አምስት ምዕራፍ ያህል ለኢየሩሳሌም ቅርብ ነበረች።"], [19, "ከአይሁድም ብዙዎች ስለ ወንድማቸው ሊያጽናኑአቸው ወደ ማርታና ወደ ማርያም መጥተው ነበር።"], [20, "ማርታም ኢየሱስ እንደ መጣ በሰማች ጊዜ ልትቀበለው ወጣች፤ ማርያም ግን በቤት ተቀምጣ ነበር።"], [21, "ማርታም ኢየሱስን። ጌታ ሆይ፥ አንተ በዚህ ኖረህ ብትሆን ወንድሜ ባልሞተም ነበር፤"], [22, "አሁንም ከእግዚአብሔር የምትለምነውን ሁሉ እግዚአብሔር እንዲሰጥህ አውቃለሁ አለችው።"], [23, "ኢየሱስም። ወንድምሽ ይነሣል አላት።"], [24, "ማርታም። በመጨረሻው ቀን በትንሣኤ እንዲነሣ አውቃለሁ አለችው።"], [25, "ኢየሱስም። ትንሣኤና ሕይወት እኔ ነኝ፤ የሚያምንብኝ ቢሞት እንኳ ሕያው ይሆናል፤"], [26, "ሕያው የሆነም የሚያምንብኝም ሁሉ ለዘላለም አይሞትም፤ ይህን ታምኚያለሽን? አላት።"], [27, "እርስዋም። አዎን ጌታ ሆይ፤ አንተ ወደ ዓለም የሚመጣው ክርስቶስ የእግዚአብሔር ልጅ እንደ ሆንህ እኔ አምናለሁ አለችው።"]]}, {"ref": "ዮሐንስ 4:5-30", "key": 24, "v": [[5, "ስለዚህ ያዕቆብ ለልጁ ለዮሴፍ በሰጠው ስፍራ አጠገብ ወደምትሆን ሲካር ወደምትባል የሰማርያ ከተማ መጣ፤"], [6, "በዚያም የያዕቆብ ጕድጓድ ነበረ። ኢየሱስም መንገድ ከመሄድ ደክሞ በጕድጓድ አጠገብ እንዲህ ተቀመጠ፤ ጊዜውም ስድስት ሰዓት ያህል ነበረ።"], [7, "ከሰማርያ አንዲት ሴት ውኃ ልትቀዳ መጣች። ኢየሱስም። ውኃ አጠጪኝ አላት፤"], [8, "ደቀ መዛሙርቱ ምግብ ሊገዙ ወደ ከተማ ሄደው ነበርና።"], [9, "ስለዚህ ሳምራዊቲቱ። አንተ የይሁዳ ሰው ስትሆን ሳምራዊት ሴት ከምሆን ከእኔ መጠጥ እንዴት ትለምናለህ? አለችው፤ አይሁድ ከሳምራውያን ጋር አይተባበሩም ነበርና።"], [10, "ኢየሱስ መልሶ። የእግዚአብሔርን ስጦታና። ውኃ አጠጪኝ የሚልሽ ማን መሆኑንስ ብታውቂ፥ አንቺ ትለምኚው ነበርሽ የሕይወትም ውኃ ይሰጥሽ ነበር አላት።"], [11, "ሴቲቱ። ጌታ ሆይ፥ መቅጃ የለህም ጕድጓዱም ጥልቅ ነው፤ እንግዲህ የሕይወት ውኃ ከወዴት ታገኛለህ?"], [12, "በእውኑ አንተ ይህን ጕድጓድ ከሰጠን ከአባታችን ከያዕቆብ ትበልጣለህን? ራሱም ልጆቹም ከብቶቹም ከዚህ ጠጥተዋል አለችው።"], [13, "ኢየሱስም መልሶ። ከዚህ ውኃ የሚጠጣ ሁሉ እንደ ገና ይጠማል፤"], [14, "እኔ ከምሰጠው ውኃ የሚጠጣ ሁሉ ግን ለዘላለም አይጠማም፥ እኔ የምሰጠው ውኃ በእርሱ ውስጥ ለዘላለም ሕይወት የሚፈልቅ የውኃ ምንጭ ይሆናል እንጂ አላት።"], [15, "ሴቲቱ። ጌታ ሆይ፥ እንዳልጠማ ውኃም ልቀዳ ወደዚህ እንዳልመጣ ይህን ውኃ ስጠኝ አለችው።"], [16, "ኢየሱስም። ሂጂና ባልሽን ጠርተሽ ወደዚህ ነዪ አላት።"], [17, "ሴቲቱ መልሳ። ባል የለኝም አለችው። ኢየሱስ። ባል የለኝም በማለትሽ መልካም ተናገርሽ፤"], [18, "አምስት ባሎች ነበሩሽና፥ አሁን ከአንቺ ጋር ያለው ባልሽ አይደለም፤ በዚህስ እውነት ተናገርሽ አላት።"], [19, "ሴቲቱ። ጌታ ሆይ፥ አንተ ነቢይ እንደ ሆንህ አያለሁ።"], [20, "አባቶቻችን በዚህ ተራራ ሰገዱ፤ እናንተም። ሰው ሊሰግድበት የሚገባው ስፍራ በኢየሩሳሌም ነው ትላላችሁ አለችው።"], [21, "ኢየሱስም እንዲህ አላት። አንቺ ሴት፥ እመኚኝ፥ በዚህ ተራራ ወይም በኢየሩሳሌም ለአብ የማትሰግዱበት ጊዜ ይመጣል።"], [22, "እናንተስ ለማታውቁት ትሰግዳላችሁ፤ እኛ መዳን ከአይሁድ ነውና ለምናውቀው እንሰግዳለን።"], [23, "ነገር ግን በእውነት የሚሰግዱ ለአብ በመንፈስና በእውነት የሚሰግዱበት ጊዜ ይመጣል አሁንም ሆኖአል፤ አብ ሊሰግዱለት እንደ እነዚህ ያሉትን ይሻልና፤"], [24, "እግዚአብሔር መንፈስ ነው፥ የሚሰግዱለትም በመንፈስና በእውነት ሊሰግዱለት ያስፈልጋቸዋል።"], [25, "ሴቲቱ። ክርስቶስ የሚባል መሲሕ እንዲመጣ አውቃለሁ፤ እርሱ ሲመጣ ሁሉን ይነግረናል አለችው።"], [26, "ኢ
